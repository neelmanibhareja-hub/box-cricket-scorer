<script>
const WEBHOOK_URL = 'https://n8n.barandates.in/webhook/cricket';
const API_TIMEOUT = 12000; // per attempt, reads
const API_TIMEOUT_FAST = 10000; // per attempt, writes
const API_ATTEMPTS = 3;          // a write is retried with the SAME client_req_id, so the server applies it once
// Writes that need the server's answer (ids, innings reset, undo) are never queued for later replay.
const _noQueueActions = new Set(['create_match','set_toss','start_innings','undo_ball','end_innings','undo_end_innings','delete_match']);
function _newReqId() {
  try { return crypto.randomUUID(); } catch(e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
}
const _sleep = ms => new Promise(r => setTimeout(r, ms));
// Bumped when a write starts and when it lands; a poll that straddles a write is discarded.
let _apiWriteSeq = 0;

function sanitizeName(name) {
  return (name||'').replace(/<[^>]*>/g,'').replace(/['"<>&]/g,'').trim().slice(0,30);
}

function safeStorage(key, value) {
  try { localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); return true; }
  catch(e) { showToast('Storage full! Clear old matches.'); return false; }
}

const _offlineQueue = {
  dbName: 'cricket_offline', storeName: 'queue',
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(this.storeName, { autoIncrement: true });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async enqueue(action, data) {
    const db = await this.open();
    const tx = db.transaction(this.storeName, 'readwrite');
    tx.objectStore(this.storeName).add({ action, data, timestamp: Date.now() });
    return new Promise(r => { tx.oncomplete = r; });
  },
  async dequeueAll() {
    const db = await this.open();
    const tx = db.transaction(this.storeName, 'readwrite');
    const store = tx.objectStore(this.storeName);
    const items = await new Promise(r => { const req = store.getAll(); req.onsuccess = () => r(req.result); });
    store.clear();
    return items;
  }
};

const _writeActions = ['record_ball', 'create_match', 'set_toss', 'start_innings', 'set_bowler', 'swap_strike', 'undo_ball', 'add_player', 'rename_player', 'set_avatar', 'delete_match', 'end_innings', 'undo_end_innings', 'retire_batsman', 'add_quick_batsman', 'set_striker'];

let _loaderCount = 0;
const _silentActions = new Set(['get_state','list_matches','get_scorecard','get_timeline','get_ball_stats','get_match','get_player_profile','list_all_players','verify_access','save_push_subscription','register_user','list_users','get_highlights','save_highlight','get_all_highlights','set_striker','swap_strike','start_live','live_segment','get_live','stop_live','get_bhav','get_grounds','get_analytics','get_ai_odds','set_ai_odds','log_visitor','get_visitors']);
function showLoader() {
  _loaderCount++;
  const el = document.getElementById('global-loader');
  if(el) el.classList.add('active');
}
function hideLoader() {
  _loaderCount = Math.max(0, _loaderCount - 1);
  if(_loaderCount === 0) {
    const el = document.getElementById('global-loader');
    if(el) el.classList.remove('active');
  }
}

// Dedup map: if 4 viewer tabs call get_scorecard at the same ms,
// only 1 actual n8n execution fires — all 4 get the same result.
const _inFlight = new Map();

async function apiCall(action, data = {}) {
  const isSilent = _silentActions.has(action);
  const isWrite = _writeActions.includes(action);
  if(isSilent && !isWrite) {
    const key = action + ':' + JSON.stringify(data);
    if(_inFlight.has(key)) return _inFlight.get(key);
    const p = _apiExec(action, data, isSilent, isWrite).finally(() => _inFlight.delete(key));
    _inFlight.set(key, p);
    return p;
  }
  return _apiExec(action, data, isSilent, isWrite);
}

// For multi-step flows (score-only, super over, rematch): stop at the first failed step
// instead of navigating on as if it had worked.
async function apiCallOk(action, data) {
  const r = await apiCall(action, data);
  if (r && r.error) throw new Error(r.error);
  if (r && r.status === 'queued_offline') throw new Error('No connection — please try again when online');
  return r;
}

async function _apiExec(action, data, isSilent, isWrite) {
  if(!isSilent) showLoader();
  // One id per logical write, reused by every retry and by the offline queue.
  if (isWrite && !data.client_req_id) data = { ...data, client_req_id: _newReqId() };
  if (isWrite) _apiWriteSeq++;
  try {
    if (!navigator.onLine) {
      if (isWrite && !_noQueueActions.has(action)) {
        await _offlineQueue.enqueue(action, data);
        showToast('Saved offline — will sync when connected');
        return { status: 'queued_offline' };
      }
      if (isWrite) return { error: 'You are offline — check your connection and try again' };
      throw new Error('You are offline');
    }
    let lastErr = 'Network error';
    for (let attempt = 1; attempt <= API_ATTEMPTS; attempt++) {
      const _ac = new AbortController();
      const _to = setTimeout(() => _ac.abort(), isWrite ? API_TIMEOUT_FAST : API_TIMEOUT);
      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action, ...data}),
          signal: _ac.signal
        });
        const text = await res.text();
        clearTimeout(_to);
        let json = null;
        try { json = text ? JSON.parse(text) : null; } catch(e) { json = null; }
        if (json && json._retry) { lastErr = 'Server busy'; }                    // lost a write race — safe to resend
        else if (!res.ok && res.status >= 500) { lastErr = 'Server error ' + res.status; }
        else if (json && typeof json === 'object') { if (isWrite) _apiWriteSeq++; return json; }
        else if (!res.ok) { return { error: 'Server error ' + res.status }; }
        else { lastErr = 'Empty response from server'; }
      } catch(e) {
        clearTimeout(_to);
        lastErr = e.name === 'AbortError' ? 'Request timed out' : 'Network error';
      }
      if (attempt < API_ATTEMPTS) await _sleep(400 * attempt + Math.random() * 300);
    }
    // reads keep the old contract (throw); writes return {error} like a server-side failure
    if (!isWrite) throw new Error(lastErr + ' — tap Sync to retry');
    return { error: lastErr + ' — please try again' };
  } finally {
    if(!isSilent) hideLoader();
  }
}

function _showOfflineBanner(show) {
  let banner = document.getElementById('offline-banner');
  if (show && !banner) {
    banner = document.createElement('div');
    banner.id = 'offline-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:400;background:#f59e0b;color:#000;text-align:center;padding:6px;font-size:12px;font-weight:700';
    banner.textContent = 'You are offline \u2014 changes will sync when connected';
    document.body.prepend(banner);
  } else if (!show && banner) {
    banner.remove();
  }
}

window.addEventListener('offline', () => _showOfflineBanner(true));

let _flushing = false;
async function _flushOfflineQueue() {
  if(!navigator.onLine || _flushing) return;
  _flushing = true;
  try {
    const items = await _offlineQueue.dequeueAll();
    if(items.length === 0) return;
    showToast('Syncing ' + items.length + ' action' + (items.length > 1 ? 's' : '') + '...');
    let failed = 0;
    for(const item of items) {
      // Same client_req_id as the original tap -> the server ignores it if it already has it
      const data = item.data && item.data.client_req_id ? item.data : { ...(item.data||{}), client_req_id: _newReqId() };
      try {
        const _ac = new AbortController();
        const _to = setTimeout(() => _ac.abort(), 10000);
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: item.action, ...data}),
          signal: _ac.signal
        });
        const text = await res.text();
        clearTimeout(_to);
        let j = null; try { j = JSON.parse(text); } catch(e) {}
        if (!res.ok || !j || j._retry) throw new Error('retry');
      } catch(e) {
        failed++;
        await _offlineQueue.enqueue(item.action, data);
      }
    }
    if (!failed) showToast('Sync complete!');
    const {page} = getRoute();
    if (page === 'scoring' && state.matchId) refreshScoring();
  } finally { _flushing = false; }
}

setInterval(_flushOfflineQueue, 10000);

window.addEventListener('online', async () => {
  _showOfflineBanner(false);
  _flushOfflineQueue();
  const {page} = getRoute();
  if (page === 'scoring' && state.matchId) refreshScoring();
  else if (page === 'home') renderHome();
});

if (!navigator.onLine) _showOfflineBanner(true);

let state = {
  matchId: null, match: null, innings: 1,
  score: {runs:0, wickets:0, balls:0, extras:0},
  target: null, onStrike: null, nonStriker: null, bowler: null,
  thisOver: [], battingCard: [], bowlingCard: [], isFreeHit: false,
  availableBatsmen: [], availableBowlers: [],
  allMatches: [], pendingRequest: false,
  battingTeam: '', bowlingTeam: '', _activeTab: 'batting'
};

// Ground feature state
let _groundCoords = null; // {lat, lng} captured when user taps "Pin location"

function _haversine(lat1, lng1, lat2, lng2) {
  if (!lat2 || !lng2) return 999;
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function _loadGroundSuggestions() {
  try {
    const res = await apiCall('get_grounds');
    const grounds = res.grounds || [];
    const dl = document.getElementById('ground-suggestions');
    if (dl) dl.innerHTML = grounds.map(g => `<option value="${g.name.replace(/"/g,'&quot;')}">`).join('');
    if (_groundCoords && grounds.length) {
      const nearby = grounds
        .map(g => ({ ...g, dist: _haversine(_groundCoords.lat, _groundCoords.lng, g.lat || 0, g.lng || 0) }))
        .filter(g => g.dist < 25)
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 5);
      _showGroundChips(nearby);
    }
  } catch(e) {}
}

function _showGroundChips(grounds) {
  const el = document.getElementById('ground-chips');
  if (!el) return;
  if (!grounds.length) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = '<span style="font-size:11px;color:var(--text2);width:100%;font-weight:600">Nearby:</span>' +
    grounds.map(g => {
      const distLabel = g.dist < 1 ? Math.round(g.dist*1000)+'m' : g.dist.toFixed(1)+'km';
      const safeName = g.name.replace(/'/g, "\\'");
      return `<button onclick="document.getElementById('inp-ground').value='${safeName}'" style="padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;touch-action:manipulation;cursor:pointer">
        🏟 ${g.name} <span style="color:var(--text2)">${distLabel}</span>
      </button>`;
    }).join('');
}

function _pinGroundLocation() {
  const btn = document.getElementById('btn-pin-loc');
  if (!navigator.geolocation) { showToast('Location not supported on this device'); return; }
  if (btn) { btn.textContent = '📍 Locating...'; btn.disabled = true; }
  navigator.geolocation.getCurrentPosition(pos => {
    _groundCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if (btn) { btn.textContent = '✓ Pinned'; btn.style.color = '#16a34a'; btn.disabled = false; }
    _loadGroundSuggestions();
  }, () => {
    if (btn) { btn.textContent = '📍 Pin location'; btn.disabled = false; }
    showToast('Location access denied');
  }, { timeout: 10000, enableHighAccuracy: false });
}

const formatOvers = b => Math.floor(b/6)+'.'+b%6;
const calcRR = (r,b) => b>0 ? ((r/b)*6).toFixed(2) : '0.00';
const calcReqRR = (t,r,bl) => bl<=0 ? '-' : (((t-r)/bl)*6).toFixed(2);
const calcSR = (r,b) => b>0 ? ((r/b)*100).toFixed(1) : '0.0';
const calcEcon = (r,b) => b>0 ? ((r/b)*6).toFixed(1) : '0.0';

function ballSymbol(b) {
  if(b.isWicket) return 'W';
  if(b.extrasType==='wide') return b.extrasRuns>1?b.extrasRuns+'wd':'wd';
  if(b.extrasType==='noball') return (b.runs+b.extrasRuns)+'nb';
  if(b.extrasType==='bye') return b.extrasRuns+'b';
  if(b.extrasType==='legbye') return b.extrasRuns+'lb';
  if(b.runs===0) return '\u2022';
  return String(b.runs);
}

function ballClass(b) {
  if(b.isWicket) return 'ball-wicket';
  if(b.extrasType && b.extrasType!=='none') return 'ball-extra';
  if(b.runs===6) return 'ball-six';
  if(b.runs>=4) return 'ball-boundary';
  if(b.runs===0) return 'ball-dot';
  return 'ball-run';
}

const app = document.getElementById('app');
function navigate(h) { window.location.hash = h; }
function getRoute() {
  const h = window.location.hash.slice(1)||'home';
  const p = h.split('/');
  return {page:p[0], params:p.slice(1)};
}
// A match left "live" for over 12 h was abandoned, not being scored — don't advertise it as LIVE.
function _matchIsStale(m) {
  if (!m || m.status !== 'live' || !m.created_at) return false;
  const t = Date.parse(m.created_at.replace(' ', 'T') + 'Z');   // server stores UTC "YYYY-MM-DD HH:MM"
  return isFinite(t) && Date.now() - t > 12 * 3600 * 1000;
}
function _matchWhen(m) {
  if (!m || !m.created_at) return '';
  const d = new Date(Date.parse(m.created_at.replace(' ', 'T') + 'Z'));
  if (isNaN(d)) return '';
  const today = new Date(); const y = new Date(Date.now() - 864e5);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
// True while the user is still on this page — a slow load must not paint over a page they moved to.
function _stillOn(page, id) {
  const r = getRoute();
  return r.page === page && (id === undefined || r.params[0] === id);
}
function _escHtml(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// get_match with patient backoff (~12 s). Returns the match, a non-"not found" error, or null.
async function _getMatchPatiently(matchId) {
  for (let a = 0; a < 8; a++) {
    if (a) await _sleep(Math.min(500 * a, 2500));
    try {
      const r = await apiCall('get_match', {match_id: matchId});
      if (r && !r.error && r.match_id) return r;
      if (r && r.error && r.error !== 'Match not found') return r;
    } catch(e) {}
  }
  return null;
}
function _loadErrorScreen(title, detail, retryJs) {

}

function route() {

function renderSeriesCards(allMatches) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  const seriesList = Object.entries(allSeries).map(([sid, s]) => {
    let winsA = 0, winsB = 0, total = 0;
    for(const mid of s.matches) {
      const m = allMatches.find(x => x.match_id === mid);
      if(!m || m.status !== 'completed') continue;
      total++;
      if(m.winner === s.teamA) winsA++;
      else if(m.winner === s.teamB) winsB++;
    }
    return { sid, ...s, winsA, winsB, total };
  }).filter(s => s.total > 0).sort((a,b) => (b.created||'').localeCompare(a.created||''));
  if(!seriesList.length) return '';
  return seriesList.map(s => `
    <div class="card rounded-xl p-4 active:scale-[0.98]" onclick="navigate('series/${s.sid}')" style="cursor:pointer;touch-action:manipulation">
      <div class="flex justify-between items-center">
        <div>
          <div class="text-xs font-semibold uppercase" style="color:var(--text2)">\u{1F3C6} Series</div>
          <div class="font-bold mt-1">${s.teamA} vs ${s.teamB}</div>
          <div class="text-sm font-medium mt-0.5">${s.teamA} <b>${s.winsA}</b> - <b>${s.winsB}</b> ${s.teamB} <span style="color:var(--text2)">(${s.total} matches)</span></div>
        </div>
        <span class="text-2xl">\u{1F3CF}</span>
      </div>
    </div>
  `).join('');
}

function _parseStorageClip(name, url) {
  const extIdx = name.lastIndexOf('.');
  const ext = extIdx > -1 ? name.slice(extIdx + 1) : 'mp4';
  const base = extIdx > -1 ? name.slice(0, extIdx) : name;
  const parts = base.split('_');
  const ts = parseInt(parts[0]) || 0;
  let innings = 1, type = 'highlight';
  if(parts.length >= 3 && parts[1].startsWith('inn')) {
    innings = parseInt(parts[1].slice(3)) || 1;
    type = parts.slice(2).join('_') || 'highlight';
  } else if(parts.length >= 2) {
    type = parts.slice(1).join('_') || 'highlight';
  }
  return { url, type, ext, runs: type==='six'?6:type==='four'?4:0, batsman:'', bowler:'', over_label:'', innings, timestamp: ts };
}

function _hlCategoryChips(matchId, clips) {
  const cats = [
    {label:'🔥 4s · Inn 1', t:'four', i:1},
    {label:'🔥 4s · Inn 2', t:'four', i:2},
    {label:'💥 6s · Inn 1', t:'six',  i:1},
    {label:'💥 6s · Inn 2', t:'six',  i:2},
    {label:'🎯 Wkts · Inn 1', t:'wicket', i:1},
    {label:'🎯 Wkts · Inn 2', t:'wicket', i:2},
    {label:'🎬 Inn 1', t:null, i:1},
    {label:'🎬 Inn 2', t:null, i:2},
    {label:'▶ Full Match', t:null, i:null},
  ];
  return cats.map(cat => {
    const filtered = clips.filter(c =>
      (!cat.t || c.type === cat.t) && (!cat.i || c.innings === cat.i));
    if(!filtered.length) return '';
    const filterArg = cat.t && cat.i ? `{type:'${cat.t}',innings:${cat.i}}`
      : cat.t ? `{type:'${cat.t}'}`
      : cat.i ? `{innings:${cat.i}}`
      : 'null';
    return `<button onclick="showHighlightsReel('${matchId}',${filterArg})"
      style="padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;touch-action:manipulation;cursor:pointer;white-space:nowrap">
      ${cat.label} <span style="opacity:0.5;font-weight:500">${filtered.length}</span>
    </button>`;
  }).join('');
}

async function renderHighlightsGallery() {
  app.innerHTML = `
    <div style="background:#1a1a2e;padding:0 16px;height:48px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50">
      <button onclick="navigate('home')" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;touch-action:manipulation">←</button>
      <span style="color:#fff;font-weight:900;font-size:18px">🎬 Highlights</span>
    </div>
    <div id="hl-gallery-body" style="flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--bg)">
      <div style="text-align:center;padding:40px;color:var(--text2)">Loading…</div>
    </div>`;

  const body = document.getElementById('hl-gallery-body');
  try {
    if(typeof _fbStorage === 'undefined') { body.innerHTML = '<div style="padding:20px;color:var(--text2)">Firebase not available.</div>'; return; }

    // Load everything in parallel
    const [matchRes, hlRes, storageRoot] = await Promise.allSettled([
      apiCall('list_matches'),
      apiCall('get_all_highlights'),
      _fbStorage.ref('highlights').listAll()
    ]);

    const matchList = (matchRes.status==='fulfilled' ? matchRes.value.matches : []) || [];
    const n8nHighlights = (hlRes.status==='fulfilled' ? hlRes.value.all_highlights : {}) || {};
    const storageMatchIds = storageRoot.status==='fulfilled'
      ? storageRoot.value.prefixes.map(p => p.name) : [];

    // Union of matchIds that have any clips
    const allMatchIds = [...new Set([...Object.keys(n8nHighlights), ...storageMatchIds])];
    if(!allMatchIds.length) {
      body.innerHTML = `<div style="text-align:center;padding:40px 20px">
        <div style="font-size:48px;margin-bottom:12px">🎬</div>
        <div style="font-weight:700;font-size:16px;margin-bottom:8px">No highlights yet</div>
        <div style="color:var(--text2);font-size:13px;line-height:1.6">Tap 📷 in the scoring screen during a match,<br>then score a 4, 6, or wicket to record a clip.</div>
      </div>`;
      return;
    }

    // Build match info lookup
    const matchInfo = {};
    matchList.forEach((m, idx) => { matchInfo[m.match_id] = { ...m, num: matchList.length - idx }; });

    // For Storage-only matches (n8n wiped), load files from Storage
    const storageOnlyIds = storageMatchIds.filter(id => !n8nHighlights[id]);
    const storageClipMap = {};
    await Promise.all(storageOnlyIds.map(async matchId => {
      try {
        const prefix = storageRoot.value.prefixes.find(p => p.name === matchId);
        if(!prefix) return;
        const listed = await prefix.listAll();
        const clips = await Promise.all(listed.items.map(async item => {
          try { return _parseStorageClip(item.name, await item.getDownloadURL()); } catch(e) { return null; }
        }));
        storageClipMap[matchId] = clips.filter(Boolean).sort((a,b) => a.timestamp - b.timestamp);
      } catch(e) {}
    }));

    // Sort: n8n matches by creation date (newest first), then storage-only
    const sortedIds = allMatchIds.sort((a, b) => {
      const ma = matchInfo[a], mb = matchInfo[b];
      if(ma && mb) return (mb.created_at||'').localeCompare(ma.created_at||'');
      if(ma) return -1; if(mb) return 1; return 0;
    });

    let matchNum = sortedIds.length;
    body.innerHTML = sortedIds.map(matchId => {
      const clips = n8nHighlights[matchId] || storageClipMap[matchId] || [];
      if(!clips.length) return '';
      const info = matchInfo[matchId];
      const num = matchNum--;
      const dateStr = info?.created_at ? (()=>{
        const p = info.created_at.replace('T',' ').split(/[- :]/);
        const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return parseInt(p[2])+' '+(months[parseInt(p[1])-1]||'')+' \''+String(p[0]).slice(2);
      })() : '';
      const teamsLine = info ? `${info.team_a} vs ${info.team_b}` : matchId;
      const meta2 = [
        info?.overs ? info.overs+' overs' : '',
        dateStr,
        info?.winner ? '🏆 '+info.winner+' won' : ''
      ].filter(Boolean).join(' · ');

      return `<div style="background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
        <div style="background:linear-gradient(135deg,#1a1a2e,#16213e);padding:14px 16px">
          <div style="color:rgba(255,255,255,0.45);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Match #${num}</div>
          <div style="color:#fff;font-weight:800;font-size:16px;margin-bottom:4px">${teamsLine}</div>
          <div style="color:rgba(255,255,255,0.5);font-size:11px">${meta2}</div>
        </div>
        <div style="padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px">
          ${_hlCategoryChips(matchId, clips)}
        </div>
      </div>`;
    }).join('');

    if(!body.innerHTML.trim()) body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">No highlights found.</div>';
  } catch(e) {
    body.innerHTML = `<div style="padding:20px;color:var(--text2)">Error: ${e.message}</div>`;
  }
}

let _adminTapCount = 0;
let _adminTapTimer = null;
function _adminTap() {
  _adminTapCount++;
  if(_adminTapTimer) clearTimeout(_adminTapTimer);
  _adminTapTimer = setTimeout(() => { _adminTapCount = 0; }, 800);
  if(_adminTapCount >= 3) {
    _adminTapCount = 0;
    const isAdmin = localStorage.getItem('cricket_admin') === 'true';
    if(isAdmin) {
      localStorage.removeItem('cricket_admin');
      showToast('Admin mode OFF');
    } else {
      const pin = prompt('Enter admin PIN:');
      if(pin === '0704') {
        localStorage.setItem('cricket_admin', 'true');
        showToast('Admin mode ON — you can delete matches');
      } else {
        showToast('Wrong PIN');
      }
    }
    renderHome();
  }
}

function shareOnWhatsApp(matchLabel, inviteCode, matchId) {
  const url = 'https://n8n.barandates.in/webhook/cricket';
  const msg = `\u{1F3CF} *${matchLabel}* - Live Scoring!\n\nWatch live: ${url}#scoring/${matchId}\n\nOr enter code: *${inviteCode}*\n\n${url}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function _shareLiveView(matchId, label) {
  const link = 'https://box-cricket-scorer.netlify.app/#live/' + matchId;
  const msg = '\u{1F3CF} *' + label + '* — Watch Live & Place Bets \u{1F3B2}\n\n\u{1F4F1} ' + link + '\n\nOpen → \u{1F3B2} Odds tab to bet on players!';
  if (navigator.share) {
    navigator.share({ title: label + ' — Live', text: msg, url: link }).catch(() => {});
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  }
}

function _isAdmin() {
  return localStorage.getItem('cricket_admin') === 'true';
}

async function _deleteMatchHighlights(matchId) {
  if(typeof _fbStorage === 'undefined') return;
  try {
    const folder = _fbStorage.ref('highlights/' + matchId);
    const listed = await folder.listAll();
    await Promise.all(listed.items.map(item => item.delete().catch(() => {})));
  } catch(e) { /* ignore — storage may already be empty or user not logged in */ }
}

async function deleteMatch(matchId, label) {
  if(!confirm(`Delete "${label}"? This cannot be undone.`)) return;
  try {
    const res = await apiCall('delete_match', {match_id: matchId});
    if(res && res.error) { alert('Delete failed: ' + res.error); return; }
    _deleteMatchHighlights(matchId); // fire-and-forget — don't block on storage cleanup
    showToast('Match deleted');
  } catch(e) { alert('Delete error: ' + e.message); return; }
  renderHome();
}

  const existing = document.getElementById('modal-set-result');
  if(existing) existing.remove();

  // Pre-fill from existing innings 1 data if available
  const i1r = inn1Data ? (inn1Data.runs||0) : 0;
  const i1w = inn1Data ? (inn1Data.wickets||0) : 0;
  const i1b = inn1Data ? (inn1Data.balls||0) : 0;
  const i1ov = Math.floor(i1b/6) + '.' + (i1b%6);

  function spinners(prefix, val, max, label) {
    return `<div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px">${label}</div>

        <input id="${prefix}" type="number" inputmode="numeric" value="${val}" style="width:64px;text-align:center;font-size:22px;font-weight:900;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px">
        <button onclick="(function(){var v=Math.min(${max},parseInt(document.getElementById('${prefix}').value||0)+1);document.getElementById('${prefix}').value=v})()" style="width:36px;height:36px;border-radius:50%;font-size:20px;border:1px solid var(--border);background:var(--bg);touch-action:manipulation">+</button>
      </div>

  m.className = 'modal-overlay modal-center';

    <h3 class="font-bold text-lg">✏️ Set Final Result</h3>
    <div style="background:var(--bg);border-radius:10px;padding:12px;border:1px solid var(--border)">
      <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:8px">1ST INNINGS — ${teamA} <span style="font-size:11px;font-weight:400">(pre-filled from scoring)</span></div>
      ${spinners('sr1-runs', i1r, 999, 'Runs')}
      ${spinners('sr1-wkts', i1w, 10, 'Wickets')}
      <div style="font-size:11px;color:var(--text2);margin-top:4px">Overs already saved: ${i1ov} — edit runs/wickets only if wrong</div>
    </div>
    <div style="background:var(--bg);border-radius:10px;padding:12px;border:1px solid var(--border)">
      <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:8px">2ND INNINGS — ${teamB}</div>
      ${spinners('sr2-runs', 0, 999, 'Runs')}
      ${spinners('sr2-wkts', 0, 10, 'Wickets')}
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px;margin-top:2px">Overs faced</div>
      <div id="sr2-ov-row" style="display:flex;align-items:center;gap:8px">
        <button onclick="(function(){var v=Math.max(0,(window._sr2Ov||0)-1);window._sr2Ov=v;document.getElementById('sr2-ov-disp').textContent=v})()" style="width:36px;height:36px;border-radius:50%;font-size:20px;border:1px solid var(--border);background:var(--bg);touch-action:manipulation">−</button>
        <span id="sr2-ov-disp" style="font-size:22px;font-weight:900;min-width:36px;text-align:center">0</span>
        <button onclick="(function(){var v=(window._sr2Ov||0)+1;window._sr2Ov=v;document.getElementById('sr2-ov-disp').textContent=v})()" style="width:36px;height:36px;border-radius:50%;font-size:20px;border:1px solid var(--border);background:var(--bg);touch-action:manipulation">+</button>
        <span style="color:var(--text2);font-size:13px">overs</span>
        <div style="display:flex;gap:4px;flex-wrap:wrap">${[0,1,2,3,4,5].map(b=>`<button onclick="window._sr2Ball=${b};document.querySelectorAll('.sr2-ball-btn').forEach(x=>x.style.background='var(--bg)');this.style.background='#16a34a';this.style.color='#fff'" class="sr2-ball-btn" style="width:34px;height:34px;border-radius:8px;font-size:14px;font-weight:700;border:1px solid var(--border);background:var(--bg);touch-action:manipulation">${b}</button>`).join('')}</div>

    <button onclick="document.getElementById('modal-set-result').remove()" class="w-full py-2 rounded-xl text-sm" style="color:var(--text2);touch-action:manipulation">Cancel</button>

  document.body.appendChild(m);

async function _doSetResult(matchId) {
  const inn1Runs    = parseInt(document.getElementById('sr1-runs')?.value) || 0;
  const inn1Wickets = parseInt(document.getElementById('sr1-wkts')?.value) || 0;
  const inn2Runs    = parseInt(document.getElementById('sr2-runs')?.value) || 0;
  const inn2Wickets = parseInt(document.getElementById('sr2-wkts')?.value) || 0;
  const inn2Balls   = (window._sr2Ov || 0) * 6 + (window._sr2Ball || 0);
  document.getElementById('modal-set-result')?.remove();
  showLoader();
  try {
    const res = await apiCall('admin_set_result', {
      match_id: matchId,
      inn1_runs: inn1Runs, inn1_wickets: inn1Wickets,
      inn2_runs: inn2Runs, inn2_wickets: inn2Wickets, inn2_balls: inn2Balls
    });
    if(res.error) { showToast('Error: ' + res.error); return; }
    const winner = res.winner;
    const msg = winner === 'Tied' ? 'Match Tied!' : winner + ' won!';
    showToast('Match ended — ' + msg);
  } catch(e) { showToast('Error: ' + e.message); }
  finally { hideLoader(); }
  renderHome();
}

async function closeAllLiveMatches() {
  const live = (state.allMatches || []).filter(m => m.status === 'live');
  if(!live.length) { alert('No live matches found.'); return; }
  if(!confirm(`End all ${live.length} live match(es)? They will be marked as completed.`)) return;
  showLoader();
  try {
    const res = await apiCall('admin_close_all_live', {});
    showToast(`Closed ${res.closed || live.length} match(es)`);
  } catch(e) { showToast('Error: ' + e.message); }
  finally { hideLoader(); }
  renderHome();
}

async function deleteAllMatches() {
  const matches = state.allMatches || [];
  if(matches.length === 0) { alert('No matches to delete.'); return; }
  if(!confirm(`Delete ALL ${matches.length} matches? This cannot be undone.`)) return;
  showLoader();
  try {
    for(const m of matches) {
      try { await apiCall('delete_match', {match_id: m.match_id}); } catch(e) { /* ignore individual */ }
      _deleteMatchHighlights(m.match_id);
    }
  } finally { hideLoader(); }
  renderHome();
}

async function editMatch(matchId) {
  try {
    const m = await apiCall('get_match', {match_id: matchId});
    if(!m || m.error) { alert('Could not load match'); return; }
    await apiCall('delete_match', {match_id: matchId});
    localStorage.setItem('cricket_edit_match', JSON.stringify(m));
    navigate('setup');
  } catch(e) { alert('Error: ' + e.message); }
}

function getSavedTeams() { return JSON.parse(localStorage.getItem('cricket_teams')||'[]'); }
function saveTeam(name, players) {
  const teams = getSavedTeams().filter(t => t.name !== name);
  teams.unshift({name, players, savedAt: Date.now()});
  if(teams.length > 20) teams.length = 20;
  localStorage.setItem('cricket_teams', JSON.stringify(teams));
}
function deleteSavedTeam(name) {
  const teams = getSavedTeams().filter(t => t.name !== name);
  localStorage.setItem('cricket_teams', JSON.stringify(teams));
}
function loadTeamInto(side) {
  const teams = getSavedTeams();
  if(teams.length === 0) { alert('No saved teams yet. Teams are saved automatically when you create a match.'); return; }
  const el = document.getElementById('team-picker-list');
  el.innerHTML = teams.map(t =>
    `<div class="flex items-center justify-between p-3 rounded-lg mb-1 active:scale-95" style="background:var(--bg);touch-action:manipulation">
      <button onclick="applyTeam('${side}',${JSON.stringify(JSON.stringify(t))})" class="flex-1 text-left">
        <div class="font-medium">${t.name}</div>
        <div class="text-xs" style="color:var(--text2)">${t.players.join(', ')}</div>
      </button>
      <button onclick="event.stopPropagation();confirmDeleteTeam('${t.name.replace(/'/g,"\\'")}','${side}')" class="text-red-400 text-xs px-2 ml-2">\u2716</button>
    </div>`
  ).join('');
  document.getElementById('team-picker-side').textContent = side === 'A' ? 'Team A' : 'Team B';
  document.getElementById('modal-team-picker').style.display = 'flex';
  window._teamPickerSide = side;
}
function applyTeam(side, teamJson) {
  const t = JSON.parse(teamJson);
  document.getElementById('inp-team'+side).value = t.name;
  document.getElementById('inp-ppt').value = Math.max(4, Math.min(11, t.players.length));
  updatePlayerInputs();
  const inputs = document.querySelectorAll('.player-'+side);
  t.players.forEach((p,i) => { if(inputs[i]) inputs[i].value = p; });
  hideModal('modal-team-picker');
  const label = side === 'A' ? 'lbl-teamA' : 'lbl-teamB';
  document.getElementById(label).textContent = t.name + ' Players';
}
function confirmDeleteTeam(name, side) {
  if(confirm(`Remove saved team "${name}"?`)) {
    deleteSavedTeam(name);
    loadTeamInto(side);
  }
}

      </button>
    </div>`;

  updatePlayerInputs();
  _groundCoords = null; // reset per-session
  _loadGroundSuggestions();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      _groundCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const btn = document.getElementById('btn-pin-loc');
      if (btn) { btn.textContent = '✓ Located'; btn.style.color = '#16a34a'; }
      _loadGroundSuggestions();
    }, () => {}, { timeout: 5000, enableHighAccuracy: false });
  }
  document.getElementById('inp-teamA').addEventListener('input', e => {
    document.getElementById('lbl-teamA').textContent = '2. ' + (e.target.value||'Team A') + ' Players';
  });
  document.getElementById('inp-teamB').addEventListener('input', e => {
    document.getElementById('lbl-teamB').textContent = (e.target.value||'Team B') + ' Players';
  });

  const editData = localStorage.getItem('cricket_edit_match');
  if (editData) {
    localStorage.removeItem('cricket_edit_match');
    try {
      const m = JSON.parse(editData);
      document.getElementById('inp-teamA').value = m.team_a || '';
      document.getElementById('inp-teamB').value = m.team_b || '';
      if (m.ground?.name) document.getElementById('inp-ground').value = m.ground.name;
      document.getElementById('inp-overs').value = String(m.overs || 5);
      document.getElementById('inp-ppt').value = String(m.players_per_team || 6);
      if (m.retire_at > 0) {
        document.getElementById('inp-retire-toggle').checked = true;
        document.getElementById('inp-retire').value = String(m.retire_at);
        document.getElementById('inp-retire-runs').style.display = 'flex';
      } else {
        document.getElementById('inp-retire-toggle').checked = false;
        document.getElementById('inp-retire-runs').style.display = 'none';
      }
      document.getElementById('inp-lastman').checked = m.last_man_batting !== false;
      const commonP = (m.players || []).find(p => p.is_common);
      if (commonP) {
        document.getElementById('inp-common').value = commonP.name;
      }
      if (m.common_player_balls) {
        document.getElementById('inp-common-balls').value = String(m.common_player_balls);
      }
      updatePlayerInputs();
      const teamAPlayers = (m.players || []).filter(p => p.team === m.team_a && !p.is_common);
      const teamBPlayers = (m.players || []).filter(p => p.team === m.team_b && !p.is_common);
      document.querySelectorAll('.player-A').forEach((inp, i) => {
        if (teamAPlayers[i]) inp.value = teamAPlayers[i].name;
      });
      document.querySelectorAll('.player-B').forEach((inp, i) => {
        if (teamBPlayers[i]) inp.value = teamBPlayers[i].name;
      });
      document.getElementById('lbl-teamA').textContent = '2. ' + (m.team_a || 'Team A') + ' Players';
      document.getElementById('lbl-teamB').textContent = (m.team_b || 'Team B') + ' Players';
      document.querySelector('h1').textContent = 'Edit Match';
      document.getElementById('btn-create').textContent = 'Create Match →';
    } catch(e) { /* ignore parse errors */ }
  }
}

function updatePlayerInputs() {
  const n = parseInt(document.getElementById('inp-ppt').value);
  ['A','B'].forEach(t => {
    const list = document.getElementById('list-team'+t);
    const existing = [...list.querySelectorAll('input')].map(i=>i.value);
    list.innerHTML = '';
    for(let i=0; i<n; i++) {
      const val = existing[i] || '';
      list.innerHTML += `<input type="text" placeholder="Player ${i+1} name" value="${val}"
        class="player-${t} w-full p-3 rounded-lg text-base" autocomplete="off">`;
    }
  });
}

async function createMatch() {
  const btn = document.getElementById('btn-create');
  const teamA = document.getElementById('inp-teamA').value.trim();
  const teamB = document.getElementById('inp-teamB').value.trim();
  if(!teamA || !teamB) { alert('Enter both team names'); return; }

  const teamAPlayers = [...document.querySelectorAll('.player-A')].map(i=>i.value.trim()).filter(Boolean);
  const teamBPlayers = [...document.querySelectorAll('.player-B')].map(i=>i.value.trim()).filter(Boolean);
  const commonPlayer = (document.getElementById('inp-common')?.value||'').trim();
  const ppt = parseInt(document.getElementById('inp-ppt').value);
  if(teamAPlayers.length < 2 || teamBPlayers.length < 2) { alert('Name at least 2 players per team. You can add more during the match with the + button.'); return; }

  const groundName = (document.getElementById('inp-ground')?.value || '').trim();
  btn.disabled = true; btn.textContent = 'Creating...';
  try {
    const res = await apiCall('create_match', {
      team_a: teamA, team_b: teamB,
      overs: parseInt(document.getElementById('inp-overs').value),
      players_per_team: ppt,
      retire_at: document.getElementById('inp-retire-toggle').checked ? (parseInt(document.getElementById('inp-retire').value)||30) : 0,
      last_man_batting: document.getElementById('inp-lastman').checked,
      four_innings: document.getElementById('inp-four-innings').checked,
      team_a_players: teamAPlayers,
      team_b_players: teamBPlayers,
      common_player: commonPlayer || null,
      common_player_balls: parseInt(document.getElementById('inp-common-balls')?.value)||0,
      ground: groundName ? { name: groundName, lat: _groundCoords?.lat || null, lng: _groundCoords?.lng || null } : null
    });
    if(res.match_id) {
      if(teamA && teamAPlayers.length >= 2) saveTeam(teamA, teamAPlayers);
      if(teamB && teamBPlayers.length >= 2) saveTeam(teamB, teamBPlayers);
      if(commonPlayer) localStorage.setItem('cricket_default_common', commonPlayer);
      localStorage.setItem('cricket_common_balls', document.getElementById('inp-common-balls')?.value||'3');
      navigate('toss/'+res.match_id);
    } else if(res.status === 'queued_offline') {
      alert('No connection — match saved locally and will sync when online. Return to home and tap the match when reconnected.');
      btn.disabled=false; btn.textContent='Create Match →';
    } else throw new Error(res.error||'Server error — please try again');
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Create Match \u2192'; }
}

function renderSkillBar(icon, label, value, color) {
  const valColor = value >= 70 ? color : 'var(--text)';
  return '<div class="skill-bar-container">' +
    '<span class="skill-icon">' + icon + '</span>' +
    '<span class="skill-label">' + label + '</span>' +
    '<div class="skill-bar-bg"><div class="skill-bar-fill" style="width:' + (value||0) + '%;background:' + color + '"></div></div>' +
    '<span class="skill-value" style="color:' + valColor + '">' + (value||0) + '</span></div>';
}

function renderSkillCards(p) {
  const sk = p.skills;
  const tierBg = sk.overall>=80 ? 'linear-gradient(135deg,#f59e0b,#ef4444);color:#fff'
    : sk.overall>=60 ? 'linear-gradient(135deg,#3b82f6,#6366f1);color:#fff'
    : sk.overall>=40 ? 'rgba(59,130,246,0.15);color:#3b82f6'
    : sk.overall>=20 ? 'rgba(107,114,128,0.15);color:#6b7280'
    : 'rgba(107,114,128,0.1);color:#9ca3af';
  const orbBg = sk.overall>=80 ? 'linear-gradient(135deg,#f59e0b,#ef4444)'
    : sk.overall>=60 ? 'linear-gradient(135deg,#3b82f6,#6366f1)'
    : sk.overall>=40 ? 'linear-gradient(135deg,#6366f1,#8b5cf6)'
    : 'linear-gradient(135deg,#6b7280,#9ca3af)';

  const allSkills = [{k:'power',l:'Power'},{k:'timing',l:'Timing'},{k:'footwork',l:'Footwork'},{k:'consistency',l:'Consistency'},{k:'aggression',l:'Aggression'},{k:'survival',l:'Survival'},{k:'pace',l:'Pace'},{k:'spin',l:'Spin'},{k:'death_bowling',l:'Death'},{k:'yorker',l:'Yorker'},{k:'fielding',l:'Fielding'},{k:'clutch',l:'Clutch'}];
  const top3 = allSkills.sort((a,b)=>(sk[b.k]||0)-(sk[a.k]||0)).slice(0,3)
    .map(s => '<span class="text-xs px-2 py-0.5 rounded-full font-bold" style="background:rgba(34,197,94,0.15);color:#16a34a">' + s.l + ' ' + (sk[s.k]||0) + '</span>').join('');

  return '<div class="mx-4 card rounded-xl p-4 mb-3">' +
    '<div class="flex items-center justify-between mb-3">' +
      '<h3 class="font-bold text-sm uppercase tracking-wide" style="color:var(--text2)">Player Rating</h3>' +
      '<span class="skill-tier" style="background:' + tierBg + '">' + (sk.tier||'Rookie') + '</span>' +
    '</div>' +
    '<div class="flex items-center gap-4">' +
      '<div class="w-20 h-20 rounded-full flex flex-col items-center justify-center font-black text-white shrink-0" style="background:' + orbBg + '">' +
        '<span style="font-size:28px;line-height:1">' + sk.overall + '</span>' +
        '<span style="font-size:9px;opacity:0.8;font-weight:600">OVERALL</span>' +
      '</div>' +
      '<div class="flex-1">' +
        '<div class="font-bold text-lg">' + (sk.player_type||'Batsman') + '</div>' +
        '<div class="text-xs mt-0.5" style="color:var(--text2)">' + p.matches.length + ' match' + (p.matches.length!==1?'es':'') + ' played</div>' +
        '<div class="flex gap-1 mt-2 flex-wrap">' + top3 + '</div>' +
      '</div>' +
    '</div></div>' +

    '<div class="mx-4 card rounded-xl p-4 mb-3">' +
    '<h3 class="font-bold text-sm mb-3 uppercase tracking-wide" style="color:var(--text2)">Batting Skills</h3>' +
    renderSkillBar('\u26A1','Power',sk.power,'#ef4444') +
    renderSkillBar('\u{1F3AF}','Timing',sk.timing,'#f59e0b') +
    renderSkillBar('\u{1F45F}','Footwork',sk.footwork,'#8b5cf6') +
    renderSkillBar('\u{1F4CA}','Consistency',sk.consistency,'#3b82f6') +
    renderSkillBar('\u{1F525}','Aggression',sk.aggression,'#ef4444') +
    renderSkillBar('\u{1F6E1}\uFE0F','Survival',sk.survival,'#6b7280') +
    '</div>' +

    '<div class="mx-4 card rounded-xl p-4 mb-3">' +
    '<h3 class="font-bold text-sm mb-3 uppercase tracking-wide" style="color:var(--text2)">Bowling Skills</h3>' +
    renderSkillBar('\u{1F4A8}','Pace',sk.pace,'#ef4444') +
    renderSkillBar('\u{1F300}','Spin',sk.spin,'#8b5cf6') +
    renderSkillBar('\u{1F480}','Death Overs',sk.death_bowling,'#f59e0b') +
    renderSkillBar('\u2B07\uFE0F','Yorker',sk.yorker,'#3b82f6') +
    '</div>' +

    '<div class="mx-4 card rounded-xl p-4 mb-3">' +
    '<h3 class="font-bold text-sm mb-3 uppercase tracking-wide" style="color:var(--text2)">Special Skills</h3>' +
    renderSkillBar('\u{1F9E4}','Fielding',sk.fielding,'#22c55e') +
    renderSkillBar('\u{1F525}','Clutch',sk.clutch,'#f97316') +
    '</div>';
}

    boxBtn.style.borderColor = '#22c55e';

    boxBtn.style.borderColor = 'transparent';
    proBtn.style.borderColor = '#3b82f6';

    proCheck.style.display = 'flex';
    if (boxCommon) boxCommon.style.display = 'none';
    if (boxRetire) boxRetire.style.display = 'none';
  }
}

function drawModePreviewCanvases() {
  const boxC = document.getElementById('qm-mode-box-canvas');
  if (boxC) {
    const ctx = boxC.getContext('2d');
    const W = 200, H = 140;
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.3);
    sky.addColorStop(0, '#0a1428'); sky.addColorStop(1, '#162040');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a6b30';
    ctx.beginPath(); ctx.moveTo(30, 35); ctx.lineTo(170, 35); ctx.lineTo(200, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const t = i / 8, y1 = 35 + t * (H - 35), y2 = 35 + (i + 1) / 8 * (H - 35);
      if (i % 2 === 0) { ctx.fillStyle = 'rgba(40,140,70,0.3)'; ctx.fillRect(0, y1, W, y2 - y1); }
    }
    ctx.strokeStyle = '#00c9a7'; ctx.lineWidth = 3; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(30, 35); ctx.lineTo(170, 35); ctx.lineTo(200, H); ctx.lineTo(0, H); ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#c4a050'; ctx.fillRect(90, 50, 20, 60);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(100, 88, 5, 0, Math.PI * 2); ctx.stroke(); // head
    ctx.beginPath(); ctx.moveTo(100, 93); ctx.lineTo(100, 108); ctx.stroke(); // body
    ctx.beginPath(); ctx.moveTo(100, 108); ctx.lineTo(93, 120); ctx.stroke(); // left leg
    ctx.beginPath(); ctx.moveTo(100, 108); ctx.lineTo(107, 120); ctx.stroke(); // right leg
    ctx.beginPath(); ctx.moveTo(100, 98); ctx.lineTo(90, 103); ctx.stroke(); // arm
    ctx.strokeStyle = '#c4a050'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(90, 103); ctx.lineTo(80, 85); ctx.stroke();
    ctx.fillStyle = '#00c9a7'; ctx.globalAlpha = 0.8;
    [[30,35],[170,35],[0,H-2],[200,H-2]].forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;
  }

  const proC = document.getElementById('qm-mode-pro-canvas');
  if (proC) {
    const ctx = proC.getContext('2d');
    const W = 200, H = 140;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a1428'); sky.addColorStop(0.4, '#162040'); sky.addColorStop(1, '#0d1a2e');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a2540';
    ctx.beginPath(); ctx.ellipse(100, 30, 110, 25, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#1a6b30';
    ctx.beginPath(); ctx.ellipse(100, 85, 90, 50, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(100, 85, 55, 30, 0, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i % 2 === 0 ? 'rgba(40,140,70,0.25)' : 'rgba(30,120,55,0.15)';
      ctx.fillRect(0, 55 + i * 12, W, 12);
    }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.ellipse(100, 85, 88, 48, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#c4a050'; ctx.fillRect(95, 65, 10, 35);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(100, 82, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, 86); ctx.lineTo(100, 98); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, 98); ctx.lineTo(95, 108); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, 98); ctx.lineTo(105, 108); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, 90); ctx.lineTo(93, 94); ctx.stroke();
    ctx.strokeStyle = '#c4a050'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(93, 94); ctx.lineTo(85, 80); ctx.stroke();
    ctx.fillStyle = '#3b82f6'; ctx.globalAlpha = 0.7;
    const fielderPos = [[40,70],[160,70],[30,95],[170,95],[60,50],[140,50],[100,45],[70,110],[130,110],[50,80],[150,80]];
    fielderPos.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f59e0b'; ctx.globalAlpha = 0.8;
    [[15,20],[185,20],[50,15],[150,15]].forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 0.04; ctx.fillStyle = '#fff';
    [[15,20],[185,20]].forEach(([x,y]) => {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 30, H); ctx.lineTo(x + 30, H); ctx.closePath(); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
}

async function createQuickMatch() {
  const teamA = document.getElementById('qm-teamA').value.trim() || 'Team A';
  const teamB = document.getElementById('qm-teamB').value.trim() || 'Team B';
  const gameMode = document.getElementById('qm-game-mode')?.value || 'box';
  const btn = document.getElementById('btn-qm-create');
  btn.disabled = true; btn.textContent = 'Creating...';
  const commonPlayer = (document.getElementById('qm-common')?.value||'').trim();
  try {
    const res = await apiCall('create_match', {
      team_a: teamA, team_b: teamB,
      overs: parseInt(document.getElementById('qm-overs').value),
      players_per_team: gameMode === 'professional' ? 11 : 11,
      retire_at: gameMode === 'professional' ? 0 : (document.getElementById('qm-retire-toggle').checked ? (parseInt(document.getElementById('qm-retire').value)||30) : 0),
      last_man_batting: document.getElementById('qm-lastman').checked,
      four_innings: document.getElementById('qm-four-innings')?.checked || false,
      team_a_players: [],
      team_b_players: [],
      common_player: gameMode === 'professional' ? null : (commonPlayer || null),
      common_player_balls: gameMode === 'professional' ? 0 : (parseInt(document.getElementById('qm-common-balls')?.value)||0),
      access_level: document.getElementById('qm-access')?.value || 'full',
      quick_match: true,
      game_mode: gameMode
    });
    if(res.match_id) {
      if(res.invite_code) showToast('Invite Code: ' + res.invite_code, 5000);
      if(commonPlayer) localStorage.setItem('cricket_default_common', commonPlayer);
      localStorage.setItem('cricket_common_balls', document.getElementById('qm-common-balls')?.value||'3');
      navigate('toss/'+res.match_id);
    } else if(res.status === 'queued_offline') {
      alert('No connection — match saved locally and will sync when online.');
      btn.disabled=false; btn.textContent='Create & Go to Toss →';
    } else throw new Error(res.error||'Server error — please try again');
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Create & Go to Toss \u2192'; }
}

async function startScoreOnly() {
  const batTeam = document.getElementById('so-batteam').value.trim();
  const bowlTeam = document.getElementById('so-bowlteam').value.trim();
  if(!batTeam || !bowlTeam) { alert('Enter both team names'); return; }
  const striker = document.getElementById('so-striker').value.trim();
  const nonStriker = document.getElementById('so-nonstriker').value.trim();
  const bowler = document.getElementById('so-bowler').value.trim();
  if(!striker || !nonStriker) { alert('Enter both batsmen names'); return; }
  if(!bowler) { alert('Enter bowler name'); return; }
  const target = parseInt(document.getElementById('so-target').value) || 0;
  const overs = parseInt(document.getElementById('so-overs').value) || 5;

  const btn = document.getElementById('btn-so-start');
  btn.disabled = true; btn.textContent = 'Starting...';
  try {
    const res = await apiCall('create_match', {
      team_a: batTeam, team_b: bowlTeam,
      overs: overs,
      players_per_team: 11,
      retire_at: document.getElementById('so-retire-toggle').checked ? (parseInt(document.getElementById('so-retire').value)||30) : 0,
      last_man_batting: document.getElementById('so-lastman').checked,
      team_a_players: [],
      team_b_players: [],
      quick_match: true
    });
    if(!res.match_id) throw new Error(res.error||'Failed to create match');
    const matchId = res.match_id;

    await apiCallOk('set_toss', {
      match_id: matchId,
      toss_winner: batTeam,
      batting_first: batTeam
    });

    if(target > 0) {
      await apiCallOk('start_innings', {
        match_id: matchId, innings: 1,
        on_strike: '_placeholder1', non_striker: '_placeholder2', bowler: '_placeholder3'
      });
      await apiCallOk('set_first_innings_score', {
        match_id: matchId, score: target - 1
      });
      await new Promise(r => setTimeout(r, 700));
      await apiCallOk('start_innings', {
        match_id: matchId, innings: 2,
        on_strike: striker, non_striker: nonStriker, bowler: bowler,
        explicit_target: target
      });
    } else {
      await apiCallOk('start_innings', {
        match_id: matchId, innings: 1,
        on_strike: striker, non_striker: nonStriker, bowler: bowler
      });
    }

    localStorage.setItem('cricket_access_' + matchId, 'full');
    navigate('scoring/'+matchId);
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Start Scoring \u{1F3CF}'; }
}

let draftState = {
  step: 'players', players: [], captains: [], tossWinner: '', teamA: [], teamB: [], currentPick: 'A', flipping: false, commonPlayer: ''
};

function renderTeamDraft() {
  if(draftState.step === 'players' && draftState.players.length === 0) {
    try { draftState.players = JSON.parse(localStorage.getItem('cricket_draft_players')||'[]'); } catch(e) {}
  }
  const s = draftState;
  app.innerHTML = `
    <div class="p-4 border-b flex items-center gap-3" style="border-color:var(--border)">
      <button onclick="${s.step==='players'?`navigate('home')`:`draftBack()`}" class="text-2xl leading-none">\u2190</button>
      <h1 class="text-lg font-bold flex-1">\u{1F465} Pick Teams</h1>
      ${s.step!=='players'?`<span class="text-xs px-2 py-1 rounded-full font-bold" style="background:var(--bg);color:var(--text2)">${s.step==='captains'?'Step 2/5':s.step==='toss'?'Step 3/5':s.step==='pick'?'Step 4/5':'Step 5/5'}</span>`:''}
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-3" id="draft-content"></div>`;
  const el = document.getElementById('draft-content');
  if(s.step==='players') draftRenderPlayers(el);
  else if(s.step==='captains') draftRenderCaptains(el);
  else if(s.step==='toss') draftRenderToss(el);
  else if(s.step==='pick') draftRenderPick(el);
  else draftRenderDone(el);
}

function draftBack() {
  const steps = ['players','captains','toss','pick','done'];
  const i = steps.indexOf(draftState.step);
  if(i > 0) { draftState.step = steps[i-1]; if(draftState.step==='players'){draftState.captains=[];} renderTeamDraft(); }
}

function draftSavePlayers() {
  localStorage.setItem('cricket_draft_players', JSON.stringify(draftState.players));
}

function draftRenderPlayers(el) {
  const ps = draftState.players;
  el.innerHTML = `
    <div class="card rounded-xl p-4 space-y-3">
      <p class="text-xs" style="color:var(--text2)">Add players who are available today. You can type one by one or paste a list from WhatsApp.</p>
      <div class="flex gap-2">
        <input id="draft-name" type="text" placeholder="Player name" class="flex-1 p-3 rounded-lg text-base" autocomplete="off"
          onkeydown="if(event.key==='Enter'){draftAddPlayer()}">
        <button onclick="draftAddPlayer()" class="px-4 py-2 rounded-lg bg-cricket-600 text-white font-bold text-sm active:scale-95" style="touch-action:manipulation">Add</button>
      </div>
      <button onclick="draftShowPaste()" class="w-full p-2.5 rounded-lg card text-sm font-medium active:scale-95" style="touch-action:manipulation">\u{1F4CB} Paste List from WhatsApp</button>
      <div id="draft-paste-area" style="display:none" class="space-y-2">
        <textarea id="draft-paste-text" rows="6" placeholder="Paste numbered list here...\n1. AJ\n2. KG\n3. Sam" class="w-full p-3 rounded-lg text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></textarea>
        <div class="flex gap-2">
          <button onclick="draftParsePaste()" class="flex-1 p-2.5 rounded-lg bg-cricket-600 text-white font-bold text-sm active:scale-95" style="touch-action:manipulation">Import Players</button>
          <button onclick="document.getElementById('draft-paste-area').style.display='none'" class="px-4 p-2.5 rounded-lg card text-sm font-medium active:scale-95" style="touch-action:manipulation">Cancel</button>
        </div>
      </div>
    </div>
    <div class="card rounded-xl p-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-sm">${ps.length} Player${ps.length!==1?'s':''}</h3>
        ${ps.length>0?`<button onclick="draftClearAll()" class="text-xs text-red-500 font-medium active:scale-95" style="touch-action:manipulation">Clear All</button>`:''}
      </div>
      ${ps.length===0?`<p class="text-sm" style="color:var(--text2)">No players added yet</p>`:''}
      <div class="flex flex-wrap gap-2">
        ${ps.map((p,i)=>`
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium card">
            ${p}
            <button onclick="draftRemovePlayer(${i})" class="text-red-400 text-xs font-bold ml-0.5" style="touch-action:manipulation">\u2716</button>
          </span>`).join('')}
      </div>
    </div>
    <button onclick="draftToCaptains()" ${ps.length<4?'disabled':''} class="w-full py-4 rounded-xl bg-cricket-600 text-white font-bold text-lg active:scale-[0.97] disabled:opacity-40" style="touch-action:manipulation">
      Select Captains \u2192
    </button>
    ${ps.length>0&&ps.length<4?`<p class="text-xs text-center" style="color:var(--text2)">Need at least 4 players</p>`:''}`;
  setTimeout(()=>{const inp=document.getElementById('draft-name');if(inp)inp.focus();},100);
}

function draftShowPaste() { document.getElementById('draft-paste-area').style.display='block'; }

function draftParsePaste() {
  const raw = document.getElementById('draft-paste-text').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    let name = line.replace(/^[\d]+[\.\)]\s*/, '').replace(/^[-•\u2022\u2060\u200B\uFEFF⁠]\s*/, '').trim();
    name = name.replace(/[\u2060\u200B\uFEFF]/g, '').trim();
    if(name && name.length > 0 && name.length < 30) {
      if(/^\d+\/\d+\/\d+$/.test(name)) return;
      if(!draftState.players.some(p=>p.toLowerCase()===name.toLowerCase())) {
        draftState.players.push(name);
        added++;
      }
    }
  });
  draftSavePlayers();
  document.getElementById('draft-paste-area').style.display='none';
  renderTeamDraft();
}

function draftAddPlayer() {
  const inp = document.getElementById('draft-name');
  const name = inp.value.trim();
  if(!name) return;
  if(draftState.players.some(p=>p.toLowerCase()===name.toLowerCase())) { alert('Already added'); return; }
  draftState.players.push(name);
  draftSavePlayers();
  inp.value = '';
  renderTeamDraft();
}

function draftRemovePlayer(i) {
  draftState.players.splice(i, 1);
  draftSavePlayers();
  renderTeamDraft();
}

function draftClearAll() {
  if(!confirm('Remove all players?')) return;
  draftState.players = [];
  draftSavePlayers();
  renderTeamDraft();
}

function draftToCaptains() {
  if(draftState.players.length < 4) { alert('Need at least 4 players'); return; }
  draftState.step = 'captains';
  draftState.captains = [];
  renderTeamDraft();
}

function draftRenderCaptains(el) {
  const caps = draftState.captains;
  el.innerHTML = `
    <div class="card rounded-xl p-4 space-y-2">
      <h3 class="font-bold text-sm">Tap 2 players to make them captains</h3>
      <p class="text-xs" style="color:var(--text2)">First pick = Captain A, Second pick = Captain B</p>
      <div class="space-y-2 mt-2">
        ${draftState.players.map(p => {
          const idx = caps.indexOf(p);
          const isCap = idx >= 0;
          return `<button onclick="draftPickCaptain('${p.replace(/'/g,"\\'")}')"
            class="w-full p-3 rounded-xl text-left font-medium active:scale-95 border-2 transition-all flex justify-between items-center"
            style="background:${isCap?'rgba(34,197,94,0.15)':'var(--bg)'};border-color:${isCap?'#22c55e':'transparent'};touch-action:manipulation">
            <span>${p}</span>
            ${isCap?`<span class="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300 font-bold">Captain ${idx===0?'A':'B'}</span>`:''}
          </button>`;
        }).join('')}
      </div>
    </div>
    <button onclick="draftToToss()" ${caps.length!==2?'disabled':''} class="w-full py-4 rounded-xl bg-cricket-600 text-white font-bold text-lg active:scale-[0.97] disabled:opacity-40" style="touch-action:manipulation">
      Toss \u{1FA99} \u2192
    </button>`;
}

function draftPickCaptain(name) {
  const idx = draftState.captains.indexOf(name);
  if(idx >= 0) { draftState.captains.splice(idx, 1); }
  else if(draftState.captains.length < 2) { draftState.captains.push(name); }
  else { draftState.captains[1] = name; }
  renderTeamDraft();
}

function draftToToss() {
  if(draftState.captains.length !== 2) { alert('Pick 2 captains'); return; }
  draftState.step = 'toss';
  renderTeamDraft();
}

function draftRenderToss(el) {
  const capA = draftState.captains[0];
  const capB = draftState.captains[1];
  el.innerHTML = `
    <style>
      .dcoin-container { perspective: 400px; width: 100px; height: 100px; margin: 0 auto; }
      .dcoin { width: 100px; height: 100px; border-radius: 50%; position: relative; transform-style: preserve-3d; }
      .dcoin.flipping { animation: dcoinFlip 2s ease-out forwards; }
      .dcoin-face { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 12px; text-align: center; padding: 8px; backface-visibility: hidden;
        border: 3px solid rgba(255,255,255,0.3); }
      .dcoin-heads { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
      .dcoin-tails { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; transform: rotateY(180deg); }
      @keyframes dcoinFlip { 0% { transform: rotateY(0); } 100% { transform: rotateY(var(--flip-end)); } }
    </style>
    <div class="card rounded-xl p-6 text-center space-y-4">
      <h3 class="font-bold text-lg">Captain's Toss</h3>
      <p class="text-sm" style="color:var(--text2)">Winner picks first</p>

        <div class="p-3 rounded-xl text-center" style="background:rgba(245,158,11,0.1)">
          <div class="text-xs font-semibold uppercase" style="color:#f59e0b">Heads</div>
          <div class="font-bold mt-1">${capA}</div>
        </div>
        <div class="p-3 rounded-xl text-center" style="background:rgba(59,130,246,0.1)">
          <div class="text-xs font-semibold uppercase" style="color:#3b82f6">Tails</div>
          <div class="font-bold mt-1">${capB}</div>
        </div>
      </div>
      <div class="dcoin-container">
        <div class="dcoin" id="dcoin">
          <div class="dcoin-face dcoin-heads">${capA}</div>
          <div class="dcoin-face dcoin-tails">${capB}</div>
        </div>
      </div>
      <button id="dcoin-flip" onclick="draftFlipCoin()" class="px-8 py-3 rounded-xl bg-cricket-600 text-white font-bold text-lg active:scale-95 transition-all" style="touch-action:manipulation">
        Flip Coin
      </button>
      <div id="dcoin-result" class="hidden text-center space-y-2">
        <div class="text-lg font-bold" id="dcoin-result-text"></div>
      </div>
      <div class="text-sm" style="color:var(--text2)">or pick manually</div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="draftStartPicking('${capA.replace(/'/g,"\\'")}')" class="card p-3 rounded-xl font-medium active:scale-95" style="touch-action:manipulation">${capA} picks first</button>
        <button onclick="draftStartPicking('${capB.replace(/'/g,"\\'")}')" class="card p-3 rounded-xl font-medium active:scale-95" style="touch-action:manipulation">${capB} picks first</button>
      </div>
    </div>`;
}

function draftFlipCoin() {
  if(draftState.flipping) return;
  draftState.flipping = true;
  const coin = document.getElementById('dcoin');
  const btn = document.getElementById('dcoin-flip');
  btn.disabled = true; btn.textContent = 'Flipping...';
  document.getElementById('dcoin-result').classList.add('hidden');

  const result = Math.random() < 0.5 ? 'heads' : 'tails';
  const fullRot = 4 + Math.floor(Math.random()*3);
  const endDeg = fullRot * 360 + (result==='tails' ? 180 : 0);
  coin.style.setProperty('--flip-end', endDeg+'deg');
  coin.classList.remove('flipping');
  void coin.offsetWidth;
  coin.classList.add('flipping');

  const winner = result==='heads' ? draftState.captains[0] : draftState.captains[1];

  setTimeout(() => {
    document.getElementById('dcoin-result-text').innerHTML =
      `<span style="color:#22c55e">${result.toUpperCase()}!</span><br><span class="text-2xl">${winner} picks first!</span>`;
    document.getElementById('dcoin-result').classList.remove('hidden');
    draftState.flipping = false;
    btn.textContent = 'Flip Again'; btn.disabled = false;
    setTimeout(()=>draftStartPicking(winner), 1500);
  }, 2100);
}

function draftStartPicking(winner) {
  draftState.tossWinner = winner;
  const capA = draftState.captains[0];
  const capB = draftState.captains[1];
  if(winner === capA) {
    draftState.teamA = [capA];
    draftState.teamB = [capB];
    draftState.currentPick = 'A';
  } else {
    draftState.teamA = [capB];
    draftState.teamB = [capA];
    draftState.currentPick = 'B'; // B picks first since B's captain won
    draftState.teamA = [winner];
    draftState.teamB = [winner === capA ? capB : capA];
    draftState.currentPick = 'A';
  }
  draftState.step = 'pick';
  renderTeamDraft();
}

function draftRenderPick(el) {
  const s = draftState;
  const picked = [...s.teamA, ...s.teamB];
  const pool = s.players.filter(p => !picked.includes(p));
  const isA = s.currentPick === 'A';

  if(pool.length === 0) { draftState.step = 'done'; renderTeamDraft(); return; }

  if(pool.length === 1) {
    const lastP = pool[0];
    el.innerHTML = `
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div class="card rounded-xl p-3">
          <div class="text-xs font-semibold uppercase mb-1" style="color:var(--text2)">${s.teamA[0]}'s Team</div>
          ${s.teamA.map((p,i)=>`<div class="text-sm ${i===0?'font-bold':'font-medium'} py-0.5">${i===0?'\u{1F451} ':''}${p}</div>`).join('')}
        </div>
        <div class="card rounded-xl p-3">
          <div class="text-xs font-semibold uppercase mb-1" style="color:var(--text2)">${s.teamB[0]}'s Team</div>
          ${s.teamB.map((p,i)=>`<div class="text-sm ${i===0?'font-bold':'font-medium'} py-0.5">${i===0?'\u{1F451} ':''}${p}</div>`).join('')}
        </div>
      </div>
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">\u{1F9CD}</div>
        <h3 class="font-bold text-lg mb-1">${lastP} is the last player!</h3>
        <p class="text-sm mb-4" style="color:var(--text2)">Make common player (plays for both teams) or assign to a team?</p>
        <div class="space-y-2">
          <button onclick="draftSetCommon('${lastP.replace(/'/g,"\\'")}')"
            class="w-full p-3 rounded-xl font-bold text-base active:scale-95 bg-yellow-500 text-white" style="touch-action:manipulation">
            \u{2B50} Common Player (Both Teams)
          </button>
          <button onclick="draftPickPlayer('${lastP.replace(/'/g,"\\'")}')"
            class="w-full p-3 rounded-xl font-medium text-sm active:scale-95 border-2" style="background:var(--bg);touch-action:manipulation">
            Add to ${isA?s.teamA[0]:s.teamB[0]}'s Team
          </button>
        </div>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="card rounded-xl p-3 ${isA?'ring-2 ring-green-500':''}">
        <div class="text-xs font-semibold uppercase mb-1" style="color:${isA?'#22c55e':'var(--text2)'}">${s.teamA[0]}'s Team ${isA?'\u{1F449}':''}</div>
        ${s.teamA.map((p,i)=>`<div class="text-sm ${i===0?'font-bold':'font-medium'} py-0.5">${i===0?'\u{1F451} ':''}${p}</div>`).join('')}
      </div>
      <div class="card rounded-xl p-3 ${!isA?'ring-2 ring-green-500':''}">
        <div class="text-xs font-semibold uppercase mb-1" style="color:${!isA?'#22c55e':'var(--text2)'}">${s.teamB[0]}'s Team ${!isA?'\u{1F449}':''}</div>
        ${s.teamB.map((p,i)=>`<div class="text-sm ${i===0?'font-bold':'font-medium'} py-0.5">${i===0?'\u{1F451} ':''}${p}</div>`).join('')}
      </div>
    </div>
    <div class="card rounded-xl p-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-sm">${isA?s.teamA[0]:s.teamB[0]}'s pick</h3>
        <div class="flex items-center gap-2">
          ${(s.teamA.length > 1 || s.teamB.length > 1) ? `<button onclick="draftUndoPick()" class="text-xs px-2 py-1 rounded-lg active:scale-95 card font-medium" style="touch-action:manipulation">\u21A9 Undo</button>` : ''}
          <span class="text-xs" style="color:var(--text2)">${pool.length} left</span>
        </div>
      </div>
      <div class="space-y-2">
        ${pool.map(p=>`
          <button onclick="draftPickPlayer('${p.replace(/'/g,"\\'")}')"
            class="w-full p-3 rounded-xl text-left font-medium active:scale-95 border-2 border-transparent transition-all" style="background:var(--bg);touch-action:manipulation">
            ${p}
          </button>`).join('')}
      </div>
    </div>`;
}

function draftPickPlayer(name) {
  if(draftState.currentPick === 'A') {
    draftState.teamA.push(name);
    draftState.currentPick = 'B';
  } else {
    draftState.teamB.push(name);
    draftState.currentPick = 'A';
  }
  renderTeamDraft();
}

function draftUndoPick() {
  if(draftState.currentPick === 'A') {
    if(draftState.teamB.length > 1) { draftState.teamB.pop(); draftState.currentPick = 'B'; }
  } else {
    if(draftState.teamA.length > 1) { draftState.teamA.pop(); draftState.currentPick = 'A'; }
  }
  renderTeamDraft();
}

function draftSetCommon(name) {
  draftState.commonPlayer = name;
  draftState.step = 'done';
  renderTeamDraft();
}

function draftRenderDone(el) {
  const s = draftState;
  el.innerHTML = `

function draftGetText() {
  const s = draftState;
  let txt = '\u{1F3CF} Today\'s Teams\n\n';
  txt += s.teamA[0] + '\'s Team\n';
  s.teamA.forEach((p,i) => { txt += (i+1) + '. ' + p + (i===0?' (C)':'') + '\n'; });
  txt += '\n' + s.teamB[0] + '\'s Team\n';
  s.teamB.forEach((p,i) => { txt += (i+1) + '. ' + p + (i===0?' (C)':'') + '\n'; });
  if(s.commonPlayer) { txt += '\n\u{2B50} Common Player: ' + s.commonPlayer + ' (plays for both teams)\n'; }
  txt += '\n\u{1FA99} Toss: ' + s.tossWinner + ' won';
  return txt;
}

async function draftCopy() {
  const txt = draftGetText();
  try {
    await navigator.clipboard.writeText(txt);
    alert('Copied to clipboard!');
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}

function draftWhatsApp() {
  const txt = draftGetText();
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

function draftStartMatch() {
  const s = draftState;
  saveTeam(s.teamA[0] + '\'s Team', s.teamA);
  saveTeam(s.teamB[0] + '\'s Team', s.teamB);
  localStorage.setItem('cricket_draft_teamA', JSON.stringify({name: s.teamA[0]+'\'s Team', players: s.teamA}));
  localStorage.setItem('cricket_draft_teamB', JSON.stringify({name: s.teamB[0]+'\'s Team', players: s.teamB}));
  if(s.commonPlayer) localStorage.setItem('cricket_draft_common', s.commonPlayer);
  navigate('setup');
  setTimeout(()=>{
    try {
      const tA = JSON.parse(localStorage.getItem('cricket_draft_teamA'));
      const tB = JSON.parse(localStorage.getItem('cricket_draft_teamB'));
      if(tA) { document.getElementById('inp-teamA').value=tA.name; applyTeam('A',JSON.stringify(tA)); }
      if(tB) { document.getElementById('inp-teamB').value=tB.name; applyTeam('B',JSON.stringify(tB)); }
      const cm = localStorage.getItem('cricket_draft_common');
      if(cm) { const ci = document.getElementById('inp-common'); if(ci) ci.value = cm; }
      localStorage.removeItem('cricket_draft_teamA');
      localStorage.removeItem('cricket_draft_teamB');

    }catch(e){}

}

let _electionBusy = false;
async function pickElection(choice) {
  if(_electionBusy) return;           // double tap on Bat/Bowl
  _electionBusy = true;
  try { await _pickElection(choice); } finally { _electionBusy = false; }
}
async function _pickElection(choice) {
  const m = state.match;
  const battingFirst = choice==='bat' ? tossState.winner :
    (tossState.winner===m.team_a ? m.team_b : m.team_a);
  let tossRes = null;
  for(let attempt = 0; attempt < 3; attempt++) {
    try {
      tossRes = await apiCall('set_toss', {
        match_id: tossState.matchId,
        toss_winner: tossState.winner,
        batting_first: battingFirst
      });
      if(!tossRes.error) break;
      if(attempt < 2) await new Promise(r => setTimeout(r, 600));
    } catch(e) {
      if(attempt === 2) { alert('Error: '+e.message); return; }
      await new Promise(r => setTimeout(r, 600));
    }
  }
  if(tossRes?.error) { alert('Error: '+tossRes.error); return; }
  state.match.batting_first = battingFirst;
  state.match.toss_winner = tossState.winner;
  navigate('openers/'+tossState.matchId);
}

async function doStartInningsText(matchId, inn) {
  const striker = document.getElementById('txt-striker').value.trim();
  const nonStriker = document.getElementById('txt-nonstriker').value.trim();
  const bowler = document.getElementById('txt-bowler').value.trim();
  if(!striker || !nonStriker) { alert('Enter both batsmen names'); return; }
  if(!bowler) { alert('Enter bowler name'); return; }

  // Resume mid-match fields
  const isResume = document.getElementById('resume-toggle')?.checked;
  let resumeRuns=0, resumeWickets=0, resumeBalls=0;
  if(isResume) {
    resumeRuns = parseInt(document.getElementById('resume-runs')?.value) || 0;
    resumeWickets = parseInt(document.getElementById('resume-wickets')?.value) || 0;
    const oversStr = document.getElementById('resume-overs')?.value.trim() || '0';
    const parts = oversStr.split('.');
    resumeBalls = (parseInt(parts[0])||0)*6 + (parseInt(parts[1])||0);
    if(resumeBalls < 0) resumeBalls = 0;
  }

  const btn = document.getElementById('btn-start-text');
  btn.disabled=true; btn.textContent='Starting...';
  try {
    // Read & clear the "came from innings-end" flag set by handleInningsEnd
    const forcedNextInn = parseInt(sessionStorage.getItem('_cricket_next_inn')) || 0;
    sessionStorage.removeItem('_cricket_next_inn');
    const fresh = await apiCall('get_match', {match_id: matchId});
    if(fresh.error) throw new Error(fresh.error);
    const totalInns2 = fresh.total_innings || 2;
    if(forcedNextInn) {
      // Came from innings-end — bypass stale in_progress status, only skip if target innings itself running
      if(fresh[`innings_${inn}_status`] === 'in_progress') { navigate('scoring/'+matchId); return; }
    } else {
      // Normal flow — if ANY innings is already running, go to scoring (handles bounce-back race)
      for(let i = 1; i <= totalInns2; i++) {
        if(fresh[`innings_${i}_status`] === 'in_progress') { navigate('scoring/'+matchId); return; }
      }
    }
    const sres = await apiCall('start_innings', {
      match_id: matchId, innings: inn,
      on_strike: striker, non_striker: nonStriker, bowler
    });
    if(sres.error) throw new Error(sres.error);
    if(isResume && (resumeRuns > 0 || resumeWickets > 0 || resumeBalls > 0)) {
      await apiCall('resume_innings_score', {
        match_id: matchId, innings: inn,
        total_runs: resumeRuns, total_wickets: resumeWickets, total_balls: resumeBalls
      });
    }
    localStorage.setItem('cricket_access_' + matchId, 'full');
    navigate('scoring/'+matchId);
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Start Innings \u{1F3CF}'; }
}

async function doStartInnings(matchId, inn) {
  const bats = [...document.querySelectorAll('.sel-bat:checked')].map(i=>i.value);
  const bowler = document.querySelector('.sel-bowl:checked')?.value;
  if(bats.length!==2) { alert('Select exactly 2 batsmen'); return; }
  if(!bowler) { alert('Select a bowler'); return; }
  const btn = document.getElementById('btn-start');
  btn.disabled=true; btn.textContent='Starting...';
  try {
    const targetInn = inn || 1;
    const forcedNextInn = parseInt(sessionStorage.getItem('_cricket_next_inn')) || 0;
    sessionStorage.removeItem('_cricket_next_inn');
    const freshMatch = await apiCall('get_match', {match_id: matchId});
    if(freshMatch.error) throw new Error(freshMatch.error);
    const totalInns = freshMatch.total_innings || 2;
    if(forcedNextInn) {
      if(freshMatch[`innings_${targetInn}_status`] === 'in_progress') { navigate('scoring/'+matchId); return; }
    } else {
      for(let i = 1; i <= totalInns; i++) {
        if(freshMatch[`innings_${i}_status`] === 'in_progress') { navigate('scoring/'+matchId); return; }
      }
    }
    const res = await apiCall('start_innings', {
      match_id: matchId, innings: Math.min(targetInn, totalInns),
      on_strike: bats[0], non_striker: bats[1], bowler
    });
    if(res.error) throw new Error(res.error);
    localStorage.setItem('cricket_access_' + matchId, 'full');
    navigate('scoring/'+matchId);
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Start Match \u{1F3CF}'; }
}
