async function renderScoring(matchId) {
  const _acc = localStorage.getItem('cricket_access_' + matchId);
  if (_isAdmin()) localStorage.setItem('cricket_access_' + matchId, 'full');
  if (_acc !== 'full' && !_isAdmin()) { navigate('live/' + matchId); return; }
  state.matchId = matchId;
  app.innerHTML = `<div class="flex-1 flex items-center justify-center flex-col gap-3"><div class="spin"></div><div class="text-sm" style="color:var(--text2)">Loading match…</div></div>`;
  const bounceToOpenersIfNeeded = async () => {
    try {
      const m = await apiCall('get_match', {match_id: matchId});
      if(!m || m.error) return false;
      state.match = m;
      const inn1 = m.innings_1_status || 'not_started';
      const inn2 = m.innings_2_status || 'not_started';
      if(inn1 === 'in_progress' || inn2 === 'in_progress') return false; // innings running — don't bounce
      if(m.batting_first) { navigate('openers/'+matchId); return true; } // toss done, go to openers
      if(m.status === 'created') { navigate('toss/'+matchId); return true; }
      return false;
    } catch(e) { return false; }
  };

  let getStateRes = null;
  try {
    getStateRes = await apiCall('get_state', {match_id: matchId});
  } catch(e) {
    await new Promise(r => setTimeout(r, 1000));
    try { getStateRes = await apiCall('get_state', {match_id: matchId}); }
    catch(e2) {
      if(await bounceToOpenersIfNeeded()) return;
      alert('Error: '+e2.message); navigate('home'); return;
    }
  }
  // n8n may not have committed start_innings yet — retry up to 4× before giving up
  for(let attempt = 0; attempt < 4; attempt++) {
    if(!getStateRes.error && getStateRes.onStrike) break;
    await new Promise(r => setTimeout(r, 900 + attempt * 400));
    try {
      const retry = await apiCall('get_state', {match_id: matchId});
      if(!retry.error) getStateRes = retry;
    } catch(e) {}
  }
  if(!_stillOn('scoring', matchId)) return;
  if(getStateRes.error) {
    if(getStateRes.error.includes('No striker') || getStateRes.error.includes('No bowler') || getStateRes.error.includes('No innings') || getStateRes.error.includes('Innings')) {
      if(await bounceToOpenersIfNeeded()) return;
    }
    app.innerHTML = `<div class="flex-1 flex items-center justify-center flex-col gap-4 p-8 text-center">
      <div style="font-size:40px">⚠️</div>
      <div class="font-bold">Error loading match</div>
      <div class="text-sm" style="color:var(--text2)">${_escHtml(getStateRes.error)}</div>
      <button onclick="renderScoring('${matchId}')" class="px-6 py-3 rounded-xl bg-cricket-600 text-white font-bold mt-2">Retry</button>
      <button onclick="navigate('home')" class="text-sm mt-1" style="color:var(--text2)">Go Home</button>
    </div>`;
    return;
  }
  Object.assign(state, getStateRes);
  state.matchId = matchId;
  // Apply ball offset if one was stored for this innings
  if(state.score) {
    const offsetKey = '_ballOffset_' + matchId + '_' + (state.innings||1);
    const offset = parseInt(sessionStorage.getItem(offsetKey)) || 0;
    if(offset > 0) state.score.balls = (state.score.balls || 0) + offset;
  }
  if(!state.onStrike) {
    if(await bounceToOpenersIfNeeded()) return;
    app.innerHTML = `<div class="flex-1 flex items-center justify-center flex-col gap-4 p-8 text-center">
      <div style="font-size:40px">⏳</div>
      <div class="font-bold">Match is starting…</div>
      <div class="text-sm" style="color:var(--text2)">Server is saving the innings. Tap below to retry.</div>
      <button onclick="renderScoring('${matchId}')" class="px-6 py-3 rounded-xl bg-cricket-600 text-white font-bold mt-2">Retry</button>
    </div>`;
    return;
  }
  if(!_stillOn('scoring', matchId)) return;
  state.wagonWheelBalls = [];
  destroyVisualGame();
  if(state.recordingEnabled) await startCamera();
  initMarketStats(); // Load ball stats from past matches for odds calculation
  state._bhavData = null; // reset bhav on new match
  refreshBhav();
  drawScoring();
  startAutoSync();
}

async function refreshScoring() {
  if(!state.matchId || !_stillOn('scoring', state.matchId)) return;
  try {
    const seq = _apiWriteSeq, mid = state.matchId;
    const res = await apiCall('get_state', {match_id: mid});
    if(res.error) throw new Error(res.error);
    // a ball was scored while this poll was in flight -> its snapshot is older than the screen
    if(seq !== _apiWriteSeq || state.pendingRequest || mid !== state.matchId || !_stillOn('scoring', mid)) return;
    const localBowler = state.bowler;
    Object.assign(state, res);
    if(!state.bowler && localBowler) state.bowler = localBowler;
    state.isFreeHit = false;
    const over = state.thisOver||[];
    if(over.length > 0 && over[over.length-1].extrasType === 'noball') state.isFreeHit = true;
    drawScoring();
  } catch(e) { /* silent */ }
}

let _phaserGame = null;
let _boxGroundScene = null;

function destroyVisualGame() {
  if (_phaserGame) {
    _phaserGame.destroy(true);

    _boxGroundScene = null;
  }
}

function initBoxGround() {
  const cnv = document.getElementById('boxCanvas');
  if (!cnv) return;
  destroyVisualGame();
  const container = cnv.parentElement;
  cnv.style.display = 'none';

  class BoxGroundScene extends Phaser.Scene {
    constructor() { super('BoxGround'); }

    create() {
      _boxGroundScene = this;
      const W = this.scale.width, H = this.scale.height;
      const isPro = (state.match?.game_mode === 'professional');
      this._isPro = isPro;

      const gtl = isPro ? 0 : W * 0.09, gtr = isPro ? W : W * 0.91;
      const gbl = 0, gbr = W;
      const gt = 0, gb = H;
      const pitchX = W / 2, pitchY = isPro ? H * 0.50 : H * 0.54;
      const behindDist = isPro ? Math.min(H - pitchY - 6, pitchY - 6) : (H - pitchY - 6);
      const aheadDist = pitchY - 6;

      this._W = W; this._H = H;
      this._pitchX = pitchX; this._pitchY = pitchY;
      this._groundW = W; this._groundH = H;
      this._gx = 0; this._gy = 0;
      this._gtl = gtl; this._gtr = gtr; this._gbl = gbl; this._gbr = gbr;
      this._gt = gt; this._gb = gb;
      this._behindDist = behindDist; this._aheadDist = aheadDist;
      this._shotLines = []; this._shotDots = [];

      const gfx = this.add.graphics();
      const lightGfx = this.add.graphics().setDepth(1);
      const fColor = 0x3b82f6;

      gfx.fillStyle(0x06101e, 1); gfx.fillRect(0, 0, W, H);

      if (isPro) {
        gfx.fillStyle(0x1a2540, 1); gfx.fillEllipse(pitchX, H * 0.08, W * 1.3, H * 0.35);
        gfx.fillStyle(0x152035, 1); gfx.fillEllipse(pitchX, H * 0.12, W * 1.1, H * 0.25);
        const ovalRx = W * 0.48, ovalRy = H * 0.42;
        gfx.fillStyle(0x1a6b30, 1); gfx.fillEllipse(pitchX, pitchY, ovalRx * 2, ovalRy * 2);
        for (let i = 0; i < 14; i++) {
          if (i % 2 === 0) { gfx.fillStyle(0x239948, 0.2); gfx.fillRect(pitchX - ovalRx, pitchY - ovalRy + i * (ovalRy * 2 / 14), ovalRx * 2, ovalRy * 2 / 14); }
        }
        const innerGfx = this.add.graphics().setDepth(2);
        innerGfx.lineStyle(2, 0xffffff, 0.2); innerGfx.strokeEllipse(pitchX, pitchY, ovalRx * 1.1, ovalRy * 1.1);
        const ropeGfx = this.add.graphics().setDepth(2);
        ropeGfx.lineStyle(4, 0xffffff, 0.5); ropeGfx.strokeEllipse(pitchX, pitchY, (ovalRx - 6) * 2, (ovalRy - 6) * 2);
        ropeGfx.lineStyle(8, 0xffffff, 0.06); ropeGfx.strokeEllipse(pitchX, pitchY, (ovalRx - 6) * 2, (ovalRy - 6) * 2);
        lightGfx.fillStyle(0xffffff, 0.04); lightGfx.fillCircle(pitchX, pitchY, H * 0.35);
        [[W*0.08,H*0.06],[W*0.92,H*0.06],[W*0.04,H*0.5],[W*0.96,H*0.5]].forEach(([fx,fy]) => {
          lightGfx.lineStyle(3, 0x4b5563, 0.6); lightGfx.lineBetween(fx, fy, fx, fy + 30);
          lightGfx.fillStyle(0xf59e0b, 0.9); lightGfx.fillRect(fx - 4, fy - 3, 8, 6);
          lightGfx.fillStyle(0xffffff, 0.02); lightGfx.fillTriangle(fx - 4, fy, fx - 40, pitchY, fx + 40, pitchY);
        });
      } else {
        gfx.fillStyle(0x1a6b30, 1);
        gfx.beginPath(); gfx.moveTo(gtl, gt); gfx.lineTo(gtr, gt); gfx.lineTo(gbr, gb); gfx.lineTo(gbl, gb); gfx.closePath(); gfx.fillPath();
        gfx.fillStyle(0x30a855, 0.25); gfx.fillEllipse(pitchX, pitchY - 20, W * 0.5, H * 0.35);
        for (let i = 0; i < 18; i++) {
          const t1 = i / 18, t2 = (i + 1) / 18;
          const y1 = H * t1, y2 = H * t2;
          const lx1 = Phaser.Math.Linear(gtl, gbl, t1), rx1 = Phaser.Math.Linear(gtr, gbr, t1);
          const lx2 = Phaser.Math.Linear(gtl, gbl, t2), rx2 = Phaser.Math.Linear(gtr, gbr, t2);
          gfx.fillStyle(i % 2 === 0 ? 0x239948 : 0x1c8a3c, 0.35);

      const p1 = perim[seg], p2 = perim[(seg+1)%4];
      return { x: Phaser.Math.Linear(p1.x, p2.x, st), y: Phaser.Math.Linear(p1.y, p2.y, st) };

      const normDist = Math.min(rawDist / maxDist, 1.1);
      const suggestedRuns = getRunsFromDistance(normDist);
      this._tapAngle = angle; this._tapDist = normDist;
      this._tapZone = zone; this._tapX = px; this._tapY = py;

      const ripple = this.add.circle(px, py, 5, 0xffffff, 0.6).setDepth(12);
      this.tweens.add({ targets: ripple, scaleX: 5, scaleY: 5, alpha: 0, duration: 400, onComplete: () => ripple.destroy() });

      const zLabel = this.add.text(px, py - 25, zone.name, {

        backgroundColor: zone.restricted ? 'rgba(180,120,20,0.85)' : 'rgba(0,180,140,0.8)',
        padding: { x: 10, y: 4 }
      }).setOrigin(0.5).setDepth(13).setAlpha(0);
      this.tweens.add({ targets: zLabel, alpha: 1, y: py - 38, duration: 180, onComplete: () => {
        this.tweens.add({ targets: zLabel, alpha: 0, y: py - 55, duration: 700, delay: 500, onComplete: () => zLabel.destroy() });
      }});

      this._showRunPicker(px, py, suggestedRuns, zone.restricted);

    _showRunPicker(x, y, suggested, isRestricted) {
      this._runPickerContainer.removeAll(true);
      this._runPickerContainer.setVisible(true);
      const W = this._W, H = this._H;
      const radius = 72;
      const margin = radius + 34;
      const cx = Phaser.Math.Clamp(x, margin, W - margin);
      const cy = Phaser.Math.Clamp(y, margin + 92, H - margin);

      const dim = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.45).setInteractive();
      dim.on('pointerdown', () => this._hideRunPicker());
      this._runPickerContainer.add(dim);

      const ringGfx = this.add.graphics().setDepth(41);
      ringGfx.lineStyle(2.5, 0x00c9a7, 0.3);
      ringGfx.strokeCircle(cx, cy, radius + 4);
      this._runPickerContainer.add(ringGfx);

      const options = [0, 1, 2, 3, 4, 6, -1];
      const colors = {
        0: {bg:0x374151,glow:0x6b7280}, 1: {bg:0x2563eb,glow:0x3b82f6},
        2: {bg:0x2563eb,glow:0x3b82f6}, 3: {bg:0x7c3aed,glow:0x8b5cf6},
        4: {bg:0xd97706,glow:0xf59e0b}, 6: {bg:0x16a34a,glow:0x22c55e},
        '-1': {bg:0xdc2626,glow:0xef4444}
      };
      const astep = (Math.PI * 2) / options.length;

      options.forEach((runs, i) => {
        const a = -Math.PI/2 + i * astep;
        const bx = cx + Math.cos(a) * radius, by = cy + Math.sin(a) * radius;
        const hi = runs === suggested;
        const c = colors[runs] || colors['-1'];
        const sz = hi ? 30 : 24;
        if (hi) {
          const gl = this.add.circle(bx, by, sz + 8, c.glow, 0.25).setDepth(41);
          this.tweens.add({ targets: gl, scaleX: 1.3, scaleY: 1.3, alpha: 0.08, yoyo: true, repeat: -1, duration: 600 });
          this._runPickerContainer.add(gl);
        }
        const cir = this.add.circle(bx, by, sz, c.bg, hi ? 1 : 0.7).setDepth(42);
        cir.setStrokeStyle(hi ? 2.5 : 1, 0xffffff, hi ? 0.8 : 0.2);
        cir.setInteractive({ useHandCursor: true });
        const label = runs === -1 ? 'W' : runs === 0 ? '\u00B7' : String(runs);
        const lb = this.add.text(bx, by, label, {
          fontSize: hi ? '26px' : '19px', fontFamily: 'Arial', fontStyle: 'bold', color: '#fff'
        }).setOrigin(0.5).setDepth(43);
        if (hi) this.tweens.add({ targets: cir, scaleX: 1.12, scaleY: 1.12, yoyo: true, repeat: -1, duration: 500, ease: 'Sine.easeInOut' });
        if (runs === -1) { cir.on('pointerdown', () => { this._hideRunPicker(); showWicketModal(); }); }
        else { cir.on('pointerdown', () => this._selectRuns(runs)); }
        this._runPickerContainer.add([cir, lb]);
      });

      const shot = getShotTypeFromAngle(this._tapAngle);
      const sl = this.add.text(cx, cy, shot.label, {
        fontSize: '11px', fontFamily: 'Arial', fontStyle: 'bold', color: '#94a3b8',
        backgroundColor: 'rgba(0,0,0,0.6)', padding: { x: 8, y: 3 }
      }).setOrigin(0.5).setDepth(44);
      this._runPickerContainer.add(sl);
    }

    _hideRunPicker() { if (this._runPickerContainer) { this._runPickerContainer.removeAll(true); this._runPickerContainer.setVisible(false); } }

    _selectRuns(runs) {
      this._hideRunPicker();
      const angle = this._tapAngle, dist = this._tapDist;
      const tx = this._tapX, ty = this._tapY;
      const shot = getShotTypeFromAngle(angle);

      this._animateShot(tx, ty, runs, () => {
        this._addShotLine(tx, ty, runs);
        if (runs === 4) this._celebrateFour(tx, ty);
        if (runs === 6) this._celebrateSix(tx, ty);
        if (runs === 0) this._celebrateDot();

        const bt = state._vsBowlType || '', pz = state._vsPitchZone || '';
        const celebDelay = runs >= 6 ? 1200 : runs >= 4 ? 900 : runs === 0 ? 400 : 200;
        setTimeout(() => {
          state._vsStep = 3; state._vsPitchZone = '';
          scoreBallVisual(runs, bt, pz, angle, dist, shot.type);
        }, celebDelay);
      });

      const info = document.getElementById('vs-shot-info');
      if (info) {
        const col = runs >= 6 ? '#22c55e' : runs >= 4 ? '#f59e0b' : runs >= 2 ? '#3b82f6' : '#64748b';
        info.innerHTML = '<span style="font-size:28px;font-weight:900;color:' + col + '">' + (runs === 0 ? '\u00B7' : runs) + '</span><div style="font-size:11px;font-weight:700;color:#94a3b8">' + shot.label + '</div>';
      }
    }

    _animateShot(tx, ty, runs, onComplete) {
      const col = runs >= 6 ? 0x22c55e : runs >= 4 ? 0xf59e0b : runs >= 2 ? 0x3b82f6 : 0x64748b;
      const impact = this.add.circle(this._pitchX, this._pitchY, 10, 0xffffff, 0.7).setDepth(16);
      this.tweens.add({ targets: impact, scaleX: 2.5, scaleY: 2.5, alpha: 0, duration: 200, onComplete: () => impact.destroy() });

      const ball = this.add.circle(this._pitchX, this._pitchY, 5, 0xcc0000, 1).setDepth(15);
      ball.setStrokeStyle(1.5, 0xffffff, 0.8);
      const shadow = this.add.ellipse(this._pitchX, this._pitchY + 6, 8, 4, 0x000000, 0.2).setDepth(14);
      const trailGfx = this.add.graphics().setDepth(14);
      const dist = Phaser.Math.Distance.Between(this._pitchX, this._pitchY, tx, ty);
      const midX = (this._pitchX + tx) / 2, midY = (this._pitchY + ty) / 2;

      this.tweens.add({
        targets: ball, x: tx, y: ty,
        duration: 200 + dist * 0.35, ease: 'Quad.easeOut',
        onUpdate: () => {
          shadow.setPosition(ball.x, ball.y + 6);
          trailGfx.clear();
          trailGfx.lineStyle(12, col, 0.1);
          trailGfx.lineBetween(this._pitchX, this._pitchY, ball.x, ball.y);
          trailGfx.lineStyle(4, col, 0.6);
          trailGfx.lineBetween(this._pitchX, this._pitchY, ball.x, ball.y);
          trailGfx.lineStyle(1.5, 0xffffff, 0.3);
          trailGfx.lineBetween(this._pitchX, this._pitchY, ball.x, ball.y);
        },
        onComplete: () => {
          const flash = this.add.circle(tx, ty, 20, col, 0.6).setDepth(15);
          this.tweens.add({ targets: flash, alpha: 0, scaleX: 3, scaleY: 3, duration: 350, onComplete: () => flash.destroy() });
          this.tweens.add({ targets: ball, alpha: 0, scaleX: 0.3, scaleY: 0.3, duration: 200, onComplete: () => ball.destroy() });
          this.tweens.add({ targets: shadow, alpha: 0, duration: 200, onComplete: () => shadow.destroy() });
          this.tweens.add({ targets: trailGfx, alpha: 0, duration: 400, onComplete: () => trailGfx.destroy() });
          if (onComplete) onComplete();
        }
      });
    }

    _addShotLine(tx, ty, runs) {
      const col = runs >= 6 ? 0x22c55e : runs >= 4 ? 0xf59e0b : runs >= 2 ? 0x3b82f6 : 0x4b5563;
      this._wagonGfx.lineStyle(4, col, 0.08);
      this._wagonGfx.lineBetween(this._pitchX, this._pitchY, tx, ty);
      this._wagonGfx.lineStyle(1.5, col, 0.45);
      this._wagonGfx.lineBetween(this._pitchX, this._pitchY, tx, ty);
      const glow = this.add.circle(tx, ty, runs >= 4 ? 7 : 4, col, 0.2).setDepth(10);
      const dot = this.add.circle(tx, ty, runs >= 4 ? 4 : 2.5, col, 0.9).setDepth(10);
      dot.setStrokeStyle(0.5, 0xffffff, 0.6);
      this._shotDots.push(dot, glow);
      if (runs >= 4) this.add.text(tx, ty, String(runs), { fontSize: '7px', fontFamily: 'Arial', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5).setDepth(11);
      this._shotLines.push({ x: tx, y: ty, runs });
    }

    _drawPrevShots() {
      (state.wagonWheelBalls || []).forEach(b => {
        if (b.shotAngle == null) return;
        const rd = (b.shotAngle - 90) * Math.PI / 180;
        const isBehi = (b.shotAngle > 120 && b.shotAngle < 240);
        const maxD = isBehi ? this._behindDist : this._aheadDist;
        const len = (b.shotDistance || 0.3) * maxD * 0.85;
        const ex = this._pitchX + Math.cos(rd) * len, ey = this._pitchY + Math.sin(rd) * len;
        const col = b.runs >= 6 ? 0x22c55e : b.runs >= 4 ? 0xf59e0b : b.runs >= 2 ? 0x3b82f6 : 0x4b5563;
        this._wagonGfx.lineStyle(1.5, col, 0.25);
        this._wagonGfx.lineBetween(this._pitchX, this._pitchY, ex, ey);
        this.add.circle(ex, ey, b.runs >= 4 ? 4 : 2.5, col, 0.6).setDepth(10);
      });
    }

    _celebrateFour(x, y) {
      this.tweens.add({ targets: this.cameras.main, zoom: 1.04, duration: 150, yoyo: true, ease: 'Sine.easeInOut' });
      for (let i = 0; i < 18; i++) {
        const a = (i/18)*Math.PI*2, spd = 50+Math.random()*150;
        const c = Math.random() > 0.3 ? 0xf59e0b : 0xef4444;
        const p = this.add.circle(x, y, 2+Math.random()*3, c, 1).setDepth(45);
        this.tweens.add({ targets: p, x: x+Math.cos(a)*spd, y: y+Math.sin(a)*spd, alpha: 0, scaleX: 0.1, scaleY: 0.1, duration: 500+Math.random()*300, onComplete: () => p.destroy() });
      }
      const txt = this.add.text(this._W/2, this._H*0.42, 'FOUR!', {
        fontSize: '52px', fontFamily: 'Arial', fontStyle: 'bold', color: '#f59e0b', stroke: '#000', strokeThickness: 6
      }).setOrigin(0.5).setDepth(55).setAlpha(0).setScale(0.2);
      this.tweens.add({ targets: txt, alpha: 1, scaleX: 1.15, scaleY: 1.15, duration: 200, ease: 'Back.easeOut', onComplete: () => {
        this.tweens.add({ targets: txt, alpha: 0, scaleX: 1.5, scaleY: 1.5, y: txt.y - 25, duration: 500, delay: 350, onComplete: () => txt.destroy() });
      }});
      const fg = this.add.graphics().setDepth(44);
      fg.lineStyle(6, 0xf59e0b, 0.8);
      fg.beginPath(); fg.moveTo(this._gtl, this._gt); fg.lineTo(this._gtr, this._gt);
      fg.lineTo(this._gbr, this._gb); fg.lineTo(this._gbl, this._gb); fg.closePath(); fg.strokePath();
      this.tweens.add({ targets: fg, alpha: 0, duration: 600, onComplete: () => fg.destroy() });
    }

    _celebrateSix(x, y) {
      const flashRect = this.add.rectangle(this._W/2, this._H/2, this._W, this._H, 0xffffff, 0.15).setDepth(53);
      this.tweens.add({ targets: flashRect, alpha: 0, duration: 300, onComplete: () => flashRect.destroy() });
      const fb = this.add.circle(x, y, 6, 0xcc0000, 1).setDepth(45);
      fb.setStrokeStyle(2, 0xffffff, 0.9);
      this.tweens.add({ targets: fb, y: y-120, scaleX: 3, scaleY: 3, alpha: 0, duration: 700, ease: 'Quad.easeOut',
        onUpdate: () => {
          if (Math.random() > 0.5) {
            const sp = this.add.circle(fb.x + (Math.random()-0.5)*20, fb.y + 10, 1.5, 0xffd700, 0.8).setDepth(45);
            this.tweens.add({ targets: sp, alpha: 0, scaleX: 0.2, scaleY: 0.2, y: sp.y + 15, duration: 400, onComplete: () => sp.destroy() });
          }
        },
        onComplete: () => fb.destroy()
      });
      for (let i = 0; i < 28; i++) {
        const a = (i/28)*Math.PI*2, spd = 80+Math.random()*180;
        const c = [0x22c55e, 0xf59e0b, 0xffffff, 0x3b82f6, 0xef4444][Math.floor(Math.random()*5)];
        const p = this.add.circle(x, y, 2+Math.random()*4, c, 1).setDepth(45);
        this.tweens.add({ targets: p, x: x+Math.cos(a)*spd, y: y+Math.sin(a)*spd-50, alpha: 0, scaleX: 0.05, scaleY: 0.05, duration: 600+Math.random()*500, onComplete: () => p.destroy() });
      }
      for (let i = 0; i < 15; i++) {
        const cx2 = Math.random() * this._W;
        const c = [0x22c55e, 0xf59e0b, 0x3b82f6, 0xef4444, 0xa855f7][Math.floor(Math.random()*5)];
        const conf = this.add.rectangle(cx2, -10, 4, 8, c, 0.8).setDepth(54);
        this.tweens.add({ targets: conf, y: this._H + 20, angle: Math.random()*360, duration: 1500+Math.random()*1000, delay: Math.random()*400, onComplete: () => conf.destroy() });
      }
      const txt = this.add.text(this._W/2, this._H*0.38, 'MAXIMUM!', {
        fontSize: '48px', fontFamily: 'Arial', fontStyle: 'bold', color: '#22c55e', stroke: '#000', strokeThickness: 6
      }).setOrigin(0.5).setDepth(55).setAlpha(0).setScale(0.15);
      this.tweens.add({ targets: txt, alpha: 1, scaleX: 1.2, scaleY: 1.2, duration: 250, ease: 'Back.easeOut', onComplete: () => {
        this.tweens.add({ targets: txt, alpha: 0, scaleX: 1.6, scaleY: 1.6, y: txt.y - 35, duration: 700, delay: 500, onComplete: () => txt.destroy() });
      }});
      this.cameras.main.shake(400, 0.012);
      const fg = this.add.graphics().setDepth(44);
      fg.lineStyle(8, 0x22c55e, 0.8);
      fg.beginPath(); fg.moveTo(this._gtl, this._gt); fg.lineTo(this._gtr, this._gt);
      fg.lineTo(this._gbr, this._gb); fg.lineTo(this._gbl, this._gb); fg.closePath(); fg.strokePath();
      this.tweens.add({ targets: fg, alpha: 0, duration: 800, onComplete: () => fg.destroy() });
    }

    _celebrateDot() {
      const pulse = this.add.circle(this._pitchX, this._pitchY, 6, 0x475569, 0.5).setDepth(15);
      this.tweens.add({ targets: pulse, alpha: 0, scaleX: 3, scaleY: 3, duration: 400, onComplete: () => pulse.destroy() });
      const dots = (state.thisOver || []).filter(b => b.runs === 0 && b.extrasType === 'none').length;
      if (dots >= 3) {
        const pTxt = this.add.text(this._pitchX, this._pitchY - 30, 'PRESSURE!', {
          fontSize: '14px', fontFamily: 'Arial', fontStyle: 'bold', color: '#ef4444',
          backgroundColor: 'rgba(0,0,0,0.6)', padding: { x: 8, y: 3 }
        }).setOrigin(0.5).setDepth(16).setAlpha(0);
        this.tweens.add({ targets: pTxt, alpha: 1, y: this._pitchY - 45, duration: 300, onComplete: () => {
          this.tweens.add({ targets: pTxt, alpha: 0, duration: 800, delay: 600, onComplete: () => pTxt.destroy() });
        }});
      }
    }
  }

  _phaserGame = new Phaser.Game({
    type: Phaser.CANVAS,
    width: 680,
    height: 920,
    parent: container,
    backgroundColor: '#06101e',
    transparent: false,

  });
}

function getShotTypeFromAngle(angle) {
  const a = ((angle % 360) + 360) % 360;
  if (a >= 350 || a < 15) return { type: 'straight_drive', label: 'Straight Drive' };
  if (a >= 15 && a < 40) return { type: 'off_drive', label: 'Off Drive' };
  if (a >= 40 && a < 65) return { type: 'cover_drive', label: 'Cover Drive' };
  if (a >= 65 && a < 85) return { type: 'square_cut', label: 'Square Cut' };
  if (a >= 85 && a < 110) return { type: 'cut', label: 'Cut' };
  if (a >= 110 && a < 140) return { type: 'late_cut', label: 'Late Cut' };
  if (a >= 140 && a < 170) return { type: 'third_man', label: '3rd Man/Edge' };
  if (a >= 170 && a < 190) return { type: 'fine_edge', label: 'Fine Edge' };
  if (a >= 190 && a < 220) return { type: 'leg_glance', label: 'Leg Glance' };
  if (a >= 220 && a < 250) return { type: 'flick', label: 'Flick' };
  if (a >= 250 && a < 275) return { type: 'pull', label: 'Pull' };
  if (a >= 275 && a < 295) return { type: 'hook', label: 'Hook' };
  if (a >= 295 && a < 320) return { type: 'sweep', label: 'Sweep' };
  if (a >= 320 && a < 340) return { type: 'on_drive', label: 'On Drive' };
  if (a >= 340 && a < 350) return { type: 'straight_drive', label: 'Straight Drive' };
  return { type: 'lofted', label: 'Lofted' };
}

function getRunsFromDistance(dist) {
  if (dist < 0.12) return 0;
  if (dist < 0.35) return 1;
  if (dist < 0.55) return 2;
  if (dist < 0.75) return 3;
  if (dist < 0.92) return 4;
  return 6;
}

function initWagonCanvas() {
  const canvas = document.getElementById('wwCanvas');
  if (!canvas || canvas._init) return;
  canvas._init = true;
  const ctx = canvas.getContext('2d');
  const W = 500, H = 500, cx = W/2, cy = H/2, R = W/2 - 30;
  let swiping = false, swAngle = 0, swDist = 0;

  function draw(sd) {
    ctx.clearRect(0, 0, W, H);
    const fg = ctx.createRadialGradient(cx,cy,0,cx,cy,R+15);
    fg.addColorStop(0,'#2d8a4e'); fg.addColorStop(0.5,'#1f6b38'); fg.addColorStop(0.85,'#166534'); fg.addColorStop(1,'#0a1628');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(cx,cy,R+10,0,Math.PI*2); ctx.fill();
    for(let i=0;i<24;i++){const a1=i*15*Math.PI/180,a2=(i*15+15)*Math.PI/180;ctx.fillStyle=i%2?'rgba(0,0,0,0.03)':'rgba(255,255,255,0.03)';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R+10,a1,a2);ctx.closePath();ctx.fill();}
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(cx,cy,R*0.55,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    [{t:'Straight',a:-90},{t:'Cover',a:-30},{t:'Point',a:5},{t:'Cut',a:35},{t:'3rd Man',a:75},{t:'Fine Leg',a:105},{t:'Sq Leg',a:185},{t:'Pull',a:210},{t:'On Drive',a:-125}].forEach(l=>{
      const rd=l.a*Math.PI/180;ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(rd)*(R+5),cy+Math.sin(rd)*(R+5));ctx.stroke();
      ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,0.35)';ctx.textAlign='center';ctx.fillText(l.t,cx+Math.cos(rd)*R*0.78,cy+Math.sin(rd)*R*0.78);
    });
    ctx.font='bold 13px Arial';ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillText('OFF SIDE',cx+R*0.45,cy-R+12);ctx.fillText('LEG SIDE',cx-R*0.45,cy-R+12);
    ctx.fillStyle='rgba(196,163,90,0.4)';ctx.fillRect(cx-5,cy-20,10,40);
    (state.wagonWheelBalls||[]).forEach(b=>{if(b.shotAngle==null)return;const rd=(b.shotAngle-90)*Math.PI/180;const len=(b.shotDistance||0.3)*R*0.85;const ex=cx+Math.cos(rd)*len,ey=cy+Math.sin(rd)*len;const col=b.runs>=6?'#22c55e':b.runs>=4?'#f59e0b':b.runs>=2?'#3b82f6':'#64748b';ctx.globalAlpha=0.35;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.fill();ctx.font='16px Arial';ctx.fillStyle='#000';ctx.textAlign='center';ctx.fillText('\u{1F3CF}',cx,cy+5);
    if(sd&&sd.dist>0.05){const rd=(sd.angle-90)*Math.PI/180;const len=sd.dist*R*0.95;const ex=cx+Math.cos(rd)*len,ey=cy+Math.sin(rd)*len;const runs=getRunsFromDistance(sd.dist);const col=runs>=6?'#22c55e':runs>=4?'#f59e0b':runs>=2?'#3b82f6':'#64748b';ctx.shadowColor=col;ctx.shadowBlur=12;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.fillText(runs,ex,ey+5);
      const info=document.getElementById('vs-shot-info');if(info){const shot=getShotTypeFromAngle(sd.angle);info.innerHTML='<span style="font-size:28px;font-weight:900;color:'+col+'">'+runs+'</span><div style="font-size:11px;font-weight:700;color:#94a3b8">'+shot.label+'</div>';}
    }
  }

  function getP(e){const r=canvas.getBoundingClientRect();const sx=W/r.width,sy=H/r.height;const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy};}

  function onDown(e){e.preventDefault();swiping=true;swDist=0;}
  function onMove(e){if(!swiping)return;e.preventDefault();const p=getP(e);const dx=p.x-cx,dy=p.y-cy;swDist=Math.min(Math.sqrt(dx*dx+dy*dy)/R,1.1);let a=Math.atan2(dx,-dy)*(180/Math.PI);if(a<0)a+=360;swAngle=a;draw({angle:swAngle,dist:swDist});}
  function onUp(){if(!swiping)return;swiping=false;if(swDist<0.08){draw(null);return;}
    const runs=getRunsFromDistance(swDist);const shot=getShotTypeFromAngle(swAngle);
    if(runs>=4){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:40;pointer-events:none;animation:vsFlash 0.4s ease-out forwards;background:'+(runs>=6?'rgba(34,197,94,0.3)':'rgba(245,158,11,0.3)');document.body.appendChild(ov);setTimeout(()=>ov.remove(),500);
      const bt2=document.createElement('div');bt2.textContent=runs>=6?'SIX!':'FOUR!';bt2.style.cssText='position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;font-size:56px;font-weight:900;color:#fff;text-shadow:0 4px 20px '+(runs>=6?'#22c55e':'#f59e0b')+';animation:vsCelebPop 0.6s ease-out forwards';document.body.appendChild(bt2);setTimeout(()=>bt2.remove(),700);}
    const _bt=state._vsBowlType||'',_pz=state._vsPitchZone||'';state._vsStep=3;state._vsPitchZone='';
    setTimeout(()=>{scoreBallVisual(runs,_bt,_pz,swAngle,swDist,shot.type);},runs>=4?500:150);
  }

  canvas.addEventListener('touchstart',onDown,{passive:false});canvas.addEventListener('touchmove',onMove,{passive:false});canvas.addEventListener('touchend',onUp);
  canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',(e)=>{if(swiping)onMove(e);});canvas.addEventListener('mouseup',onUp);canvas.addEventListener('mouseleave',()=>{if(swiping){swiping=false;draw(null);}});
  draw(null);
}

async function scoreBallVisual(runs, bowlType, pitchZone, shotAngle, shotDistance, shotType) {
  if(!state.bowler) { setPendingRetry(() => scoreBallVisual(runs, bowlType, pitchZone, shotAngle, shotDistance, shotType)); showBowlerPicker(); return; }
  setPending(true);
  const bk = JSON.parse(JSON.stringify(state));
  state.score.runs += runs;
  state.score.balls += 1;
  if(state.onStrike) { state.onStrike.runs+=runs; state.onStrike.balls+=1; if(runs===4)state.onStrike.fours++; if(runs===6)state.onStrike.sixes++; }
  if(state.bowler) { state.bowler.runs+=runs; state.bowler.balls+=1; }
  state.thisOver.push({runs,extrasType:'none',extrasRuns:0,isWicket:false,bowlType,pitchZone,shotType,shotAngle,shotDistance});
  if (!state.wagonWheelBalls) state.wagonWheelBalls = [];
  if (shotAngle != null) state.wagonWheelBalls.push({runs, shotAngle, shotDistance: shotDistance||0});
  state.isFreeHit = false;
  if (!_phaserGame) {
    if(runs===4) showCelebration('four');
    if(runs===6) showCelebration('six');
  }
  if(runs%2===1) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  const legal = state.thisOver.filter(b=>b.extrasType!=='wide'&&b.extrasType!=='noball').length;
  if(legal===6) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  try { settleMarketBets(runs, 'none', false); } catch(e) {}
  drawScoring();

  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs, extras_type:'none', extras_runs:0, is_wicket:false,
      bowl_type: bowlType, pitch_zone: pitchZone,
      shot_type: shotType, shot_angle: shotAngle, shot_distance: shotDistance
    });
    if(res.error) throw new Error(res.error);
    if(res.status !== 'queued_offline') syncFromServer(res);
    try { if(state.recordingEnabled) saveClip(runs===4||runs===6, {type:runs===6?'six':'four',runs,batsman:state.onStrike?.name,bowler:state.bowler?.name}); } catch(_se) {}
  } catch(e) { Object.assign(state,bk); if(e.message?.includes('No bowler')) { showToast('Select a bowler first'); showBowlerPicker(); } drawScoring(); }
  finally { setPending(false); }
}

async function promptRenamePlayer(oldName) {

async function doSetScoreConfirm() {
  const runs = parseInt(document.getElementById('ss-runs')?.value) || 0;
  const wickets = parseInt(document.getElementById('ss-wkts')?.value) || 0;
  const completedOvers = parseInt(window._ssOv) || 0;
  const extraBalls = parseInt(window._ssBall) || 0;
  const targetBalls = completedOvers * 6 + extraBalls;
  const oversStr = completedOvers + '.' + extraBalls;
  document.getElementById('set-score-modal')?.remove();
  try {
    // Send actual target balls to server — server resets total_balls correctly
    const res = await apiCall('resume_innings_score', {match_id:state.matchId, innings:state.innings, total_runs:runs, total_wickets:wickets, total_balls:targetBalls});
    if(res.error) { showToast('Error: ' + res.error); drawScoring(); return; }
    // Clear any stale sessionStorage offset — server now owns the ball count
    const offsetKey = '_ballOffset_' + state.matchId + '_' + state.innings;
    sessionStorage.setItem(offsetKey, '0');
    Object.assign(state, res);
    if(state.score) state.score.balls = targetBalls;
    showToast('Score set: ' + runs + '/' + wickets + ' (' + oversStr + ' ov) ✔');
  } catch(e) { showToast('Error: '+e.message); }
  drawScoring();
}

let _audCtx = null;
function _getAudCtx() {
  if(!_audCtx) _audCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(_audCtx.state === 'suspended') _audCtx.resume();
  return _audCtx;
}

function _audNoise(ctx, gainVal, dur, bandFreq, bandQ) {
  const now = ctx.currentTime;
  const len = Math.ceil(ctx.sampleRate * (dur + 0.1));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = bandFreq; bp.Q.value = bandQ;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(gainVal, now + Math.min(0.2, dur * 0.15));
  g.gain.setValueAtTime(gainVal, now + dur * 0.45);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(now);
}

function _audTone(ctx, freq, wave, startAt, dur, peak) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = wave; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, startAt);
  g.gain.linearRampToValueAtTime(peak, startAt + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, startAt + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(startAt); osc.stop(startAt + dur + 0.05);
}

function _shoutText(text, pitch, rate) {
  if(!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = pitch; u.rate = rate; u.volume = 1.0;
    const voices = window._cachedVoices || speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en'));
    if(enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  } catch(e) {}
}

function _playCelebAudio(type) {
  try {
    const ctx = _getAudCtx();
    const t = ctx.currentTime;

    if(type === 'four') {
      _shoutText('FOUR!', 1.5, 1.1);
      _audNoise(ctx, 0.28, 1.4, 1100, 1.0);
      [[293.66, 0], [369.99, 0.13], [440, 0.26]].forEach(([f, dt]) =>
        _audTone(ctx, f, 'sawtooth', t + dt, 0.45, 0.14));

    } else if(type === 'six') {
      _shoutText('SIX!', 1.8, 0.95);
      _audNoise(ctx, 0.50, 2.8,  800, 0.8);
      _audNoise(ctx, 0.22, 2.2, 2200, 1.5);
      _audNoise(ctx, 0.18, 1.8,  300, 0.6);
      _audTone(ctx, 65, 'sine', t, 0.7, 0.55);
      _audTone(ctx, 50, 'sine', t + 0.06, 0.55, 0.35);
      [[261.63,0.10],[329.63,0.20],[392,0.30],[523.25,0.40],[659.25,0.50],[523.25,0.65]]
        .forEach(([f,dt]) => _audTone(ctx, f, 'sawtooth', t + dt, 0.55, 0.18));

    } else if(type === 'wicket') {
      _shoutText('OUT!', 0.9, 0.85);
      _audNoise(ctx, 0.32, 2.2, 550, 1.1);
      [[80, 0, 0.60], [60, 0.18, 0.55], [45, 0.38, 0.50]]
        .forEach(([f, dt, g]) => _audTone(ctx, f, 'sine', t + dt, 0.65, g));
    }
  } catch(e) {}
}

let _audioCtx = null;
function _getAudio() {
  if(!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if(_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function _playTones(tones) {
  const ctx = _getAudio();
  if(!ctx) return;
  tones.forEach(t => {
    const start = ctx.currentTime + (t.delay || 0) / 1000;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = t.type || 'sine';
    osc.frequency.setValueAtTime(t.freq, start);
    if(t.freqEnd) osc.frequency.exponentialRampToValueAtTime(t.freqEnd, start + t.duration/1000);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(t.vol || 0.3, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + t.duration/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(start); osc.stop(start + t.duration/1000 + 0.02);
  });
}

function playCueSound(type) {
  if(!state.soundEnabled) return;
  const cues = {
    dot:     [{freq: 200, duration: 40, type: 'sine', vol: 0.15}],
    single:  [{freq: 440, duration: 60, type: 'sine', vol: 0.2}],
    four:    [{freq: 523, duration: 120, type: 'triangle', vol: 0.3}, {freq: 784, duration: 180, delay: 100, type: 'triangle', vol: 0.3}],
    six:     [{freq: 523, duration: 100, type: 'triangle', vol: 0.3}, {freq: 659, duration: 100, delay: 90, type: 'triangle', vol: 0.3}, {freq: 784, duration: 100, delay: 180, type: 'triangle', vol: 0.3}, {freq: 1046, duration: 250, delay: 270, type: 'triangle', vol: 0.35}],
    wicket:  [{freq: 800, duration: 180, freqEnd: 150, type: 'sawtooth', vol: 0.35}, {freq: 200, duration: 400, delay: 180, freqEnd: 80, type: 'sawtooth', vol: 0.3}],
    wide:    [{freq: 600, duration: 80, type: 'square', vol: 0.2}, {freq: 600, duration: 80, delay: 120, type: 'square', vol: 0.2}],
    noball:  [{freq: 800, duration: 80, type: 'square', vol: 0.22}, {freq: 800, duration: 80, delay: 120, type: 'square', vol: 0.22}, {freq: 800, duration: 80, delay: 240, type: 'square', vol: 0.22}],
    over:    [{freq: 880, duration: 150, type: 'sine', vol: 0.25}, {freq: 1320, duration: 200, delay: 130, type: 'sine', vol: 0.25}]
  };
  const t = cues[type]; if(t) _playTones(t);
}

const _vibeSupported = (function() {
  if(!navigator.vibrate) return false;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  if(isIOS) return false;
  return true;
})();

function cueVibrate(type) {
  if(!state.vibrateEnabled || !_vibeSupported) return;
  const patterns = {
    dot: 40,
    single: 60,
    four: [100, 60, 100],
    six: [120, 60, 120, 60, 200],
    wicket: [300, 100, 300, 100, 300],
    wide: [80, 60, 80],
    noball: [80, 60, 80, 60, 80],
    over: [150, 80, 150]
  };
  const p = patterns[type]; if(p) navigator.vibrate(p);
}

function toggleVibrate() {

  const os = state.onStrike||{name:'-',runs:0,balls:0};
  const ns = state.nonStriker||{name:'-',runs:0,balls:0};
  const bw = state.bowler||{name:'-',balls:0,runs:0,wickets:0};
  const totalOvers = state.match?.overs||5;
  const crr = calcRR(s.runs, s.balls);
  let line1 = (state.battingTeam||'') + '  ' + s.runs + '/' + s.wickets + '  (' + formatOvers(s.balls) + '/' + totalOvers + ' ov)   CRR:' + crr;
  if(state.target) { const bl = totalOvers*6-s.balls; line1 += '  Need ' + Math.max(0,state.target-s.runs) + ' off ' + bl + 'b'; }
  const line2 = os.name + '* ' + os.runs + '(' + os.balls + ')  ' + ns.name + ' ' + ns.runs + '(' + ns.balls + ')   ' + bw.name + ' ' + formatOvers(bw.balls) + '-' + bw.runs + '-' + bw.wickets;
  return { line1, line2 };
}

function drawScoreBarOnCanvas(ctx, w, h) {
  const s   = state.score || {runs:0,wickets:0,balls:0};
  const os  = state.onStrike  || {name:'-',runs:0,balls:0};
  const ns  = state.nonStriker|| {name:'-',runs:0,balls:0};
  const bw  = state.bowler    || {name:'-',balls:0,runs:0,wickets:0};
  const totalOvers = state.match?.overs || 5;
  const crr  = calcRR(s.runs, s.balls);
  const team = (state.battingTeam||'TEAM').substring(0,12).toUpperCase();

  const BAR_H = Math.max(48, Math.round(h * 0.075));
  const BAT_H = Math.max(38, Math.round(h * 0.062));
  const yBat  = h - BAR_H - BAT_H;
  const yBar  = h - BAR_H;

  const FS_SCORE = Math.max(18, Math.round(h * 0.032));
  const FS_TEAM  = Math.max(11, Math.round(h * 0.018));
  const FS_OVR   = Math.max(10, Math.round(h * 0.015));
  const FS_RR    = Math.max(11, Math.round(h * 0.018));
  const FS_NAME  = Math.max(10, Math.round(h * 0.015));
  const FS_BNUM  = Math.max(12, Math.round(h * 0.020));

  ctx.save();

  // fade above overlay
  const fadeGrad = ctx.createLinearGradient(0, yBat - 28, 0, yBat);
  fadeGrad.addColorStop(0, 'rgba(0,0,0,0)');
  fadeGrad.addColorStop(1, 'rgba(0,0,20,0.55)');
  ctx.fillStyle = fadeGrad;
  ctx.fillRect(0, yBat - 28, w, 28);

  // ── PLAYER CARDS ROW ──────────────────────────────────
  ctx.fillStyle = 'rgba(5,0,25,0.84)';
  ctx.fillRect(0, yBat, w, BAT_H);
  ctx.fillStyle = '#16c55e';
  ctx.fillRect(0, yBat, w, Math.max(2, Math.round(h * 0.002)));

  const batMidY = yBat + BAT_H / 2;
  const avatarR = Math.max(13, Math.round(BAT_H * 0.37));
  const PAD = 12;

  function drawAvatar(cx, cy, name, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, avatarR, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + Math.round(avatarR * 0.78) + 'px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((name||'?')[0].toUpperCase(), cx, cy);
  }

  // Striker (left)
  const sxC = PAD + avatarR;
  drawAvatar(sxC, batMidY, os.name, '#7c3aed');
  ctx.beginPath();
  ctx.arc(sxC + avatarR - 3, batMidY - avatarR + 4, Math.max(3, Math.round(avatarR * 0.28)), 0, Math.PI * 2);
  ctx.fillStyle = '#facc15';
  ctx.fill();

  const sTextX = sxC + avatarR + 8;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + FS_NAME + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText((os.name||'-').substring(0,10), sTextX, batMidY - FS_NAME * 0.55);
  ctx.font = '800 ' + FS_BNUM + 'px -apple-system,sans-serif';
  ctx.fillStyle = '#facc15';
  const sRuns = os.runs + '*';
  ctx.fillText(sRuns, sTextX, batMidY + FS_BNUM * 0.55);
  const sRunsW = ctx.measureText(sRuns + ' ').width;
  ctx.font = '500 ' + FS_NAME + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('(' + os.balls + ')', sTextX + sRunsW, batMidY + FS_BNUM * 0.55);

  // Non-striker (right)
  const nxC = w - PAD - avatarR;
  drawAvatar(nxC, batMidY, ns.name, '#1d4ed8');

  const nTextX = nxC - avatarR - 8;
  ctx.textAlign = 'right';
  ctx.font = '600 ' + FS_NAME + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText((ns.name||'-').substring(0,10), nTextX, batMidY - FS_NAME * 0.55);
  ctx.font = '800 ' + FS_BNUM + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(String(ns.runs), nTextX, batMidY + FS_BNUM * 0.55);
  const nsRunsW = ctx.measureText(ns.runs + ' ').width;
  ctx.font = '500 ' + FS_NAME + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'right';
  ctx.fillText('(' + ns.balls + ')', nTextX - nsRunsW, batMidY + FS_BNUM * 0.55);

  // Bowler (center, small)
  ctx.textAlign = 'center';
  ctx.font = '500 ' + Math.max(9, FS_NAME - 1) + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('⚾ ' + (bw.name||'-').substring(0,10) + '  ' + formatOvers(bw.balls) + '-' + bw.runs + '-' + bw.wickets + 'W', w / 2, yBat + BAT_H - Math.max(7, FS_NAME * 0.65));

  // ── MAIN SCORE BAR ────────────────────────────────────
  ctx.fillStyle = 'rgba(8,3,26,0.97)';
  ctx.fillRect(0, yBar, w, BAR_H);

  const PILL_W = Math.min(Math.round(w * 0.30), 230);
  ctx.fillStyle = '#7c3aed';
  ctx.fillRect(0, yBar, PILL_W, BAR_H);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = '800 ' + FS_TEAM + 'px -apple-system,sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(team.substring(0,11), 8, yBar + BAR_H / 2);

  const scoreStr = s.runs + '-' + s.wickets;
  ctx.font = '900 ' + FS_SCORE + 'px -apple-system,sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(scoreStr, PILL_W + 12, yBar + BAR_H / 2);

  const scoreW = ctx.measureText(scoreStr).width;
  ctx.font = '500 ' + FS_OVR + 'px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(formatOvers(s.balls) + '/' + totalOvers + ' ov', PILL_W + 16 + scoreW, yBar + BAR_H / 2);

  let rrText = 'RR ' + crr;
  if(state.target) {
    const bl = totalOvers * 6 - s.balls;
    rrText = 'Need ' + Math.max(0, state.target - s.runs) + ' off ' + bl + 'b';
  }
  ctx.font = '700 ' + FS_RR + 'px -apple-system,sans-serif';
  ctx.fillStyle = '#facc15';
  ctx.textAlign = 'right';
  ctx.fillText(rrText, w - 10, yBar + BAR_H / 2);

  ctx.restore();
}

async function startCamera() {
  if(_cameraStream) return;
  try {
    _cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30, max: 60 }
      },
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    const vid = document.getElementById('camera-preview');
    if(vid) vid.srcObject = _cameraStream;
    updateScoreStrip();
    startRecording();
  } catch(e) {
    alert('Camera access denied. Check permissions.');
    state.recordingEnabled = false;
    localStorage.setItem('cricket_recording', 'false');
  }
}

function _getSupportedMimeType() {
  const types = [
    'video/mp4;codecs=avc1.640028,mp4a.40.2', // H.264 High Profile Level 4.0 — best quality
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2', // H.264 Baseline — iOS fallback
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for(const t of types) {
    if(typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function startRecording() {
  if(!_cameraStream || _mediaRecorder || window._startRecordingInFlight) return;
  window._startRecordingInFlight = true;
  if(typeof MediaRecorder === 'undefined') { showToast('Recording not supported on this browser'); return; }
  if(window._cancelCanvasDraw) { window._cancelCanvasDraw(); window._cancelCanvasDraw = null; }
  _canvasInterval = null;
  const vid = document.getElementById('camera-preview');
  const canvas = document.getElementById('camera-canvas');
  if(!vid || !canvas) return;

  const vTrack = _cameraStream.getVideoTracks()[0];
  const settings = vTrack ? vTrack.getSettings() : {};
  const srcW = settings.width || 1080;
  const srcH = settings.height || 1920;
  const MAX_REC_W = 720, MAX_REC_H = 1280;
  const scale = Math.min(1, MAX_REC_W / srcW, MAX_REC_H / srcH);
  canvas.width = Math.round(srcW * scale);
  canvas.height = Math.round(srcH * scale);
  const ctx = canvas.getContext('2d', { alpha: false });

  let _rafId = null;
  let _lastDraw = 0;
  const FPS = Math.min(settings.frameRate || 30, 30);
  const frameInterval = 1000 / FPS;

  // Fallback interval: keeps score bar updated even when document is hidden
  // (rAF is throttled/paused by browser when tab is backgrounded)
  let _scoreInterval = setInterval(() => {
    if(document.hidden && vid.readyState >= 2) {
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      drawScoreBarOnCanvas(ctx, canvas.width, canvas.height);
    }
  }, 1000);

  function drawFrame(ts) {
    _rafId = requestAnimationFrame(drawFrame);
    if(document.hidden) return; // rAF still runs for audio; skip heavy work
    if(ts - _lastDraw < frameInterval) return;
    _lastDraw = ts;
    if(vid.readyState >= 2) {
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      drawScoreBarOnCanvas(ctx, canvas.width, canvas.height);
      _aiCheckMotion(canvas, ts);
    }
  }
  _rafId = requestAnimationFrame(drawFrame);
  _canvasInterval = _rafId;
  window._cancelCanvasDraw = () => {
    if(_rafId) cancelAnimationFrame(_rafId); _rafId = null;
    clearInterval(_scoreInterval); _scoreInterval = null;
  };

  const canvasStream = canvas.captureStream(FPS);
  window._canvasStream = canvasStream; // exposed for live streaming
  const audioTracks = _cameraStream.getAudioTracks();
  if(audioTracks.length > 0) canvasStream.addTrack(audioTracks[0]);

  _recordedChunks = [];
  const mimeType = _getSupportedMimeType();
  try {
    const opts = mimeType ? { mimeType, videoBitsPerSecond: 800000 } : { videoBitsPerSecond: 800000 };
    _mediaRecorder = new MediaRecorder(canvasStream, opts);
  } catch(e) {
    try { _mediaRecorder = new MediaRecorder(canvasStream); } catch(e2) { showToast('Recording not supported on this device'); return; }
  }
  _mediaRecorder.ondataavailable = e => { if(e.data.size > 0) _recordedChunks.push(e.data); };
  _mediaRecorder.start(1000);
  window._startRecordingInFlight = false;
}

function saveClip(isHighlight, highlightMeta) {
  if(!_mediaRecorder) return;
  if(window._cancelCanvasDraw) window._cancelCanvasDraw();

  const recorder = _mediaRecorder;
  _mediaRecorder = null; // null immediately so next ball's saveClip doesn't skip
  const _isHL = !!isHighlight;
  const _hlMeta = highlightMeta || {};

  recorder.onstop = () => {
    // iOS fires ondataavailable here (not on timeslice), so _recordedChunks has data now
    try {
      const mimeType = recorder.mimeType || 'video/mp4';
      const blob = new Blob(_recordedChunks, { type: mimeType });
      _recordedChunks = [];
      if(blob.size > 0) {
        _clipCount++;
        const url = URL.createObjectURL(blob);
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        if(_recentClips.length >= 6) { const old = _recentClips.shift(); URL.revokeObjectURL(old.url); }
        const s = state.score || {runs:0,wickets:0,balls:0};
        _recentClips.push({
          url, blob,
          label: 'Ball ' + _clipCount + ' \u2022 ' + s.runs + '/' + s.wickets,
          ballNum: _clipCount, mimeType, ext
        });
        updateRecentClipsUI();
        if(_isHL && state.matchId) _uploadHighlightClip(blob, ext, _hlMeta, state.matchId);
      }
    } catch(e) {
      _recordedChunks = [];
    }
    if(state.recordingEnabled && _cameraStream) startRecording();
  };
  if(recorder.state === 'recording') recorder.stop();
  else { _recordedChunks = []; if(state.recordingEnabled && _cameraStream) startRecording(); }
}

async function _uploadHighlightClip(blob, ext, meta, matchId) {
  try {
    if(typeof _fbStorage === 'undefined' || !_fbStorage) {
      showToast('\u26a0\ufe0f Firebase Storage not ready');
      return;
    }
    // Ensure we have an auth token (anonymous sign-in might still be in flight)
    if(!firebase.auth().currentUser) {
      try {
        await new Promise((res, rej) => {
          const unsub = firebase.auth().onAuthStateChanged(u => { unsub(); u ? res() : rej(new Error('no auth')); }, rej);
          setTimeout(() => rej(new Error('auth timeout')), 5000);
        });
      } catch(authErr) {
        showToast('\u26a0\ufe0f Firebase auth failed \u2014 highlights won\'t save');
        return;
      }
    }
    const ts = Date.now();
    const type = meta.type || 'highlight';
    const inn = state.innings || 1;
    const path = `highlights/${matchId}/${ts}_inn${inn}_${type}.${ext}`;
    const ref = _fbStorage.ref(path);
    const snap = await ref.put(blob);
    const url = await snap.ref.getDownloadURL();
    const s = state.score || {runs:0,wickets:0,balls:0};
    const overLabel = Math.floor(s.balls/6)+'.'+s.balls%6;
    showToast('\ud83c\udfac Highlight clip saved!');
    await apiCall('save_highlight', {
      match_id: matchId,
      url, type, ext,
      runs: meta.runs || 0,
      batsman: meta.batsman || '',
      bowler: meta.bowler || '',
      over_label: overLabel,
      innings: state.innings || 1,
      timestamp: ts
    });
  } catch(e) {
    showToast('\u26a0\ufe0f Highlight upload failed: ' + e.message);
  }
}

function _saveToGallery(blob, fileName, mimeType) {
  try {
    if(navigator.share && navigator.canShare) {
      const file = new File([blob], fileName, { type: mimeType });
      if(navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: fileName }).then(() => {
          showToast('Clip shared!');
        }).catch((e) => {
          if(e.name !== 'AbortError') _triggerDownload(URL.createObjectURL(blob), fileName);
        });
        return;
      }
    }
    _triggerDownload(URL.createObjectURL(blob), fileName);
    showToast('Clip saved!');
  } catch(e) {
    showToast('Could not save clip');
  }
}

function _triggerDownload(url, fileName) {
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function updateRecentClipsUI() {
  const el = document.getElementById('recent-clips');
  if(!el) return;
  if(_recentClips.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  // Show newest clip on the left by iterating in reverse
  el.innerHTML = _recentClips.slice().reverse().map((c, ri) => {
    const i = _recentClips.length - 1 - ri; // real index for playClip
    return `<button onclick="playClip(${i})" class="rounded-xl overflow-hidden relative active:scale-95 shrink-0" style="width:100px;height:80px;background:#000;touch-action:manipulation">
      <video src="${c.url}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;pointer-events:none"></video>
      <div class="absolute inset-0 flex items-center justify-center" style="background:rgba(0,0,0,0.25)">
        <span class="text-white text-xl">\u25B6</span>
      </div>
      <div class="absolute top-1 right-1 px-1.5 py-0.5 rounded-full text-white" style="font-size:9px;font-weight:700;background:rgba(0,0,0,0.6)">${c.ballNum}</div>
      <div class="absolute bottom-0 left-0 right-0 px-1.5 py-1 text-white" style="font-size:10px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,0.7))">${c.label}</div>
    </button>`;
  }).join('');
}

let _clipZoomScale = 1;
let _clipZoomStartDist = 0;
let _clipZoomStartScale = 1;

function playClip(index) {
  const clip = _recentClips[index];
  if(!clip) return;
  _currentClipUrl = clip;
  _currentClipIndex = index;
  const overlay = document.getElementById('clip-player-overlay');
  const vid = document.getElementById('clip-player-video');
  const label = document.getElementById('clip-player-label');
  const counter = document.getElementById('clip-player-counter');
  vid.src = clip.url;
  vid.playbackRate = 1;
  _clipZoomScale = 1;
  vid.style.transform = 'scale(1)';
  setPlaybackSpeed(1);
  label.textContent = clip.label + ' ✏️';
  if(counter) counter.textContent = (index + 1) + '/' + _recentClips.length;
  overlay.style.display = 'block';
  const seek = document.getElementById('pb-seek');
  const cur = document.getElementById('pb-time-current');
  const tot = document.getElementById('pb-time-total');
  if(seek) seek.value = 0;
  if(cur) cur.textContent = '0:00';
  if(tot) tot.textContent = '0:00';
  _playbackLinesOn = true;
  const plEl = document.getElementById('playback-lines');
  const plBtn = document.getElementById('pb-lines-btn');
  if(plEl) {
    plEl.style.display = 'block';
    _applyPlaybackLines();
  }
  if(plBtn) plBtn.style.background = 'rgba(250,204,21,0.7)';
  vid.play();
}

function setPlaybackSpeed(speed) {
  const vid = document.getElementById('clip-player-video');
  if(vid) vid.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.style.background = 'rgba(255,255,255,0.15)';
  });
  const activeBtn = document.getElementById('speed-' + String(speed).replace('.',''));
  if(activeBtn) activeBtn.style.background = 'rgba(255,255,255,0.35)';
}

function renameCurrentClip() {
  if(_currentClipIndex < 0 || !_recentClips[_currentClipIndex]) return;
  const clip = _recentClips[_currentClipIndex];
  const newLabel = prompt('Rename clip:', clip.label);
  if(newLabel && newLabel.trim()) {
    clip.label = newLabel.trim();
    const el = document.getElementById('clip-player-label');
    if(el) el.textContent = clip.label + ' ✏️';
    updateRecentClipsUI();
  }
}

function togglePlayPause() {
  const vid = document.getElementById('clip-player-video');
  if(!vid) return;
  const icon = document.getElementById('pb-play-icon');
  const indicator = document.getElementById('pb-play-indicator');
  const btn = document.getElementById('pb-playpause-btn');
  if(vid.paused) {
    vid.play();
    if(icon) icon.textContent = '\u25B6';
    if(btn) btn.textContent = '\u23F8';
  } else {
    vid.pause();
    if(icon) icon.textContent = '\u23F8';
    if(btn) btn.textContent = '\u25B6';
  }
  if(indicator) {
    indicator.style.opacity = '1';
    setTimeout(() => { indicator.style.opacity = '0'; }, 400);
  }
}

function seekClip(val) {
  const vid = document.getElementById('clip-player-video');
  if(!vid || !vid.duration || !isFinite(vid.duration)) return;
  const pct = parseFloat(val) / 1000;
  vid.currentTime = pct * vid.duration;
}

function formatClipTime(sec) {
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

(function() {
  const vid = document.getElementById('clip-player-video');
  if(!vid) return;
  vid.addEventListener('timeupdate', function() {
    const seek = document.getElementById('pb-seek');
    const cur = document.getElementById('pb-time-current');
    if(seek && vid.duration && isFinite(vid.duration)) {
      seek.value = (vid.currentTime / vid.duration) * 1000;
    }
    if(cur) cur.textContent = formatClipTime(vid.currentTime);
  });
  vid.addEventListener('loadedmetadata', function() {
    const tot = document.getElementById('pb-time-total');
    if(tot) tot.textContent = formatClipTime(vid.duration);
  });
  vid.addEventListener('play', function() {
    const btn = document.getElementById('pb-playpause-btn');
    if(btn) btn.textContent = '\u23F8';
  });
  vid.addEventListener('pause', function() {
    const btn = document.getElementById('pb-playpause-btn');
    if(btn) btn.textContent = '\u25B6';
  });
  vid.addEventListener('ended', function() {
    const btn = document.getElementById('pb-playpause-btn');
    if(btn) btn.textContent = '\u21BB';
  });
})();

(function() {
  const wrap = document.getElementById('clip-video-wrap');
  if(!wrap) return;
  wrap.addEventListener('touchstart', function(e) {
    if(e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      _clipZoomStartDist = Math.sqrt(dx*dx + dy*dy);
      _clipZoomStartScale = _clipZoomScale;
    }
  }, {passive:false});
  wrap.addEventListener('touchmove', function(e) {
    if(e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      _clipZoomScale = Math.min(5, Math.max(1, _clipZoomStartScale * (dist / _clipZoomStartDist)));
      const vid = document.getElementById('clip-player-video');
      if(vid) vid.style.transform = 'scale(' + _clipZoomScale + ')';
    }
  }, {passive:false});
  wrap.addEventListener('touchend', function(e) {
    if(e.touches.length < 2 && _clipZoomScale < 1.1) {
      _clipZoomScale = 1;
      const vid = document.getElementById('clip-player-video');
      if(vid) vid.style.transform = 'scale(1)';
    }
  });
  let lastTap = 0;
  wrap.addEventListener('touchend', function(e) {
    if(e.touches.length > 0) return;
    const now = Date.now();
    if(now - lastTap < 300) {
      _clipZoomScale = _clipZoomScale > 1.1 ? 1 : 2.5;
      const vid = document.getElementById('clip-player-video');
      if(vid) vid.style.transform = 'scale(' + _clipZoomScale + ')';

function triggerThirdUmpire() {
  if(!state.recordingEnabled || !_mediaRecorder) {
    showToast('Recording not active');
    return;
  }
  _thirdUmpireActive = true;
  // Broadcast "under review" to live view
  apiCall('set_review', {match_id: state.matchId, innings: state.innings, active: true}).catch(()=>{});
  // Save current clip — saveClip will call startRecording again after stop,
  // but we intercept by temporarily flagging; instead we call saveClipForReview
  const recorder = _mediaRecorder;
  _mediaRecorder = null;
  if(window._cancelCanvasDraw) { window._cancelCanvasDraw(); window._cancelCanvasDraw = null; }
  recorder.onstop = () => {
    try {
      const mimeType = recorder.mimeType || 'video/mp4';
      const blob = new Blob(_recordedChunks, { type: mimeType });
      _recordedChunks = [];
      _clipCount++;
      const url = URL.createObjectURL(blob);
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      if(_recentClips.length >= 6) { const old = _recentClips.shift(); URL.revokeObjectURL(old.url); }
      const s = state.score || {runs:0,wickets:0,balls:0};
      const clip = { url, blob, label: '3U Review • ' + s.runs + '/' + s.wickets, ballNum: _clipCount, mimeType, ext };
      _recentClips.push(clip);
      updateRecentClipsUI();

      const overlay = document.getElementById('clip-player-overlay');
      const vid = document.getElementById('clip-player-video');
      const label = document.getElementById('clip-player-label');

      vid.src = clip.url;

      label.textContent = clip.label + ' ✏️';
      if(counter) counter.textContent = _recentClips.length + '/' + _recentClips.length;
      overlay.style.display = 'block';
      const panel = document.getElementById('third-umpire-panel');
      if(panel) panel.style.display = 'block';
      vid.play();

      if(state.recordingEnabled && _cameraStream) startRecording();

      showToast('3rd Umpire: clip error');

// ===== LIVE STREAMING =====
let _liveActive = false;
let _liveSeq = 0;
let _liveUploadsPending = 0;

async function startLiveStream() {
  if(!window._canvasStream) { showToast('Turn on camera first (📷)'); return; }
  if(!state.matchId) { showToast('No active match'); return; }
  if(_liveActive) { showToast('Already live!'); return; }
  _liveActive = true;
  _liveSeq = 0;
  const _liveExt = _getSupportedMimeType().includes('mp4') ? 'mp4' : 'webm';
  window._liveExt = _liveExt;
  try {
    await apiCall('start_live', {match_id: state.matchId, ext: _liveExt});
  } catch(e) {}
  showToast('\u{1F4E1} LIVE! Viewers can click Watch Live on the scorecard');
  drawScoring();
  // Keep screen on during live stream (prevents canvas freeze + dropped segments)
  if(navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(lock => { window._wakeLock = lock; }).catch(()=>{});
  }
  _liveSegmentLoop();
}

async function _liveSegmentLoop() {
  while(_liveActive && window._canvasStream) {
    const blob = await _recordLiveSegment(window._canvasStream, 2000);
    if(!blob || !_liveActive) break;
    _liveSeq++;
    _liveUploadSegBg(blob, _liveSeq, window._liveExt || 'mp4');
  }
}

async function _liveUploadSegBg(blob, seq, ext) {
  _liveUploadsPending++;
  try {
    const mimeType = blob.type || 'video/' + ext;
    const path = `live/${state.matchId}/seg_${seq}.${ext}`;
    await _fbStorage.ref(path).put(blob, {contentType: mimeType});
    apiCall('live_segment', {match_id: state.matchId, seq, ext});
    if(seq === 1) showToast('\u{1F4E1} Live segment 1 sent \u2713');
  } catch(e) { console.warn('Live upload seg', seq, e.message); }
  finally { _liveUploadsPending = Math.max(0, _liveUploadsPending - 1); }
}

function _recordLiveSegment(stream, duration) {
  return new Promise(resolve => {
    const mimeType = _getSupportedMimeType();
    let mr;
    const chunks = [];
    try {
      mr = new MediaRecorder(stream, mimeType ? {mimeType, videoBitsPerSecond: 1500000} : {videoBitsPerSecond: 1500000});
    } catch(e) {
      try { mr = new MediaRecorder(stream); } catch(e2) { resolve(null); return; }
    }
    mr.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => resolve(chunks.length ? new Blob(chunks, {type: mimeType || 'video/webm'}) : null);
    mr.onerror = () => resolve(null);
    mr.start();
    setTimeout(() => { try { if(mr.state === 'recording') mr.stop(); } catch(e) { resolve(null); } }, duration);
  });
}

async function stopLiveStream() {
  _liveActive = false;
  window._canvasStream = null;
  if(window._wakeLock) { try { window._wakeLock.release(); } catch(e){} window._wakeLock = null; }
  // Drain: wait for in-flight segment uploads so all seq numbers reach the server
  let _drain = 0;
  while(_liveUploadsPending > 0 && _drain < 12) { await new Promise(r => setTimeout(r, 500)); _drain++; }
  try { await apiCall('stop_live', {match_id: state.matchId}); } catch(e) {}
  showToast('Live stream ended');
  drawScoring();
}

// ===== LIVE VIEWER =====
let _watchActive = false;
let _watchStreamEnded = false;
let _watchSeenSeq = 0;
let _watchQueue = [];
let _watchPlaying = false;
let _watchPollTimer = null;
let _watchMatchId = null;
let _liveBufActive = 'a'; // double-buffer: which video is currently showing
let _livePreloadedUrl = null; // URL eagerly loaded into inactive buffer
let _watchPaused = false;
let _watchHistory = []; // played segment URLs — for rewind (max 8 = ~32s)
let _watchHistoryPos = -1; // -1=live edge, 0..n=replaying from history

function openLiveWatch(matchId) {
  document.getElementById('live-watch-overlay')?.remove();
  _watchActive = true;
  _watchStreamEnded = false;
  _watchSeenSeq = 0;
  _watchQueue = [];
  _watchPlaying = false;
  _watchMatchId = matchId;
  _watchPaused = false;
  _watchHistory = [];
  _watchHistoryPos = -1;
  _livePreloadedUrl = null;
  _watchDrainPolled = false;
  const el = document.createElement('div');
  el.id = 'live-watch-overlay';
  el.style.cssText = 'position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center';
  el.innerHTML = `
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;gap:6px">
      <span id="live-status-badge" style="color:#ff3333;font-weight:900;font-size:13px;letter-spacing:1px;min-width:52px">\u25CF LIVE</span>
      <div style="display:flex;align-items:center;gap:5px;flex:1;justify-content:flex-end">
        <span id="live-delay-label" style="color:#aaa;font-size:11px;margin-right:2px">Connecting...</span>
        <button onclick="_liveWatchRewind()" title="Rewind 10s" style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:11px;padding:5px 9px;border-radius:14px;touch-action:manipulation;font-weight:700;cursor:pointer">\u23EA 10s</button>
        <button onclick="_liveWatchTogglePause()" id="live-ctrl-pause" style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:12px;padding:5px 10px;border-radius:14px;touch-action:manipulation;font-weight:700;cursor:pointer">\u23F8</button>
        <button onclick="_liveWatchGoLive()" id="live-ctrl-golive" style="background:#dc2626;border:none;color:#fff;font-size:11px;padding:5px 9px;border-radius:14px;touch-action:manipulation;font-weight:800;cursor:pointer;display:none">\uD83D\uDCE1 LIVE</button>
        <button onclick="closeLiveWatch()" style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:18px;width:30px;height:30px;border-radius:50%;touch-action:manipulation;cursor:pointer">\u00D7</button>
      </div>
    </div>
    <div style="position:relative;width:100%;flex:1;background:#000;display:flex;align-items:center;justify-content:center">
      <video id="live-vid-a" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000"></video>
      <video id="live-vid-b" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0"></video>
      <div id="live-tap-play" onclick="const v=document.getElementById('live-vid-'+_liveBufActive);if(v){v.muted=false;v.play();}this.style.display='none'" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.5);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;z-index:2">▶ Tap to Play</div>
      <div id="live-buf-msg" style="position:absolute;color:#aaa;font-size:14px;text-align:center;pointer-events:none;z-index:1">📡 Loading stream...</div>
    </div>
    <div id="live-score-bar" style="width:100%;background:linear-gradient(0deg,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.6) 100%);padding:8px 12px 10px;pointer-events:none"><div id="live-score-l1" style="color:#fff;font-size:14px;font-weight:800;letter-spacing:0.3px"> </div><div id="live-score-l2" style="color:rgba(255,255,255,0.7);font-size:11px;margin-top:1px"> </div></div>
    <div id="live-end-msg" style="display:none;color:#aaa;font-size:14px;padding:20px;text-align:center">Stream ended — scorer has stopped the live feed</div>`;
  document.body.appendChild(el);
  _liveBufActive = 'a'; // reset buffer state
  _liveWatchPoll();
}

async function _liveWatchPoll() {
  if(!_watchActive) return;
  try {
    const data = await apiCall('get_live', {match_id: _watchMatchId});
    if(!data.active) {
      const lbl = document.getElementById('live-delay-label');
      // Stream never started — keep waiting
      if(!data.started) {
        if(lbl) lbl.textContent = 'Waiting for scorer to go live...';
        _watchPollTimer = setTimeout(_liveWatchPoll, 4000);
        return;
      }
      // Stream ended — fetch any segments not yet queued, then re-poll once to catch late uploads
      _watchStreamEnded = true;
      const finalSeq = data.seq || 0;
      const drainExt = data.ext || 'mp4';
      for(let di = _watchSeenSeq + 1; di <= finalSeq; di++) {
        const dPath = `live/${_watchMatchId}/seg_${di}.${drainExt}`;
        _fbStorage.ref(dPath).getDownloadURL().then(dUrl => {
          if(dUrl && !_watchQueue.includes(dUrl)) { _watchQueue.push(dUrl); if(!_watchPlaying) _liveWatchPlayNext(); }
        }).catch(() => {});
      }
      if(finalSeq > _watchSeenSeq) _watchSeenSeq = finalSeq;
      // One final re-poll after 4s to catch segments uploaded after stop_live fired
      if(!_watchDrainPolled) {
        _watchDrainPolled = true;
        if(lbl) lbl.textContent = 'Stream ended — catching last clips…';
        _watchPollTimer = setTimeout(_liveWatchPoll, 4000);
        return;
      }
      if(lbl) lbl.textContent = _watchQueue.length || _watchPlaying ? 'Stream ended · playing last clips…' : 'Stream ended';
      if(!_watchQueue.length && !_watchPlaying) {
        _watchActive = false;
        const endMsg = document.getElementById('live-end-msg');
        if(endMsg) endMsg.style.display = 'block';
      }
      return;
    }
    const serverSeq = data.seq || 0;
    const ext = data.ext || 'mp4';
    // Join 1 segment behind (≈5s delay) instead of 2 to reduce cutoff at the end
    if(_watchSeenSeq === 0 && serverSeq > 1) _watchSeenSeq = serverSeq - 1;
    for(let i = _watchSeenSeq + 1; i <= serverSeq; i++) {
      const path = `live/${_watchMatchId}/seg_${i}.${ext}`;
      _fbStorage.ref(path).getDownloadURL().then(url => {
        if(url && !_watchQueue.includes(url)) {
          _watchQueue.push(url);
          if(!_watchPlaying) _liveWatchPlayNext();
          else _liveWatchEagerPreload(url);
        }
      }).catch(() => {});
      _watchSeenSeq = i;
    }
    const lbl = document.getElementById('live-delay-label');
    if(lbl) lbl.textContent = serverSeq > 0 ? `~${Math.max(2, _watchQueue.length * 2)}s delay` : 'Waiting for stream...';
    const bufMsg = document.getElementById('live-buf-msg');
    if(bufMsg) bufMsg.style.display = _watchQueue.length || _watchPlaying ? 'none' : 'block';
    // Speculative: try to fetch next segment now (may already be uploaded)
    if(serverSeq > 0 && !_watchStreamEnded) {
      const nxt = serverSeq + 1;
      const nxtPath = `live/${_watchMatchId}/seg_${nxt}.${ext}`;
      _fbStorage.ref(nxtPath).getDownloadURL().then(url => {
        if(url && !_watchQueue.includes(url)) {
          _watchSeenSeq = Math.max(_watchSeenSeq, nxt);
          _watchQueue.push(url);
          if(!_watchPlaying) _liveWatchPlayNext();
          else _liveWatchEagerPreload(url);
        }
      }).catch(() => {}); // not uploaded yet — silent fail
    }
  } catch(e) {}
  // Poll faster when queue is empty (no segment queued = risk of stall)
  const _nextPollMs = (_watchQueue.length === 0 && !_watchStreamEnded) ? 800 : 1500;
  _watchPollTimer = setTimeout(_liveWatchPoll, _nextPollMs);
}

function _liveWatchPlayNext() {
  _watchPlaying = false;
  if(!_watchActive || _watchPaused) return;

  let url = null;

  if(_watchHistoryPos >= 0) {
    // Replay mode — play from saved history
    url = _watchHistory[_watchHistoryPos];
    _watchHistoryPos++;
    if(_watchHistoryPos >= _watchHistory.length) _watchHistoryPos = -1; // done, back to live
  }

  if(!url) {
    // Live mode
    if(!_watchQueue.length) {
      if(_watchStreamEnded) {
        _watchActive = false;
        const endMsg = document.getElementById('live-end-msg');
        if(endMsg) endMsg.style.display = 'block';
        const lbl = document.getElementById('live-delay-label');
        if(lbl) lbl.textContent = 'Stream ended';
      }
      return;
    }
    // Skip-ahead: if 4+ segments queued viewer is way behind — jump to latest
    if(_watchQueue.length > 4) _watchQueue.splice(0, _watchQueue.length - 2);
    url = _watchQueue.shift();
    // Save to history (max 8 segments ≈ 32s of rewind)
    _watchHistory.push(url);
    if(_watchHistory.length > 8) _watchHistory.shift();
  }

  _watchPlaying = true;
  _liveWatchUpdateUI();

  // Double-buffer: load into INACTIVE video, then swap when ready
  const nextBuf = _liveBufActive === 'a' ? 'b' : 'a';
  const vidHide = document.getElementById('live-vid-' + _liveBufActive);
  const vidShow = document.getElementById('live-vid-' + nextBuf);
  if(!vidShow) { _watchPlaying = false; return; }

  const bufMsg = document.getElementById('live-buf-msg');

  vidShow.onended = () => { if(!_watchPaused) _liveWatchPlayNext(); };
  const _doLiveSwap = () => {
    vidShow.onloadeddata = null;
    if(vidHide) { vidHide.style.opacity = '0'; vidHide.pause(); }
    vidShow.style.opacity = '1';
    vidShow.play().catch(() => {
      const tap = document.getElementById('live-tap-play');
      if(tap) tap.style.display = 'flex';
    });
    if(bufMsg) bufMsg.style.display = 'none';
    _liveBufActive = nextBuf;
    _livePreloadedUrl = null;
    if(_watchHistoryPos === -1 && _watchQueue.length > 0 && vidHide) {
      const nextUrl = _watchQueue[0];
      if(vidHide.src !== nextUrl) { vidHide.src = nextUrl; vidHide.load(); _livePreloadedUrl = nextUrl; }
    }
  };
  vidShow.onloadeddata = _doLiveSwap;
  if(vidShow.src !== url) { vidShow.src = url; vidShow.load(); }
  else if(vidShow.readyState >= 2) { _doLiveSwap(); }
}

function _liveWatchEagerPreload(url) {
  if(!_watchActive || _watchHistoryPos !== -1 || _livePreloadedUrl === url) return;
  const preloadBuf = _liveBufActive === 'a' ? 'b' : 'a';
  const vid = document.getElementById('live-vid-' + preloadBuf);
  if(vid && vid.src !== url) {
    _livePreloadedUrl = url;
    vid.src = url;
    vid.load();
  }
}

function _liveWatchUpdateUI() {
  const pauseBtn = document.getElementById('live-ctrl-pause');
  const goliveBtn = document.getElementById('live-ctrl-golive');
  const badge = document.getElementById('live-status-badge');
  const lbl = document.getElementById('live-delay-label');

  if(pauseBtn) pauseBtn.textContent = _watchPaused ? '\u25B6' : '\u23F8';
  const atLive = _watchHistoryPos === -1 && !_watchPaused && _watchQueue.length <= 3;
  if(goliveBtn) goliveBtn.style.display = atLive ? 'none' : 'inline-block';
  if(badge) {
    if(_watchHistoryPos >= 0) { badge.textContent = '\u23EA REPLAY'; badge.style.color = '#facc15'; }
    else if(_watchPaused) { badge.textContent = '\u23F8 PAUSED'; badge.style.color = '#9ca3af'; }
    else { badge.textContent = '\u25CF LIVE'; badge.style.color = '#ff3333'; }
  }
  if(lbl && !_watchPaused && _watchHistoryPos === -1) {
    const segs = _watchQueue.length + (_watchPlaying ? 1 : 0);
    lbl.textContent = segs > 0 ? '~' + Math.max(4, segs * 4) + 's delay' : 'Live';
  }
}

function _liveWatchTogglePause() {
  if(!_watchActive) return;
  const activeVid = document.getElementById('live-vid-' + _liveBufActive);
  if(_watchPaused) {
    _watchPaused = false;
    if(activeVid && activeVid.paused) {
      if(activeVid.ended || activeVid.src === '') _liveWatchPlayNext();
      else activeVid.play().catch(() => {});
    }
  } else {
    _watchPaused = true;
    if(activeVid) activeVid.pause();
  }
  _liveWatchUpdateUI();
}

function _liveWatchRewind() {
  if(!_watchActive || !_watchHistory.length) return;
  const goBack = 2; // 2 segments ≈ 8-10s
  const targetPos = _watchHistoryPos >= 0
    ? Math.max(0, _watchHistoryPos - goBack - 1)
    : Math.max(0, _watchHistory.length - goBack);
  _watchHistoryPos = targetPos;
  _watchPaused = false;
  // Stop current & restart from history
  const activeVid = document.getElementById('live-vid-' + _liveBufActive);
  if(activeVid) { activeVid.onended = null; activeVid.pause(); }
  _watchPlaying = false;
  _liveWatchPlayNext();
}

function _liveWatchGoLive() {
  if(!_watchActive) return;
  _watchHistoryPos = -1;
  _watchPaused = false;
  if(_watchQueue.length > 2) _watchQueue.splice(0, _watchQueue.length - 2);
  if(!_watchPlaying) {
    const activeVid = document.getElementById('live-vid-' + _liveBufActive);
    if(activeVid) { activeVid.onended = null; activeVid.pause(); }
    _liveWatchPlayNext();
  }
  _liveWatchUpdateUI();
}


function closeLiveWatch() {
  _watchActive = false;
  _watchPlaying = false;
  _livePreloadedUrl = null;
  clearTimeout(_watchPollTimer);
  _watchPollTimer = null;
  ['live-vid-a','live-vid-b'].forEach(id => {
    const v = document.getElementById(id);
    if(v) { v.pause(); v.src = ''; }
  });
  document.getElementById('live-watch-overlay')?.remove();
}

let _umpireLinesVisible = false;
let _linePositions = (function() {
  const saved = JSON.parse(localStorage.getItem('cricket_umpire_lines') || '{}');
  const crease1 = (saved.crease1 && typeof saved.crease1 === 'object') ? saved.crease1 : {x:45, y:20};
  const crease2 = (saved.crease2 && typeof saved.crease2 === 'object') ? saved.crease2 : {x:55, y:90};
  return {
    height: saved.height != null ? saved.height : (saved.waist != null ? saved.waist : 55),
    crease1, crease2
  };
})();

function toggleUmpireLines() {

  const el = document.getElementById('umpire-lines');

  }

function _applyLinePositions() {
  const height = document.getElementById('line-height');
  if(height) height.style.top = _linePositions.height + '%';
  const c1 = _linePositions.crease1, c2 = _linePositions.crease2;
