state.aiScoreEnabled = localStorage.getItem('cricket_ai_score') === 'true';
let _aiState = 'idle'; // idle | motion | cooldown | analyzing | suggestion
let _aiPrevFrame = null;
let _aiMotionHistory = [];
let _aiFrameBuffer = []; // rolling buffer of {dataUrl, ts}
let _aiPeakMotion = 0;
let _aiPeakFrame = null;
let _aiDeliveryStart = 0;
let _aiSuggestion = null;
let _aiDailyCount = 0;
const AI_DAILY_LIMIT = 200;

(function() {
  const saved = localStorage.getItem('cricket_ai_daily');
  if(saved) {
    const d = JSON.parse(saved);
    if(d.date === new Date().toISOString().slice(0,10)) _aiDailyCount = d.count;
  }
})();

function _aiIncrementDaily() {
  _aiDailyCount++;
  localStorage.setItem('cricket_ai_daily', JSON.stringify({date: new Date().toISOString().slice(0,10), count: _aiDailyCount}));
}

function toggleAiScore() {
  state.aiScoreEnabled = !state.aiScoreEnabled;
  localStorage.setItem('cricket_ai_score', state.aiScoreEnabled);
  if(state.aiScoreEnabled && !localStorage.getItem('cricket_openai_key')) {
    const key = prompt('Enter your OpenAI API key for AI scoring:');
    if(!key) { state.aiScoreEnabled = false; localStorage.setItem('cricket_ai_score', 'false'); return; }
    localStorage.setItem('cricket_openai_key', key);
  }
  _aiState = 'idle';
  _aiMotionHistory = [];
  drawScoring();
}

let _aiLastCheck = 0;
function _aiCheckMotion(canvas, ts) {
  if(!state.aiScoreEnabled || !state.recordingEnabled) return;
  if(ts - _aiLastCheck < 200) return; // 5fps
  _aiLastCheck = ts;

  if(!window._aiMiniCanvas) {
    window._aiMiniCanvas = document.createElement('canvas');
    window._aiMiniCanvas.width = 80;
    window._aiMiniCanvas.height = 45;
    window._aiMiniCtx = window._aiMiniCanvas.getContext('2d', {willReadFrequently: true});
  }
  const mc = window._aiMiniCanvas, mctx = window._aiMiniCtx;
  mctx.drawImage(canvas, 0, 0, 80, 45);
  const frame = mctx.getImageData(0, 0, 80, 45);

  if(!window._aiMedCanvas) {
    window._aiMedCanvas = document.createElement('canvas');
    window._aiMedCanvas.width = 480;
    window._aiMedCanvas.height = 270;
    window._aiMedCtx = window._aiMedCanvas.getContext('2d');
  }
  window._aiMedCtx.drawImage(canvas, 0, 0, 480, 270);
  const dataUrl = window._aiMedCanvas.toDataURL('image/jpeg', 0.6);
  _aiFrameBuffer.push({dataUrl, ts});
  if(_aiFrameBuffer.length > 25) _aiFrameBuffer.shift(); // keep ~5s at 5fps

  if(!_aiPrevFrame) { _aiPrevFrame = frame; return; }

  let diff = 0, total = 0;
  const d = frame.data, p = _aiPrevFrame.data;
  for(let i = 0; i < d.length; i += 16) { // sample every 4th pixel
    const dr = Math.abs(d[i]-p[i]) + Math.abs(d[i+1]-p[i+1]) + Math.abs(d[i+2]-p[i+2]);
    if(dr > 60) diff++;
    total++;
  }
  const motionScore = diff / total;
  _aiPrevFrame = frame;

  _aiMotionHistory.push(motionScore);
  if(_aiMotionHistory.length > 20) _aiMotionHistory.shift();

  if(_aiState === 'idle') {
    if(motionScore > 0.12) {
      _aiState = 'motion';
      _aiDeliveryStart = ts;
      _aiPeakMotion = motionScore;
      _aiPeakFrame = dataUrl;
    }
  } else if(_aiState === 'motion') {
    if(motionScore > _aiPeakMotion) {
      _aiPeakMotion = motionScore;
      _aiPeakFrame = dataUrl;
    }
    if(motionScore < 0.08 && ts - _aiDeliveryStart > 800) {
      _aiState = 'cooldown';
      setTimeout(() => {
        if(_aiState !== 'cooldown') return;
        _captureAndAnalyze(ts);
      }, 3000);
    }
    if(ts - _aiDeliveryStart > 8000) {
      _aiState = 'idle';
      _aiPeakMotion = 0;
    }
  }
}

async function _captureAndAnalyze(deliveryTs) {
  if(_aiDailyCount >= AI_DAILY_LIMIT) {
    showToast('AI daily limit reached');
    _aiState = 'idle';
    return;
  }
  _aiState = 'analyzing';
  _updateAiBanner();

  const frames = [];
  const preFrame = _aiFrameBuffer.find(f => f.ts < _aiDeliveryStart - 300) || _aiFrameBuffer[0];
  if(preFrame) frames.push({type: 'pre_delivery', data: preFrame.dataUrl});
  if(_aiPeakFrame) frames.push({type: 'delivery', data: _aiPeakFrame});
  const postFrame = _aiFrameBuffer.find(f => f.ts > _aiDeliveryStart + 1000);
  if(postFrame) frames.push({type: 'post_delivery', data: postFrame.dataUrl});
  const latest = _aiFrameBuffer[_aiFrameBuffer.length - 1];
  if(latest) frames.push({type: 'umpire_signal', data: latest.dataUrl});

  if(frames.length < 2) { _aiState = 'idle'; return; }

  const s = state.score || {};
  const ctx = {
    batting_team: state.battingTeam || '',
    score: `${s.runs||0}/${s.wickets||0}`,
    overs: formatOvers(s.balls||0),
    on_strike: state.onStrike?.name || '',
    bowler: state.bowler?.name || ''
  };

  try {
    const result = await _callOpenAIVision(frames, ctx);
    _aiIncrementDaily();
    if(result && result.result) {
      _aiSuggestion = result;
      _aiState = 'suggestion';
      _updateAiBanner();
    } else {
      _aiState = 'idle';
      _updateAiBanner();
    }
  } catch(e) {
    showToast('AI error: ' + (e.message||'failed'));
    _aiState = 'idle';
    _updateAiBanner();
  }
}

async function _callOpenAIVision(frames, context) {
  const apiKey = localStorage.getItem('cricket_openai_key');
  if(!apiKey) throw new Error('No API key');

  const imageContent = frames.map(f => ({
    type: 'image_url',
    image_url: { url: f.data, detail: 'low' }
  }));

  const prompt = `You are a cricket scoring AI analyzing box cricket match footage.
You see ${frames.length} frames from a single ball delivery in order: ${frames.map(f=>f.type).join(', ')}.

Match context: ${context.batting_team} batting, score ${context.score} (${context.overs} ov), striker: ${context.on_strike}, bowler: ${context.bowler}

Analyze and determine what happened:
- Look for umpire signals: finger up = OUT, arms wide = WIDE, arm horizontal = NO BALL, hand waving to boundary = FOUR, both arms up = SIX
- If no umpire visible, infer from: batsmen running (count runs), ball reaching boundary, fielder catching, stumps hit
- Dot ball = batsmen not running after delivery

Respond ONLY with this JSON (no other text):
{"result":"runs|wide|noball|wicket|bye|legbye","runs":0,"extras_runs":0,"wicket_type":"","confidence":0.0,"reasoning":"brief"}

Rules: runs field = 0-6 for result "runs", extras_runs = 1 for wide/noball. For wickets, wicket_type = bowled|caught|runout|stumped|lbw.`;

  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{
        role: 'user',
        content: [{ type: 'text', text: prompt }, ...imageContent]
      }],
      max_tokens: 200,
      temperature: 0.1
    })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content || '';
  const match = text.match(/\{[\s\S]*\}/);
  if(!match) throw new Error('Bad AI response');
  return JSON.parse(match[0]);
}

    document.body.appendChild(banner);
  }

  if(_aiState === 'analyzing') {
    banner.style.transform = 'translateY(0)';

        <div class="animate-pulse text-xl">\u{1F916}</div>
        <div class="text-white text-sm font-bold">AI analyzing ball...</div>

    else if(s.result === 'wide') { label = 'WIDE'; color = '#a855f7'; }
    else if(s.result === 'noball') { label = 'NO BALL'; color = '#a855f7'; }
    else if(s.result === 'wicket') { label = 'WICKET (' + (s.wicket_type||'out') + ')'; color = '#ef4444'; }
    else if(s.result === 'bye') { label = s.extras_runs + ' BYE'; color = '#a855f7'; }
    else if(s.result === 'legbye') { label = s.extras_runs + ' LEG BYE'; color = '#a855f7'; }
    else { label = s.result; }

    banner.style.transform = 'translateY(0)';
    banner.innerHTML = `<div style="background:#1e293b;border-radius:14px 14px 0 0;padding:14px 18px;border-top:3px solid ${color}">
      <div class="flex items-center justify-between">
        <div>
          <div class="flex items-center gap-2">

            <span class="text-white font-black text-base" style="color:${color}">${label}</span>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6)">${conf}%</span>
          </div>
          <div class="text-xs mt-1" style="color:rgba(255,255,255,0.5)">${s.reasoning||''}</div>
        </div>

        <button onclick="_aiAccept()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white active:scale-95" style="background:#22c55e;touch-action:manipulation">\u2713 Accept</button>
        <button onclick="_aiEdit()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white active:scale-95" style="background:#3b82f6;touch-action:manipulation">\u270F Edit</button>
        <button onclick="_aiDismiss()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white active:scale-95" style="background:rgba(255,255,255,0.15);touch-action:manipulation">\u2716 Skip</button>
      </div>
    </div>`;
  } else {
    banner.style.transform = 'translateY(100%)';
  }

function _aiAccept() {

  else if(s.result === 'wide') scoreExtra('wide', s.extras_runs || 1);

let _pendingTimer = null;
function setPending(val) {
  const wasTrue = state.pendingRequest;
  state.pendingRequest = val;
  if(_pendingTimer) { clearTimeout(_pendingTimer); _pendingTimer = null; }
  if(val) { _pendingTimer = setTimeout(() => { state.pendingRequest = false; _pendingTimer = null; showToast('Request timed out — try again'); if(_onScoringPage() && !isAnyModalOpen()) drawScoring(); }, 35000); }
  else if(wasTrue && _onScoringPage() && !isAnyModalOpen()) { try { drawScoring(); } catch(e) {} }
}
function _onScoringPage() { try { return getRoute().page === 'scoring'; } catch(e) { return false; } }

let _retryTimer = null;
function setPendingRetry(fn) {
  _pendingBallRetry = fn;
  if(_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  if(fn) { _retryTimer = setTimeout(() => { _pendingBallRetry = null; _retryTimer = null; }, 30000); }
}

window.addEventListener('error', function(e) {
  console.error('Global error:', e.error);
  if(state.pendingRequest) { state.pendingRequest = false; if(_pendingTimer) { clearTimeout(_pendingTimer); _pendingTimer = null; } }
  if(_onScoringPage() && !isAnyModalOpen()) { try { drawScoring(); } catch(e2) {} }
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled promise rejection:', e.reason);
  if(state.pendingRequest) { state.pendingRequest = false; if(_pendingTimer) { clearTimeout(_pendingTimer); _pendingTimer = null; } }
  if(_onScoringPage() && !isAnyModalOpen()) { try { drawScoring(); } catch(e2) {} }
});

function unstickGame() {
  state.pendingRequest = false;
  if(_pendingTimer) { clearTimeout(_pendingTimer); _pendingTimer = null; }
  _pendingBallRetry = null;
  if(_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
  showToast('Reset — syncing with server...');
  refreshScoring().catch(() => drawScoring());
}

async function scoreBall(runs) {
  if(!state.bowler) { setPendingRetry(() => scoreBall(runs)); showBowlerPicker(); return; }
  if(state.pendingRequest) return;
  if(runs === 0) { playCueSound('dot'); cueVibrate('dot'); }
  else if(runs >= 1 && runs <= 3) { playCueSound('single'); cueVibrate('single'); }
  setPending(true);
  const bk = JSON.parse(JSON.stringify(state));
  state.score.runs += runs;
  state.score.balls += 1;
  if(state.onStrike) { state.onStrike.runs+=runs; state.onStrike.balls+=1; if(runs===4)state.onStrike.fours++; if(runs===6)state.onStrike.sixes++; }
  if(state.bowler) { state.bowler.runs+=runs; state.bowler.balls+=1; }
  state.thisOver.push({runs,extrasType:'none',extrasRuns:0,isWicket:false});
  state.isFreeHit = false;
  if(runs===4) showCelebration('four');
  if(runs===6) showCelebration('six');
  if(runs%2===1) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  const legal = state.thisOver.filter(b=>b.extrasType!=='wide'&&b.extrasType!=='noball').length;
  if(legal===6) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  try { settleMarketBets(runs, 'none', false); } catch(e) {}
  drawScoring();

  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs, extras_type:'none', extras_runs:0, is_wicket:false
    });
    if(res.status === 'queued_offline') { /* keep optimistic update */ }
    else if(res.error) throw new Error(res.error);
    else syncFromServer(res);
    try { if(state.recordingEnabled) saveClip(runs===4||runs===6, {type:runs===6?'six':'four',runs,batsman:state.onStrike?.name,bowler:state.bowler?.name}); } catch(_se) {}
  } catch(e) { Object.assign(state,bk); if(e.message?.includes('No bowler')) { showToast('Select a bowler first'); showBowlerPicker(); } else if(e.message?.includes('No striker')) { _fixStriker(()=>scoreBall(runs)); } else { showToast('Error: ' + e.message); } drawScoring(); }
  finally { setPending(false); }
}

async function scoreExtra(type, extraRuns) {
  hideModal('modal-extras');
  if(!state.bowler) { setPendingRetry(() => scoreExtra(type, extraRuns)); showBowlerPicker(); return; }
  if(state.pendingRequest) return;
  setPending(true);
  const er = extraRuns||1;
  const bk = JSON.parse(JSON.stringify(state));

  state.score.runs += er; state.score.extras += er;
  if(type==='wide'||type==='noball') { /* illegal */ }
  else { state.score.balls += 1; if(state.onStrike) state.onStrike.balls+=1; if(state.bowler) state.bowler.balls+=1; }
  if(state.bowler) { if(type==='wide'){state.bowler.wides=(state.bowler.wides||0)+1;state.bowler.runs+=er;} if(type==='noball'){state.bowler.noballs=(state.bowler.noballs||0)+1;state.bowler.runs+=er;} }
  state.thisOver.push({runs:0,extrasType:type,extrasRuns:er,isWicket:false});
  if(type==='noball') { state.isFreeHit = true; showCelebration('noball'); }
  if(type==='wide') showCelebration('wide');
  if((type==='bye'||type==='legbye')&&er%2===1) { let t=state.onStrike;state.onStrike=state.nonStriker;state.nonStriker=t; }
  drawScoring();

  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs:0, extras_type:type, extras_runs:er, is_wicket:false
    });
    if(res.status === 'queued_offline') { /* keep optimistic */ }
    else if(res.error) throw new Error(res.error);
    else syncFromServer(res);
    try { if(state.recordingEnabled) saveClip(); } catch(_se) {}
  } catch(e) { Object.assign(state,bk); if(e.message?.includes('No bowler')) { showToast('Select a bowler first'); showBowlerPicker(); } else if(e.message?.includes('No striker')) { _fixStriker(()=>scoreExtra(type,extraRuns)); } else { showToast('Error: '+e.message); } drawScoring(); }
  finally { setPending(false); }
}

async function doConfirmWicket(newBat) {
  hideModal('modal-wicket');
  if(!state.bowler) { setPendingRetry(() => doConfirmWicket(newBat)); showBowlerPicker(); return; }
  showCelebration('wicket');
  if(state.pendingRequest) return;
  setPending(true);
  const isNb = wktData.isNoBall === true;
  const runOutRuns = wktData.runOutRuns || 0;
  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs:runOutRuns, extras_type: isNb ? 'noball' : 'none', extras_runs: isNb ? 1 : 0,
      is_wicket:true, wicket_type:wktData.type,
      dismissed_batsman:wktData.dismissed,
      new_batsman:newBat,
      fielder:wktData.fielder||null
    });
    if(res.status === 'queued_offline') { showToast('Wicket saved offline'); }
    else if(res.error) throw new Error(res.error);
    else { state.isFreeHit = isNb; syncFromServer(res); }
    try { if(state.recordingEnabled) saveClip(true, {type:'wicket',runs:0,batsman:wktData.dismissed||state.onStrike?.name,bowler:state.bowler?.name}); } catch(_se) {}
  } catch(e) { alert('Error: '+e.message); }
  finally { setPending(false); }
}

async function undoLastBall() {
  if(state.pendingRequest) return;
  const _lb = (state.thisOver||[])[ (state.thisOver||[]).length - 1 ];
  const _what = _lb ? (_lb.isWicket ? 'the wicket' : ballSymbol(_lb) === '\u2022' ? 'the dot ball' : ballSymbol(_lb) + (/^[0-9]+$/.test(ballSymbol(_lb)) ? (ballSymbol(_lb)==='1'?' run':' runs') : '')) : 'the last ball';
  if(!confirm('Undo ' + _what + '?\n' + (state.score ? state.score.runs + '/' + state.score.wickets + ' (' + formatOvers(state.score.balls) + ')' : ''))) return;
  setPending(true);
  try {
    const res = await apiCall('undo_ball', {match_id:state.matchId, innings:state.innings});
    if(res.error) throw new Error(res.error);
    syncFromServer(res);
  } catch(e) { alert('Error: '+e.message); }
  finally { setPending(false); }
}

function syncFromServer(res) {
  if(!res) return;
  const keys = ['score','onStrike','nonStriker','bowler','thisOver','battingCard','bowlingCard',
    'availableBatsmen','availableBowlers','target','innings','match','battingTeam','bowlingTeam','commonPlayerInfo'];
  keys.forEach(k => { if(res[k]!==undefined) state[k]=res[k]; });
  // (The old "never let balls go down" guard is gone: the server now commits before answering,
  // so its count is authoritative — and the guard froze the ball count after an undo.)
  // Apply ball offset stored by doSetScoreConfirm — only onto a fresh server score, never twice
  if(res.score && state.score && state.matchId && state.innings) {
    const offsetKey = '_ballOffset_' + state.matchId + '_' + state.innings;
    const offset = parseInt(sessionStorage.getItem(offsetKey)) || 0;
    if(offset > 0) state.score.balls = (state.score.balls || 0) + offset;
  }
  const over = state.thisOver||[];
  if(over.length > 0 && over[over.length-1].extrasType === 'noball') {
    state.isFreeHit = true;
  }
  drawScoring();
  if(res.innings_complete) { try { settleLambiBets(); } catch(e) {} showInningsModal(res); return; }
  if(res.match_complete) {
    try { settleLambiBets(); settleMatchWinnerBets(res.winner); } catch(e) {}
    const parentId = state.match?.is_super_over ? state.match.parent_match_id : null;
    setTimeout(()=>navigate('summary/'+(parentId||state.matchId)), 1500);
    return;
  }
  if(res.needs_bowler) { state._vsBowlType = ''; state._vsStep = 1; try { settleSessionBets(); } catch(e) {} try { playCueSound('over'); cueVibrate('over'); } catch(e) {} showBowlerPicker(); }
  if(res.needs_new_batsman) showQuickMatchNewBatsman();
  if(res.retire_prompt) showRetirePrompt(res.retire_player);
}

function _fixStriker(onFixed) {
  // Called when server returns "No striker found"
  // Use battingCard (the actual state field) not state.batting
  const batters = (state.battingCard||[]).filter(b=>b.is_batting && !b.how_out);
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.style.cssText = 'display:flex;z-index:200';
  if(!batters.length) {
    // battingCard empty too — pull fresh state first, then re-show
    apiCall('get_state', {match_id:state.matchId}).then(fresh => {
      if(!fresh.error) { Object.assign(state, fresh); }
      const b2 = (state.battingCard||[]).filter(b=>b.is_batting && !b.how_out);
      if(!b2.length) { showToast('Refresh failed — please reload the page'); return; }
      _fixStriker(onFixed);
    });
    return;
  }
  modal.innerHTML = `
    <div class="modal-content">
      <div class="flex justify-between items-center mb-3" style="position:sticky;top:0;background:var(--bg-card);z-index:2;padding-bottom:8px">
        <h3 class="font-bold text-lg">Who is on strike?</h3>
        <button onclick="this.closest('.modal-overlay').remove()" class="text-2xl leading-none">&times;</button>
      </div>
      <p class="text-sm mb-3" style="color:var(--text2)">Strike got lost — tap the batsman currently facing</p>
      ${batters.map(b=>`
        <button onclick="window._pickStrikerFix('${b.name.replace(/'/g,"\\'")}',this.closest('.modal-overlay'))" class="w-full p-4 rounded-xl font-bold text-left active:scale-95 mb-2" style="background:var(--bg);touch-action:manipulation">
          🏏 ${b.name} <span class="text-sm font-normal" style="color:var(--text2)">${b.runs}(${b.balls})</span>
        </button>`).join('')}
      <div class="mt-3 pt-3" style="border-top:1px solid var(--border)">
        <div class="text-xs font-semibold mb-2" style="color:var(--text2)">New batsman coming in</div>
        <div class="flex gap-2">
          <input id="fix-new-batsman" type="text" placeholder="Type batsman name" class="flex-1 p-3 rounded-lg text-base" autocomplete="off">
          <button onclick="window._addStrikerFix(this.closest('.modal-overlay'))" class="px-4 py-2 rounded-lg font-bold text-sm active:scale-95" style="background:#16a34a;color:#fff;touch-action:manipulation">Add</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  window._pickStrikerFix = async (name, modalEl) => {
    modalEl.remove();
    try {
      await apiCall('set_striker', {match_id:state.matchId, innings:state.innings, batsman:name});
      const fresh = await apiCall('get_state', {match_id:state.matchId});
      if(!fresh.error) { Object.assign(state, fresh); }
    } catch(e) {}
    drawScoring();
    if(onFixed) onFixed();
  };
  window._addStrikerFix = async (modalEl) => {
    const name = document.getElementById('fix-new-batsman')?.value.trim();
    if(!name) { showToast('Enter a name'); return; }
    modalEl.remove();
    try {
      await apiCall('add_quick_batsman', {match_id:state.matchId, innings:state.innings, name, team:state.battingTeam||''});
      await apiCall('set_striker', {match_id:state.matchId, innings:state.innings, batsman:name});
      const fresh = await apiCall('get_state', {match_id:state.matchId});
      if(!fresh.error) { Object.assign(state, fresh); }
    } catch(e) {}
    drawScoring();
    if(onFixed) onFixed();
  };
}

let _pendingBallRetry = null;

async function pickBowler(name) {
  hideModal('modal-bowler');
  try {
    const res = await apiCall('set_bowler', {match_id:state.matchId, innings:state.innings, bowler:name});
    if(res.error) throw new Error(res.error);
    if(res.status === 'queued_offline') { state.bowler = state.bowler || {name}; }
    else syncFromServer(res);
    if(_pendingBallRetry) {
      const retry = _pendingBallRetry;
      setPendingRetry(null);
      showToast('Bowler set — scoring ball...');
      retry();
    }
  } catch(e) {
    setPendingRetry(null);
    showToast('Bowler error: ' + e.message + ' — tap 🔧 to reset');
  }
}

function showInningsModal(res) {
  const currentInn = state.innings || 1;
  const totalInns = state.match?.total_innings || 2;
  const isLastInnings = currentInn >= totalInns;
  const isTied = isLastInnings && !res.winner;
  const isSuperOver = state.match?.is_super_over;
  const parentMatchId = state.match?.parent_match_id;
  const nextInn = currentInn + 1;
  const innLabel = ['1st','2nd','3rd','4th'];

  if (isSuperOver && isLastInnings) {
    document.getElementById('inn-icon').textContent = isTied ? '🤝' : '⚡';
    document.getElementById('inn-title').textContent = isTied ? 'Super Over Tied!' : 'Super Over Complete!';
    document.getElementById('inn-msg').textContent = res.winner ? `${res.winner} wins the Super Over!` : 'Still level after Super Over!';
    document.getElementById('inn-btn').textContent = res.winner ? 'View Match Summary' : 'View Summary';
  } else if (isLastInnings) {
    document.getElementById('inn-icon').textContent = isTied ? '🤝' : '\u{1F3C6}';
    document.getElementById('inn-title').textContent = isTied ? 'Match Tied!' : 'Match Complete!';
    document.getElementById('inn-msg').textContent = res.winner ? `${res.winner} wins!` : 'Scores are level!';
    document.getElementById('inn-btn').textContent = 'View Summary';
  } else {
    const nextTeam = nextInn % 2 === 1 ? state.match?.batting_first : (state.match?.batting_first === state.match?.team_a ? state.match?.team_b : state.match?.team_a);
    document.getElementById('inn-icon').textContent = '\u{1F3CF}';
    document.getElementById('inn-title').textContent = `${innLabel[currentInn-1]||currentInn+'th'} Innings Complete`;
    document.getElementById('inn-msg').textContent = `${state.battingTeam} scored ${state.score.runs}/${state.score.wickets}`;
    document.getElementById('inn-btn').textContent = `Start ${innLabel[nextInn-1]||nextInn+'th'} Innings`;
  }

  let soBtn = document.getElementById('inn-super-over-btn');
  if (!soBtn) {
    soBtn = document.createElement('button');
    soBtn.id = 'inn-super-over-btn';
    soBtn.className = 'w-full py-3 rounded-xl bg-yellow-500 text-white font-bold text-base active:scale-[0.97] mt-2';
    soBtn.style.touchAction = 'manipulation';
    soBtn.textContent = '⚡ Super Over';
    document.getElementById('inn-btn').parentNode.appendChild(soBtn);
  }
  soBtn.style.display = isTied ? 'block' : 'none';
  soBtn.onclick = () => {
    hideModal('modal-innings');
    if (isSuperOver && parentMatchId) {
      state.matchId = parentMatchId;
      startSuperOver();
    } else {
      startSuperOver();
    }
  };
  document.getElementById('modal-innings').style.display = 'flex';
}

function handleInningsEnd() {
  hideModal('modal-innings');
  const isSuperOver = state.match?.is_super_over;
  const parentMatchId = state.match?.parent_match_id;

  const totalInnings = state.match?.total_innings || 2;
  const currentInn = state.innings || 1;

  if (currentInn >= totalInnings) {
    if (isSuperOver && parentMatchId) {
      navigate('summary/' + parentMatchId);
    } else {
      navigate('summary/' + state.matchId);
    }
  } else {
    // Mark which innings to start next — openers uses this to bypass stale n8n in_progress status
    sessionStorage.setItem('_cricket_next_inn', String(currentInn + 1));
    navigate('openers/' + state.matchId);
  }
}

async function confirmSuperOver(parentMatchId, teamA, teamB, soNum) {
  const batA = [...document.querySelectorAll('.so-bat-a:checked')].map(cb => cb.value);
  const batB = [...document.querySelectorAll('.so-bat-b:checked')].map(cb => cb.value);
  const bowlA = document.querySelector('.so-bowl-a:checked')?.value;
  const bowlB = document.querySelector('.so-bowl-b:checked')?.value;

  if(batA.length < 2) { alert('Pick 2 batsmen for ' + teamA); return; }
  if(batB.length < 2) { alert('Pick 2 batsmen for ' + teamB); return; }
  if(!bowlA) { alert('Pick a bowler for ' + teamA); return; }
  if(!bowlB) { alert('Pick a bowler for ' + teamB); return; }

  const btn = document.getElementById('btn-so-start');
  btn.disabled = true; btn.textContent = 'Creating...';

  const batFirst = window._soFirstBat === 'A' ? teamA : teamB;

  try {
    const res = await apiCall('create_match', {
      team_a: teamA, team_b: teamB,
      overs: 1,
      players_per_team: 2,
      retire_at: 0,
      last_man_batting: true,
      team_a_players: [...batA, bowlA].filter((v,i,a) => a.indexOf(v) === i),
      team_b_players: [...batB, bowlB].filter((v,i,a) => a.indexOf(v) === i),
      is_super_over: true,
      parent_match_id: parentMatchId,
      super_over_num: soNum
    });

    if(!res.match_id) throw new Error(res.error || 'Failed');

    const soLinks = JSON.parse(localStorage.getItem('cricket_super_overs') || '{}');
    if(!soLinks[parentMatchId]) soLinks[parentMatchId] = [];
    soLinks[parentMatchId].push(res.match_id);
    localStorage.setItem('cricket_super_overs', JSON.stringify(soLinks));

    await apiCallOk('set_toss', {
      match_id: res.match_id,
      toss_winner: batFirst,
      batting_first: batFirst
    });

    const striker = batFirst === teamA ? batA[0] : batB[0];
    const nonStriker = batFirst === teamA ? batA[1] : batB[1];
    const bowler = batFirst === teamA ? bowlB : bowlA;

    await apiCallOk('start_innings', {
      match_id: res.match_id,
      innings: 1,
      on_strike: striker,
      non_striker: nonStriker,
      bowler: bowler
    });

    localStorage.setItem('cricket_so_picks_' + res.match_id, JSON.stringify({
      teamA, teamB, batA, batB, bowlA, bowlB, batFirst
    }));

    localStorage.setItem('cricket_access_' + res.match_id, 'full');
    navigate('scoring/' + res.match_id);
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Start Super Over ⚡';
  }
}

async function scoreNoBall(batRuns) {
  if(!state.bowler) { setPendingRetry(() => scoreNoBall(batRuns)); showBowlerPicker(); return; }
  if(state.pendingRequest) return;
  setPending(true);
  const bk = JSON.parse(JSON.stringify(state));
  const er = 1; // no ball penalty
  state.score.runs += batRuns + er; state.score.extras += er;
  if(state.onStrike && batRuns > 0) { state.onStrike.runs += batRuns; if(batRuns===4)state.onStrike.fours++; if(batRuns===6)state.onStrike.sixes++; }
  if(state.bowler) { state.bowler.noballs=(state.bowler.noballs||0)+1; state.bowler.runs+=batRuns+er; }
  state.thisOver.push({runs:batRuns,extrasType:'noball',extrasRuns:er,isWicket:false});
  state.isFreeHit = true; showCelebration('noball');
  if(batRuns%2===1) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  drawScoring();
  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs:batRuns, extras_type:'noball', extras_runs:er, is_wicket:false
    });
    if(res.error) throw new Error(res.error);
    syncFromServer(res);
    try { if(state.recordingEnabled) saveClip(); } catch(_se) {}
  } catch(e) { Object.assign(state,bk); if(e.message?.includes('No bowler')) { showToast('Select a bowler first'); showBowlerPicker(); } drawScoring(); }
  finally { setPending(false); }
}

let _hlControlsVisible = true;
let _hlControlsTimer = null;

function _hlShowControls(autoHide) {
  const ctrl = document.getElementById('hl-controls');
  const seg  = document.getElementById('hl-segments');
  if(!ctrl) return;
  ctrl.style.opacity = '1';
  ctrl.style.pointerEvents = 'auto';
  if(seg) seg.style.opacity = '1';
  _hlControlsVisible = true;
  if(_hlControlsTimer) clearTimeout(_hlControlsTimer);
  if(autoHide) {
    _hlControlsTimer = setTimeout(() => {
      const vid = document.getElementById('hl-video');
      if(vid && !vid.paused) {
        const ctrl2 = document.getElementById('hl-controls');
        const seg2  = document.getElementById('hl-segments');
        if(ctrl2) { ctrl2.style.opacity = '0'; ctrl2.style.pointerEvents = 'none'; }
        if(seg2)  seg2.style.opacity = '0';
        _hlControlsVisible = false;
      }
    }, 3500);
  }
}

function hlToggleControls() {
  const ctrl = document.getElementById('hl-controls');
  const seg  = document.getElementById('hl-segments');
  if(!ctrl) return;
  if(_hlControlsVisible) {
    if(_hlControlsTimer) clearTimeout(_hlControlsTimer);
    ctrl.style.opacity = '0'; ctrl.style.pointerEvents = 'none';
    if(seg) seg.style.opacity = '0';
    _hlControlsVisible = false;
  } else {
    _hlShowControls(true);
  }
}

function _hlWireGestures(zone) {
  if(!zone) return;
  let ty0 = 0, tx0 = 0, tt0 = 0, moved = false;
  zone.addEventListener('touchstart', e => {
    ty0 = e.touches[0].clientY; tx0 = e.touches[0].clientX;
    tt0 = Date.now(); moved = false;
  }, {passive: true});
  zone.addEventListener('touchmove', e => {
    if(Math.abs(e.touches[0].clientY - ty0) > 10) moved = true;
  }, {passive: true});
  zone.addEventListener('touchend', e => {
    const dy = ty0 - e.changedTouches[0].clientY;
    const dx = tx0 - e.changedTouches[0].clientX;
    const dt = Date.now() - tt0;
    if(Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.5 && dt < 500) {
      if(dy > 0) hlNav(1); else hlNav(-1);
    } else if(!moved && dt < 300) {
      hlToggleControls();
    }
  }, {passive: true});
  zone.addEventListener('click', () => { if(!moved) hlToggleControls(); });
}

function hlUpdateSegments(activeIdx) {
  const clips = window._hlClips || [];
  const seg = document.getElementById('hl-segments');
  if(!seg) return;
  seg.innerHTML = clips.map((_, i) => {
    const done   = i < activeIdx;
    const active = i === activeIdx;
    return '<div style="flex:1;height:3px;border-radius:2px;background:' + (done ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.25)') + ';overflow:hidden">' +
      (active ? '<div id="hl-seg-fill" style="height:100%;width:0%;background:#fff"></div>' : '') +
      '</div>';
  }).join('');
}

function hlPlay(idx) {
  const clips = window._hlClips || [];
  if(!clips[idx]) return;
  window._hlIdx = idx;
  const c = clips[idx];

  // Update thumbnail strip active state
  document.querySelectorAll('[id^="hl-thumb-"]').forEach(el => { el.style.borderColor = 'transparent'; });
  const activeThumb = document.getElementById('hl-thumb-' + idx);
  if(activeThumb) {
    activeThumb.style.borderColor = '#fff';
    activeThumb.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }

  // Segment progress bar
  hlUpdateSegments(idx);

  if(window._hlLoadTimer) { clearTimeout(window._hlLoadTimer); window._hlLoadTimer = null; }
  if(window._hlStallTimer) { clearTimeout(window._hlStallTimer); window._hlStallTimer = null; }

  const vid = document.getElementById('hl-video');
  const loading = document.getElementById('hl-loading');
  if(!vid) return;

  if(loading) { loading.style.display = 'flex'; loading.innerHTML = '<div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.08);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.7s linear infinite"></div><div style="color:rgba(255,255,255,0.3);font-size:13px;font-weight:600">Loading\u2026</div>'; }
  vid.style.visibility = 'hidden';
  vid.style.opacity = '0';

  vid.onended = () => {
    const fill = document.getElementById('hl-seg-fill');
    if(fill) fill.style.width = '100%';
    if(idx < clips.length - 1) {
      setTimeout(() => hlPlay(idx + 1), 200);
    } else {
      _hlShowControls(false);
      const ppBtn = document.getElementById('hl-playpause-btn');
      if(ppBtn) ppBtn.textContent = '\u25B6';
    }
  };

  vid.onerror = () => {
    if(window._hlIdx !== idx) return;
    if(window._hlLoadTimer) { clearTimeout(window._hlLoadTimer); window._hlLoadTimer = null; }
    const ext = (c.ext || c.url.split('.').pop().split('?')[0] || '').toLowerCase();
    const errCode = vid.error ? vid.error.code : 0;
    const errMsg = errCode === 4 || ext === 'webm' ? '\u26A0\uFE0F Format not supported on this device' :
                   '\u26A0\uFE0F Could not load clip';
    if(loading) {
      loading.style.display = 'flex';
      loading.innerHTML = '<div style="color:rgba(255,120,120,0.9);font-size:13px;text-align:center;padding:0 24px">' + errMsg +
        '<br><button onclick="hlPlay(' + idx + ')" style="margin-top:10px;background:rgba(255,255,255,0.15);border:none;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation">Retry</button>' +
        '<br><a href="' + c.url + '" target="_blank" style="display:inline-block;margin-top:8px;color:rgba(255,255,255,0.4);font-size:11px">Open in browser \u2197</a>' +
        '</div>';
    }
  };

  vid.ontimeupdate = () => {
    if(window._hlIdx !== idx) return;
    const fill = document.getElementById('hl-seg-fill');
    if(fill && vid.duration > 0) fill.style.width = (vid.currentTime / vid.duration * 100) + '%';
  };

  vid.onloadedmetadata = () => {
    if(window._hlIdx !== idx) return;
    if(window._hlLoadTimer) { clearTimeout(window._hlLoadTimer); window._hlLoadTimer = null; }
    if(window._hlStallTimer) { clearTimeout(window._hlStallTimer); window._hlStallTimer = null; }
    if(loading) loading.style.display = 'none';
    vid.style.visibility = 'visible';
    vid.style.opacity = '1';
    vid.playbackRate = window._hlSpeed || 1;
    vid.play().catch(() => {
      if(loading) { loading.style.display = 'flex'; loading.innerHTML = '<button onclick="document.getElementById(\'hl-video\').play();document.getElementById(\'hl-loading\').style.display=\'none\'" style="background:rgba(255,255,255,0.15);border:none;color:#fff;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation">\u25B6 Tap to Play</button>'; }
    });
    _hlFlashType(c.type);
    _hlShowControls(true);
  };

  // Mid-playback buffer stall \u2014 show indicator, auto-recover when data resumes
  vid.onwaiting = () => {
    if(window._hlIdx !== idx) return;
    if(loading) { loading.style.display = 'flex'; loading.innerHTML = '<div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.08);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.7s linear infinite"></div><div style="color:rgba(255,255,255,0.35);font-size:12px;margin-top:8px">Buffering\u2026</div>'; }
  };
  vid.onplaying = () => {
    if(window._hlIdx !== idx) return;
    if(loading) loading.style.display = 'none';
    const b = document.getElementById('hl-playpause-btn'); if(b) b.textContent = '\u23F8';
    // Preload next clip into a hidden video element while this one plays
    const nxt = clips[idx + 1];
    if(nxt && nxt.url) {
      if(!window._hlPreEl) {
        window._hlPreEl = document.createElement('video');
        window._hlPreEl.muted = true;
        window._hlPreEl.preload = 'auto';
        window._hlPreEl.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
        document.body.appendChild(window._hlPreEl);
      }
      if(window._hlPreEl.src !== nxt.url) {
        window._hlPreEl.src = nxt.url;
        window._hlPreEl.load();
      }
    }
  };

  vid.onstalled = () => {
    if(window._hlIdx !== idx) return;
    if(loading && loading.style.display !== 'none') {
      loading.innerHTML = '<div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.08);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.7s linear infinite"></div><div style="color:rgba(255,255,255,0.35);font-size:12px;margin-top:8px">Buffering\u2026</div>';
      // Auto-retry after 4s if still stuck on initial load
      if(window._hlStallTimer) clearTimeout(window._hlStallTimer);
      window._hlStallTimer = setTimeout(() => {
        if(window._hlIdx !== idx) return;
        if(loading && loading.style.display !== 'none') { vid.load(); }
      }, 4000);
    }
  };

  vid.onplay  = () => { if(window._hlIdx !== idx) return; if(loading) loading.style.display = 'none'; const b = document.getElementById('hl-playpause-btn'); if(b) b.textContent = '\u23F8'; };
  vid.onpause = () => { if(window._hlIdx !== idx) return; const b = document.getElementById('hl-playpause-btn'); if(b) b.textContent = '\u25B6'; };

  // Stream directly \u2014 no pause() before load (can lock iOS decoder)
  vid.src = c.url;
  vid.load();

  // Update episode info
  const typeLabel = {six:'💥 SIX!', four:'🔥 FOUR!', wicket:'🎯 WICKET!'};
  const titleEl = document.getElementById('hl-ep-title');
  const subEl   = document.getElementById('hl-ep-sub');
  const ctrEl   = document.getElementById('hl-counter');
  if(titleEl) titleEl.textContent = typeLabel[c.type] || '🎬 Highlight';
  if(subEl) {
    const parts = [];
    if(c.batsman) parts.push(c.batsman);
    if(c.bowler)  parts.push('vs ' + c.bowler);
    if(c.over_label) parts.push('Ov ' + c.over_label);
    if(c.innings) parts.push('Inn ' + c.innings);
    subEl.textContent = parts.join(' • ');
  }
  if(ctrEl) ctrEl.textContent = (idx + 1) + ' / ' + clips.length;

  // 15s load timeout — show Retry/Skip so users don't wait forever
  window._hlLoadTimer = setTimeout(() => {
    if(window._hlIdx !== idx) return;
    if(window._hlStallTimer) { clearTimeout(window._hlStallTimer); window._hlStallTimer = null; }
    if(loading && loading.style.display !== 'none') {
      const hasNext = window._hlClips && idx + 1 < window._hlClips.length;
      loading.innerHTML = '<div style="text-align:center;padding:0 20px">' +
        '<div style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:14px">⚠️ Slow connection</div>' +
        '<div style="display:flex;gap:10px;justify-content:center">' +
        '<button onclick="hlPlay(' + idx + ')" style="background:#16a34a;border:none;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation">↺ Retry</button>' +
        (hasNext ? '<button onclick="hlPlay(' + (idx+1) + ')" style="background:rgba(255,255,255,0.15);border:none;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation">Skip ›</button>' : '') +
        '</div></div>';
    }
  }, 15000);
}

function _hlFlashType(type) {
  const types = {six:'💥 SIX!', four:'🔥 FOUR!', wicket:'🎯 WICKET!'};
  const txt = types[type];
  if(!txt) return;
  const el = document.getElementById('hl-type-flash');
  const txtEl = document.getElementById('hl-type-flash-txt');
  if(!el || !txtEl) return;
  txtEl.textContent = txt;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1600);
}

function hlNav(dir) {
  const clips = window._hlClips || [];
  const next = (window._hlIdx || 0) + dir;
  if(next >= 0 && next < clips.length) hlPlay(next);
}

function closeHlReel() {
  if(window._hlLoadTimer) { clearTimeout(window._hlLoadTimer); window._hlLoadTimer = null; }
  if(window._hlStallTimer) { clearTimeout(window._hlStallTimer); window._hlStallTimer = null; }
  if(_hlControlsTimer) { clearTimeout(_hlControlsTimer); _hlControlsTimer = null; }
  const vid = document.getElementById('hl-video');
  if(vid) { try { vid.pause(); } catch(e){} vid.src = ''; vid.removeAttribute('src'); }
  if(window._hlPreEl) { try { window._hlPreEl.pause(); } catch(e){} window._hlPreEl.src = ''; window._hlPreEl.remove(); window._hlPreEl = null; }
  document.getElementById('hl-reel-overlay')?.remove();
  if(history.state && history.state.hlReel) history.back();
}

function hlTogglePlay() {
  const vid = document.getElementById('hl-video');
  if(!vid) return;
  const icon = document.getElementById('hl-center-icon');
  const inner = document.getElementById('hl-center-icon-inner');
  if(vid.paused) {
    vid.play().catch(()=>{});
    if(inner) inner.textContent = '▶';
  } else {
    vid.pause();
    if(inner) inner.textContent = '⏸';
    _hlShowControls(false); // keep controls visible while paused
  }
  // Flash center icon
  if(icon) {
    icon.style.opacity = '1';
    clearTimeout(icon._t);
    icon._t = setTimeout(() => { icon.style.opacity = '0'; }, 600);
  }
}

function hlToggleMute() {
  const vid = document.getElementById('hl-video');
  const btn = document.getElementById('hl-mute-btn');
  if(!vid) return;
  vid.muted = !vid.muted;
  if(btn) btn.textContent = vid.muted ? '🔇' : '🔊';

function hlSetSpeed(rate) {
  window._hlSpeed = rate;
  const vid = document.getElementById('hl-video');

  document.querySelectorAll('.hl-spd').forEach(b => {
    const active = parseFloat(b.dataset.rate) === rate;

}

// ── Pure-JS MP4 box stitcher (no WASM, no SharedArrayBuffer, works on iOS) ──
function _mp4ParseBoxes(ab) {
  const v = new DataView(ab); const boxes = []; let off = 0;
  while(off + 8 <= ab.byteLength) {
    const size = v.getUint32(off); if(size < 8 || off + size > ab.byteLength) break;
    const type = String.fromCharCode(v.getUint8(off+4),v.getUint8(off+5),v.getUint8(off+6),v.getUint8(off+7));
    boxes.push({ type, data: ab.slice(off, off+size) }); off += size;
  }
  return boxes;
}
function _mp4ParseInner(ab) { return _mp4ParseBoxes(ab.slice(8)); }

function _mp4GetTimescale(moovAB) {
  for(const trak of _mp4ParseInner(moovAB)) {
    if(trak.type !== 'trak') continue;
    for(const mdia of _mp4ParseInner(trak.data)) {
      if(mdia.type !== 'mdia') continue;
      for(const b of _mp4ParseInner(mdia.data)) {
        if(b.type !== 'mdhd') continue;
        const v = new DataView(b.data); const ver = v.getUint8(8);
        // v0: ctime(4)+mtime(4)+timescale(4) → timescale at off+20
        // v1: ctime(8)+mtime(8)+timescale(4) → timescale at off+28
        return ver===1 ? v.getUint32(28) : v.getUint32(20);
      }
    }
  }
  return 90000;
}

function _mp4GetClipDuration(boxes) {
  let dur = 0;
  for(const box of boxes) {
    if(box.type !== 'moof') continue;
    for(const traf of _mp4ParseInner(box.data)) {
      if(traf.type !== 'traf') continue;
      // Read tfhd for default_sample_duration fallback
      let defaultDur = 0;
      for(const b of _mp4ParseInner(traf.data)) {
        if(b.type !== 'tfhd') continue;
        const v = new DataView(b.data);
        const fl = (v.getUint8(9)<<16)|(v.getUint8(10)<<8)|v.getUint8(11);
        let o = 16; // after size+type+ver+flags+trackID
        if(fl & 0x000001) o+=8; if(fl & 0x000002) o+=4;
        if(fl & 0x000008) defaultDur = v.getUint32(o);
      }
      for(const b of _mp4ParseInner(traf.data)) {
        if(b.type !== 'trun') continue;
        const v = new DataView(b.data);
        const flags = (v.getUint8(9)<<16)|(v.getUint8(10)<<8)|v.getUint8(11);
        const cnt = v.getUint32(12);
        let o = 16;
        if(flags & 0x0001) o+=4; if(flags & 0x0004) o+=4;
        const hasDur=!!(flags&0x0100), hasSz=!!(flags&0x0200), hasFlg=!!(flags&0x0400), hasCO=!!(flags&0x0800);
        for(let i=0;i<cnt;i++){
          if(hasDur){dur+=v.getUint32(o);o+=4;} else dur+=defaultDur;
          if(hasSz)o+=4; if(hasFlg)o+=4; if(hasCO)o+=4;
        }
      }
    }
  }
  return dur;
}

// Patch moov duration fields to 0 so iOS plays all fragments, not just clip-1's declared duration
function _mp4PatchMoov(moovAB) {
  const out = new Uint8Array(moovAB.slice(0)); const v = new DataView(out.buffer);
  function walk(start, end) {
    let off = start;
    while(off + 8 <= end) {
      const sz = v.getUint32(off); if(sz < 8) break;
      const tp = String.fromCharCode(v.getUint8(off+4),v.getUint8(off+5),v.getUint8(off+6),v.getUint8(off+7));
      const ver = v.getUint8(off+8);
      if(tp==='mvhd') {
        // v0: ctime(4)+mtime(4)+ts(4)+dur(4) → dur at off+24
        // v1: ctime(8)+mtime(8)+ts(4)+dur(8) → dur at off+32
        if(ver===1){v.setUint32(off+32,0);v.setUint32(off+36,0);}
        else v.setUint32(off+24,0);
      } else if(tp==='tkhd') {
        // v0: ctime(4)+mtime(4)+trackID(4)+res(4)+dur(4) → dur at off+28
        // v1: ctime(8)+mtime(8)+trackID(4)+res(4)+dur(8) → dur at off+36
        if(ver===1){v.setUint32(off+36,0);v.setUint32(off+40,0);}
        else v.setUint32(off+28,0);
      } else if(tp==='mdhd') {
        // v0: ctime(4)+mtime(4)+ts(4)+dur(4) → dur at off+24
        // v1: ctime(8)+mtime(8)+ts(4)+dur(8) → dur at off+32
        if(ver===1){v.setUint32(off+32,0);v.setUint32(off+36,0);}
        else v.setUint32(off+24,0);
      } else if(tp==='trak'||tp==='mdia') {
        walk(off+8, off+sz);
      }
      off += sz;
    }
  }
  walk(8, moovAB.byteLength);
  return out.buffer;
}

function _mp4AdjustMoof(moofAB, timeOff, seqNum) {
  const out = new Uint8Array(moofAB.slice(0)); const v = new DataView(out.buffer);
  let off = 8;
  while(off + 8 <= moofAB.byteLength) {
    const sz = v.getUint32(off); if(sz < 8) break;
    const tp = String.fromCharCode(v.getUint8(off+4),v.getUint8(off+5),v.getUint8(off+6),v.getUint8(off+7));
    if(tp==='mfhd') {
      // Patch sequence_number (size+type+ver+flags+seqnum = off+12)
      v.setUint32(off+12, seqNum);
    } else if(tp === 'traf') {
      let to = off+8;
      while(to+8 <= off+sz) {
        const tsz = v.getUint32(to); if(tsz < 8) break;
        const ttp = String.fromCharCode(v.getUint8(to+4),v.getUint8(to+5),v.getUint8(to+6),v.getUint8(to+7));
        if(ttp === 'tfdt') {
          const ver = v.getUint8(to+8);
          if(ver===1){
            const hi=v.getUint32(to+12), lo=v.getUint32(to+16);
            const adj=(hi*4294967296+lo)+timeOff;
            v.setUint32(to+12, Math.floor(adj/4294967296));
            v.setUint32(to+16, adj>>>0);
          } else {
            v.setUint32(to+12, (v.getUint32(to+12)+timeOff)>>>0);
          }
        }
        to += tsz;
      }
    }
    off += sz;
  }
  return out.buffer;
}

async function _mp4Concat(clips, onProgress) {
  const bufs = [];
  for(let i=0;i<clips.length;i++) {
    onProgress(`📥 Downloading clip ${i+1} of ${clips.length}…`);
    const r = await fetch(clips[i].url);
    if(!r.ok) throw new Error(`Clip ${i+1} download failed (${r.status})`);
    bufs.push(await r.arrayBuffer());
  }
  onProgress('⚙️ Stitching clips…');
  const parsed = bufs.map(_mp4ParseBoxes);
  const firstMoov = parsed[0].find(b=>b.type==='moov');
  const ftyp = parsed[0].find(b=>b.type==='ftyp');
  const ts = firstMoov ? _mp4GetTimescale(firstMoov.data) : 90000;
  // Patch moov: zero out all duration fields so iOS plays past clip-1's declared duration
  const moovOut = firstMoov ? _mp4PatchMoov(firstMoov.data) : null;
  let cumDur = 0, seqNum = 1; const parts = [];
  if(ftyp) parts.push(ftyp.data);
  if(moovOut) parts.push(moovOut);
  for(let i=0;i<parsed.length;i++) {
    const clipDur = _mp4GetClipDuration(parsed[i]) || Math.round(ts * 8);
    for(const box of parsed[i]) {
      if(box.type==='moof') parts.push(_mp4AdjustMoof(box.data, cumDur, seqNum++));
      else if(box.type==='mdat') parts.push(box.data);
    }
    cumDur += clipDur;
  }
  const total = parts.reduce((s,p)=>s+p.byteLength,0);
  const out = new Uint8Array(total); let off=0;
  for(const p of parts){out.set(new Uint8Array(p),off);off+=p.byteLength;}
  return out.buffer;
}

async function _startProVideo(matchId, teamA, teamB, winner, date) {
  const btn = document.getElementById('pro-video-btn');
  if(btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
  _proStatus('📂 Loading highlight clips…');
  try {
    if(typeof _fbStorage === 'undefined') throw new Error('Firebase not connected');
    const ref = _fbStorage.ref('highlights/' + matchId);
    const listed = await ref.listAll();
    const resolved = await Promise.all(listed.items.map(async item => {
      try { return _parseStorageClip(item.name, await item.getDownloadURL()); } catch(e) { return null; }
    }));
    const clips = resolved.filter(Boolean).sort((a,b) => a.timestamp - b.timestamp);
    if(!clips.length) {
      _proStatus('❌ No highlight clips found. Record highlights during a live match first.');
      if(btn) { btn.disabled = false; btn.textContent = '🎬 Generate Video'; }
      return;
    }
    _proStatus(`✅ Found ${clips.length} clip${clips.length>1?'s':''}. Starting…`);
    const outBuf = await _mp4Concat(clips, msg => _proStatus(msg));
    _proStatus('✅ Done!');
    const blob = new Blob([outBuf], { type: 'video/mp4' });
    const blobUrl = URL.createObjectURL(blob);
    _showProVideoResultLocal(blobUrl, blob);
  } catch(e) {
    _proStatus('❌ ' + (e.message || 'Something went wrong'));
    if(btn) { btn.disabled = false; btn.textContent = '🎬 Try Again'; }
  }
}

async function _hlGetClipFile(c) {
  const resp = await fetch(c.url);
  if(!resp.ok) throw new Error('fetch_failed');
  const blob = await resp.blob();
  const safeName = (c.batsman||'clip').replace(/[^a-zA-Z0-9]/g,'_');
  const label = c.type ? '_' + c.type : '';
  const over  = (c.over_label||'').replace('.','_');
  const fileName = 'cricket' + label + '_' + safeName + (over ? '_ov' + over : '') + '.mp4';
  return new File([blob], fileName, { type: 'video/mp4' });
}

function _hlOpenInSafari(c) {
  // iOS fallback: open video directly in Safari where user can Save Video via native share button
  const a = document.createElement('a');
  a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('Tap ⬆ Share → Save Video to save to Photos');
}

async function hlShareClip() {
  const clips = window._hlClips || [];
  const c = clips[window._hlIdx || 0];
  if(!c || !c.url) { showToast('No clip available'); return; }
  const labels = {six:'💥 SIX!', four:'🔥 FOUR!', wicket:'🎯 WICKET!'};
  const label  = labels[c.type] || 'Highlight';
  const shareText = [
    c.batsman ? c.batsman + ' ' + label : label,
    c.bowler  ? 'off ' + c.bowler : '',
    c.over_label ? 'Over ' + c.over_label : ''
  ].filter(Boolean).join(' • ') + '\n🏏 Box Cricket';
  try {
    // Try blob fetch + file share (works when Firebase CORS is configured)
    const file = await _hlGetClipFile(c);
    if(navigator.share) {
      try { await navigator.share({ files: [file], title: label + ' — Box Cricket', text: shareText }); return; }
      catch(fe) { if(fe.name === 'AbortError') return; }
    }
  } catch(fetchErr) { /* CORS blocked — fall through to URL share */ }
  // Fallback: share URL (recipient can watch/save from link)
  try {
    if(navigator.share) { await navigator.share({ title: label + ' — Box Cricket', text: shareText, url: c.url }); }
    else { await navigator.clipboard.writeText(c.url).catch(() => {}); showToast('Link copied — paste in WhatsApp'); }
  } catch(e) { if(e.name !== 'AbortError') showToast('Could not share'); }
}

async function hlDownload() {
  const clips = window._hlClips || [];
  const c = clips[window._hlIdx || 0];
  if(!c || !c.url) { showToast('No clip available'); return; }
  const btn = document.getElementById('hl-dl-btn');
  if(btn) { btn.textContent = '⏳'; btn.disabled = true; }
  try {
    showToast('Preparing…');
    // Try blob fetch (works when Firebase CORS is configured, or on Android WebView)
    let file;
    try { file = await _hlGetClipFile(c); } catch(corsErr) { file = null; }

    if(file && navigator.share) {
      try { await navigator.share({ files: [file], title: 'Cricket Highlight' }); return; }
      catch(fe) { if(fe.name === 'AbortError') return; /* file share not supported, fall through */ }
    }
    if(file) {
      // Android/Desktop: direct blob download
      const blobUrl = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = blobUrl; a.download = file.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 20000);
      showToast('Saved to downloads!');
      return;
    }
    // CORS blocked (iOS Safari PWA): open in Safari native player so user can save
    _hlOpenInSafari(c);
  } catch(e) {
    if(e.name !== 'AbortError') _hlOpenInSafari(c);
  } finally {
    if(btn) { btn.textContent = '⬇️'; btn.disabled = false; }
  }
}

function shareScorecard() {
  const m = state.match || {};
  // Try to get innings from window._lastMatchData if state doesn't have it
  const lastData = window._lastMatchData || {};
  const lastMatch = lastData.match || {};
  const lastInns = lastData.innings || [];
  const matchInfo = (m.team_a || lastMatch.team_a) ? (m.team_a ? m : lastMatch) : {};
  const matchLabel = (matchInfo.team_a||'Team A') + ' vs ' + (matchInfo.team_b||'Team B');
  const overs = matchInfo.overs || 5;

  let text = '🏑 *BOX CRICKET SCORECARD*\n';
  text += '━━━━━━━━━━━━━━━━━━━━━\n';
  text += '*' + matchLabel + '*  •  ' + overs + ' overs\n';
  const winner = matchInfo.winner || lastMatch.winner;
  if(winner) text += '🏆 *' + winner + ' won*' + (matchInfo.super_over_winner?' (Super Over)':'')+'\n';
  text += '━━━━━━━━━━━━━━━━━━━━━\n\n';

  const allInns = [];
  if(state.battingCard && state.battingCard.length) {
    allInns.push({batting_team: state.battingTeam||'', batting: state.battingCard, bowling: state.bowlingCard||[], total_runs: state.score?.runs||0, total_wickets: state.score?.wickets||0, total_balls: state.score?.balls||0});
  }
  if(!allInns.length) {
    if(lastInns[0]) allInns.push(lastInns[0]);
    if(lastInns[1]) allInns.push(lastInns[1]);
  }

  allInns.forEach((inn, i) => {
    text += (i===0?'1st':'2nd') + ' Inn: *' + inn.batting_team + '*  ' + inn.total_runs + '/' + inn.total_wickets + ' (' + formatOvers(inn.total_balls) + ' ov)\n';
    text += '```\n';
    text += 'Batter          R    B   4s  6s\n';
    (inn.batting||[]).forEach(b => {
      if(b.balls > 0 || b.runs > 0) {
        const name = b.name.substring(0,14).padEnd(14);
        const r = String(b.runs).padStart(3);
        const balls = String(b.balls).padStart(4);
        const fours = String(b.fours||0).padStart(4);
        const sixes = String(b.sixes||0).padStart(4);
        text += name + ' ' + r + ' ' + balls + ' ' + fours + ' ' + sixes + '\n';
      }
    });
    text += '\nBowler          O    R    W\n';
    (inn.bowling||[]).filter(b=>b.balls>0).forEach(b => {
      const name = b.name.substring(0,14).padEnd(14);
      const ov = formatOvers(b.balls).padStart(4);
      const r = String(b.runs).padStart(5);
      const w = String(b.wickets).padStart(5);
      text += name + ' ' + ov + ' ' + r + ' ' + w + '\n';
    });
    text += '```\n\n';
  });

  text += '📲 Scored live on Box Cricket\n';
  if(matchInfo.invite_code) text += '🔑 Match code: *' + matchInfo.invite_code + '*\n';

  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

async function generateScorecardPoster(matchId) {
  showToast('Generating poster...');
  try {
    const res = await apiCall('get_scorecard', {match_id: matchId});
    const m = res.match || {};
    const inns = res.innings || [];
    const awards = computeMatchAwards(inns);

    const W = 1080, H = 1920;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0f1e');
    bg.addColorStop(0.5, '#0d1b2a');
    bg.addColorStop(1, '#0a0f1e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = 0.03;
    for(let i = 0; i < H; i += 4) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, i, W, 1);
    }
    ctx.globalAlpha = 1;

    const accent = ctx.createLinearGradient(0, 0, W, 0);
    accent.addColorStop(0, '#16a34a');
    accent.addColorStop(1, '#22c55e');
    ctx.fillStyle = accent;
    ctx.fillRect(0, 0, W, 6);

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '600 28px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F3CF} Box Cricket Scorer', W/2, 60);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 72px -apple-system, sans-serif';
    ctx.fillText(m.team_a + '  vs  ' + m.team_b, W/2, 160);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '500 32px -apple-system, sans-serif';
    ctx.fillText(m.overs + ' Overs Match', W/2, 210);

    let y = 280;
    const winnerGrad = ctx.createLinearGradient(140, y, W-140, y+80);
    winnerGrad.addColorStop(0, '#16a34a');
    winnerGrad.addColorStop(1, '#15803d');
    _roundRect(ctx, 140, y, W-280, 80, 16);
    ctx.fillStyle = winnerGrad;
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 40px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F3C6} ' + (m.winner || 'Match Tied') + (m.winner && m.winner !== 'Tied' ? ' Wins!' : ''), W/2, y+52);

    y = 410;
    for(let i = 0; i < inns.length; i++) {
      const inn = inns[i];
      _roundRect(ctx, 60, y, W-120, 460, 20);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = inn.batting_team === m.winner ? '#22c55e' : '#ffffff';
      ctx.font = '800 48px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(inn.batting_team, 100, y+55);
      ctx.textAlign = 'right';
      ctx.fillText(inn.total_runs + '/' + inn.total_wickets, W-100, y+55);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '500 28px -apple-system, sans-serif';
      ctx.fillText('(' + formatOvers(inn.total_balls) + ' ov)', W-100, y+90);

      const tableY = y + 115;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '700 22px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Batter', 100, tableY);
      ctx.textAlign = 'right';
      ctx.fillText('R', W-340, tableY);
      ctx.fillText('B', W-270, tableY);
      ctx.fillText('4s', W-200, tableY);
      ctx.fillText('6s', W-140, tableY);

      const batters = (inn.batting || []).slice(0, 6);
      batters.forEach((b, j) => {
        const rowY = tableY + 38 + j * 38;
        ctx.fillStyle = b.how_out === 'not out' || !b.how_out ? '#ffffff' : 'rgba(255,255,255,0.6)';
        ctx.font = '600 26px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(b.name, 100, rowY);
        ctx.textAlign = 'right';
        ctx.font = '800 26px -apple-system, sans-serif';
        ctx.fillText(String(b.runs), W-340, rowY);
        ctx.font = '500 24px -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(String(b.balls), W-270, rowY);
        ctx.fillText(String(b.fours), W-200, rowY);
        ctx.fillText(String(b.sixes), W-140, rowY);
      });

      const bowlY = tableY + 38 + batters.length * 38 + 20;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(80, bowlY - 15, W-160, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '700 22px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Bowler', 100, bowlY + 10);
      ctx.textAlign = 'right';
      ctx.fillText('O', W-340, bowlY + 10);
      ctx.fillText('R', W-270, bowlY + 10);
      ctx.fillText('W', W-200, bowlY + 10);

      const bowlers = (inn.bowling || []).slice(0, 4);
      bowlers.forEach((b, j) => {
        const rowY = bowlY + 45 + j * 34;
        ctx.fillStyle = b.wickets >= 2 ? '#22c55e' : 'rgba(255,255,255,0.6)';
        ctx.font = '600 24px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(b.name, 100, rowY);
        ctx.textAlign = 'right';
        ctx.fillText(formatOvers(b.balls), W-340, rowY);
        ctx.fillText(String(b.runs), W-270, rowY);
        ctx.font = '800 24px -apple-system, sans-serif';
        ctx.fillStyle = b.wickets >= 2 ? '#22c55e' : '#ffffff';
        ctx.fillText(String(b.wickets), W-200, rowY);
      });

      y += 490;
    }

    y = Math.max(y + 20, 1400);
    if(awards.pom) {
      _roundRect(ctx, 60, y, W-120, 160, 20);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();

      const awardItems = [
        awards.pom ? {icon:'\u{1F3C6}', title:'Player of the Match', name:awards.pom.name, stat:awards.pom.stat} : null,
        awards.bestBat ? {icon:'\u{1F3CF}', title:'Best Bat', name:awards.bestBat.name, stat:awards.bestBat.stat} : null,
        awards.bestBowl ? {icon:'\u{26BE}', title:'Best Bowl', name:awards.bestBowl.name, stat:awards.bestBowl.stat} : null,
      ].filter(Boolean);

      const colW = (W - 120) / awardItems.length;
      awardItems.forEach((a, i) => {
        const cx = 60 + colW * i + colW/2;
        ctx.textAlign = 'center';
        ctx.font = '40px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(a.icon, cx, y + 45);
        ctx.font = '600 20px -apple-system, sans-serif';
        ctx.fillStyle = '#f59e0b';
        ctx.fillText(a.title, cx, y + 75);
        ctx.font = '800 28px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(a.name, cx, y + 110);
        ctx.font = '500 22px -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(a.stat, cx, y + 140);
      });
    }

    ctx.fillStyle = accent;
    ctx.fillRect(0, H-6, W, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '500 24px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('n8n.barandates.in/webhook/cricket', W/2, H-30);

    canvas.toBlob(async (blob) => {
      if(!blob) { showToast('Failed to generate poster'); return; }
      const file = new File([blob], 'scorecard.png', {type: 'image/png'});
      if(navigator.canShare && navigator.canShare({files: [file]})) {
        try {
          await navigator.share({
            files: [file],
            title: m.team_a + ' vs ' + m.team_b + ' Scorecard',
            text: '\u{1F3CF} ' + (m.winner || 'Match Tied') + (m.winner && m.winner !== 'Tied' ? ' wins!' : '') + ' | Box Cricket Scorer'
          });
        } catch(e) { if(e.name !== 'AbortError') _downloadPoster(blob); }
      } else {
        _downloadPoster(blob);
      }
    }, 'image/png', 1.0);

  } catch(e) { showToast('Error: ' + e.message); }
}

function _downloadPoster(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'scorecard.png';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Poster saved!');
}

function _roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function computeMatchAwards(innings) {
  const allBatting = [];
  const allBowling = [];
  const fieldingMap = {};

  innings.forEach(inn => {
    (inn.batting||[]).forEach(b => allBatting.push({...b, team: inn.batting_team}));
    (inn.bowling||[]).forEach(b => allBowling.push({...b, team: inn.bowling_team}));
    (inn.batting||[]).forEach(b => {
      if(b.how_out === 'caught' || b.how_out === 'runout') {
      }
    });
  });

  const impactMap = {};
  allBatting.forEach(b => {
    const sr = b.balls > 0 ? (b.runs / b.balls) * 100 : 0;
    const impact = b.runs + (b.sixes * 3) + (b.fours * 1) + (sr > 150 && b.balls >= 5 ? 10 : 0);
    impactMap[b.name] = (impactMap[b.name] || 0) + impact;
  });
  allBowling.forEach(b => {
    const eco = b.balls > 0 ? (b.runs / b.balls) * 6 : 99;
    const impact = (b.wickets * 25) + (eco < 6 && b.balls >= 6 ? 10 : 0) + (b.wickets >= 3 ? 15 : 0);
    impactMap[b.name] = (impactMap[b.name] || 0) + impact;
  });

  const sortedImpact = Object.entries(impactMap).sort((a,b) => b[1] - a[1]);
  const pom = sortedImpact[0] ? sortedImpact[0][0] : null;
  const pomStat = sortedImpact[0] ? _buildAwardStat(sortedImpact[0][0], allBatting, allBowling) : '';

  const bestBat = [...allBatting].sort((a,b) => b.runs - a.runs || a.balls - b.balls)[0];
  const bestBatStat = bestBat ? `${bestBat.runs} (${bestBat.balls}b) ${bestBat.fours?bestBat.fours+'x4 ':''}${bestBat.sixes?bestBat.sixes+'x6':''}` : '';

  const bestBowl = [...allBowling].filter(b=>b.balls>0).sort((a,b) => b.wickets - a.wickets || (a.balls>0?a.runs/a.balls:99) - (b.balls>0?b.runs/b.balls:99))[0];
  const bestBowlStat = bestBowl ? `${bestBowl.wickets}/${bestBowl.runs} (${formatOvers(bestBowl.balls)})` : '';

  const catchMap = {};
  allBowling.forEach(b => { if(b.wickets > 0) catchMap[b.name] = (catchMap[b.name]||0); });
  innings.forEach(inn => {
    const bowlers = (inn.bowling||[]).map(b=>b.name);
    (inn.batting||[]).forEach(b => {
      if(b.how_out === 'caught') {
        bowlers.forEach(bw => { catchMap[bw] = catchMap[bw] || 0; });
      }
      if(b.how_out === 'runout') {
        bowlers.forEach(bw => { catchMap[bw] = (catchMap[bw]||0) + 0.2; });
      }
    });
  });

  const mvp = sortedImpact.length > 1 && sortedImpact[0][0] !== sortedImpact[1][0] ? sortedImpact[0][0] : pom;
  const mvpStat = mvp ? _buildAwardStat(mvp, allBatting, allBowling) : '';

  return {
    pom: pom ? { name: pom, stat: pomStat } : null,
    bestBat: bestBat ? { name: bestBat.name, stat: bestBatStat } : null,
    bestBowl: bestBowl ? { name: bestBowl.name, stat: bestBowlStat } : null,
    mvp: mvp ? { name: mvp, stat: mvpStat } : null
  };
}

function _buildAwardStat(name, allBatting, allBowling) {
  const bat = allBatting.find(b => b.name === name);
  const bowl = allBowling.find(b => b.name === name);
  let parts = [];
  if(bat && bat.runs > 0) parts.push(`${bat.runs}(${bat.balls}b)`);
  if(bowl && bowl.wickets > 0) parts.push(`${bowl.wickets}/${bowl.runs}`);
  return parts.join(' & ') || '';
}

function renderAwardsSection(innings) {
  const awards = computeMatchAwards(innings);
  if(!awards.pom) return '';
  const cards = [
    awards.pom ? {icon:'\u{1F3C6}', title:'Player of the Match', name:awards.pom.name, stat:awards.pom.stat, color:'#f59e0b'} : null,
    awards.bestBat ? {icon:'\u{1F3CF}', title:'Best Batsman', name:awards.bestBat.name, stat:awards.bestBat.stat, color:'#3b82f6'} : null,
    awards.bestBowl ? {icon:'\u{26BE}', title:'Best Bowler', name:awards.bestBowl.name, stat:awards.bestBowl.stat, color:'#22c55e'} : null,
    awards.mvp ? {icon:'\u2B50', title:'MVP', name:awards.mvp.name, stat:awards.mvp.stat, color:'#a855f7'} : null,
  ].filter(Boolean);
  const seen = new Set();
  const unique = cards.filter(c => {
    const key = c.name;
    if(seen.has(key) && c.title === 'MVP') return false;
    seen.add(key);
    return true;
  });
  return `<div class="space-y-2">
    <h3 class="text-xs font-bold uppercase tracking-wide px-1" style="color:var(--text2)">Match Awards</h3>
    <div class="grid grid-cols-${unique.length > 2 ? '2' : unique.length} gap-2">
      ${unique.map(c => `
        <div class="card rounded-xl p-3 text-center">
          <div class="text-2xl">${c.icon}</div>
          <div class="text-xs font-semibold mt-1" style="color:${c.color}">${c.title}</div>
          <div class="font-bold text-sm mt-0.5">${c.name}</div>
          <div class="text-xs" style="color:var(--text2)">${c.stat}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function computeSeriesAwards(scorecards) {
  const batMap = {};
  const bowlMap = {};
  const impactMap = {};

  scorecards.forEach(sc => {
    if(!sc || !sc.innings) return;
    sc.innings.forEach(inn => {
      (inn.batting||[]).forEach(b => {
        if(!batMap[b.name]) batMap[b.name] = {runs:0, balls:0, fours:0, sixes:0, innings:0};
        batMap[b.name].runs += b.runs;
        batMap[b.name].balls += b.balls;
        batMap[b.name].fours += b.fours;
        batMap[b.name].sixes += b.sixes;
        batMap[b.name].innings++;
      });
      (inn.bowling||[]).forEach(b => {
        if(!bowlMap[b.name]) bowlMap[b.name] = {wickets:0, runs:0, balls:0, innings:0};
        bowlMap[b.name].wickets += b.wickets;
        bowlMap[b.name].runs += b.runs;
        bowlMap[b.name].balls += b.balls;
        bowlMap[b.name].innings++;
      });
    });
  });

  for(const [name, b] of Object.entries(batMap)) {
    const sr = b.balls > 0 ? (b.runs/b.balls)*100 : 0;
    impactMap[name] = (impactMap[name]||0) + b.runs + b.sixes*3 + b.fours + (sr>150?b.innings*5:0);
  }
  for(const [name, b] of Object.entries(bowlMap)) {
    const eco = b.balls > 0 ? (b.runs/b.balls)*6 : 99;
    impactMap[name] = (impactMap[name]||0) + b.wickets*25 + (eco<6?b.innings*5:0);
  }

  const sortedImpact = Object.entries(impactMap).sort((a,b) => b[1]-a[1]);
  const mot = sortedImpact[0] ? sortedImpact[0][0] : null;

  const topBat = Object.entries(batMap).sort((a,b) => b[1].runs - a[1].runs)[0];
  const topBowl = Object.entries(bowlMap).sort((a,b) => b[1].wickets - a[1].wickets || (a[1].balls>0?a[1].runs/a[1].balls:99) - (b[1].balls>0?b[1].runs/b[1].balls:99))[0];

  return {
    mot: mot ? {name: mot, stat: _seriesStat(mot, batMap, bowlMap)} : null,
    topBat: topBat ? {name: topBat[0], stat: `${topBat[1].runs} runs (${topBat[1].innings} inn, ${topBat[1].sixes} sixes)`} : null,
    topBowl: topBowl ? {name: topBowl[0], stat: `${topBowl[1].wickets} wkts, eco ${topBowl[1].balls>0?((topBowl[1].runs/topBowl[1].balls)*6).toFixed(1):'0'}`} : null
  };
}

function _seriesStat(name, batMap, bowlMap) {
  const parts = [];
  if(batMap[name]) parts.push(`${batMap[name].runs} runs`);
  if(bowlMap[name] && bowlMap[name].wickets > 0) parts.push(`${bowlMap[name].wickets} wkts`);
  return parts.join(', ');
}

function getOrCreateSeries(matchId, teamA, teamB) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  for(const [sid, s] of Object.entries(allSeries)) {
    if(s.matches.includes(matchId)) return sid;
  }
  for(const [sid, s] of Object.entries(allSeries)) {
    const sameTeams = (s.teamA === teamA && s.teamB === teamB) || (s.teamA === teamB && s.teamB === teamA);
    if(sameTeams && !s.closed) {
      s.matches.push(matchId);
      localStorage.setItem('cricket_series', JSON.stringify(allSeries));
      return sid;
    }
  }
  const sid = 'S' + Date.now();
  allSeries[sid] = { teamA, teamB, matches: [matchId], closed: false, created: new Date().toISOString() };
  localStorage.setItem('cricket_series', JSON.stringify(allSeries));
  return sid;
}

function addMatchToSeries(seriesId, matchId) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  if(allSeries[seriesId] && !allSeries[seriesId].matches.includes(matchId)) {
    allSeries[seriesId].matches.push(matchId);
    localStorage.setItem('cricket_series', JSON.stringify(allSeries));
  }
}

function getSeriesStats(seriesId) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  const s = allSeries[seriesId];
  if(!s) return null;
  const allMatches = state.allMatches || [];
  let winsA = 0, winsB = 0, ties = 0, total = 0;
  for(const mid of s.matches) {
    const m = allMatches.find(x => x.match_id === mid);
    if(!m || m.status !== 'completed') continue;
    total++;
    if(!m.winner || m.winner === 'Tied' || m.winner === 'Tie') ties++;
    else if(m.winner === s.teamA) winsA++;
    else if(m.winner === s.teamB) winsB++;
  }
  return { teamA: s.teamA, teamB: s.teamB, winsA, winsB, ties, total, matches: s.matches };
}

async function startRematch(prevMatchId) {
  const d = window._lastMatchData;
  if(!d) return;
  const m = d.match;
  const players = d.players || [];
  const overs = parseInt(document.getElementById('rematch-overs').value) || m.overs;
  const batFirst = window._rematchBatFirst === 'A' ? m.team_a : m.team_b;
  const btn = document.getElementById('btn-rematch');
  btn.disabled = true; btn.textContent = 'Creating...';

  const seriesId = getOrCreateSeries(prevMatchId, m.team_a, m.team_b);

  const teamAPlayers = players.filter(p => p.team === m.team_a && !p.is_common).map(p => p.name);
  const teamBPlayers = players.filter(p => p.team === m.team_b && !p.is_common).map(p => p.name);

  try {
    const res = await apiCall('create_match', {
      team_a: m.team_a, team_b: m.team_b,
      overs: overs,
      players_per_team: m.players_per_team || 11,
      retire_at: m.retire_at || 0,
      last_man_batting: m.last_man_batting !== false,
      team_a_players: teamAPlayers,
      team_b_players: teamBPlayers,
      common_player: m.common_player || null,
      common_player_balls: m.common_player_balls || 0,
      series_id: seriesId,
      quick_match: teamAPlayers.length === 0
    });
    if(!res.match_id) throw new Error(res.error || 'Failed');

    addMatchToSeries(seriesId, res.match_id);

    await apiCallOk('set_toss', { match_id: res.match_id, toss_winner: batFirst, batting_first: batFirst });

    hideModal('modal-rematch');
    navigate('openers/' + res.match_id);
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Start Match \u{1F3CF}';
  }
}

function calculateBhav(st) {
  const SPREAD = 1.08; // 8% bookie margin (khai = lagai * SPREAD)

  let pDot = 0.38, pSingle = 0.30, pFour = 0.15, pSix = 0.07, pWicket = 0.05, pExtra = 0.05;

  const ls = _learnedStats;
  if (ls && ls.total >= 30) {
    const s = st.score || {};
    const totalOv = st.match?.overs || 5;
    const currentOver = Math.floor((s.balls || 0) / 6) + 1;
    const isEarly = currentOver <= 2;
    const isDeath = currentOver > totalOv - 2;

    const phase = isEarly ? ls.early : isDeath ? ls.death : ls.middle;
    if (phase && phase.total >= 10) {
      pDot = phase.dots / phase.total;
      pSingle = phase.singles / phase.total;
      pFour = phase.fours / phase.total;
      pSix = phase.sixes / phase.total;
      pWicket = phase.wickets / phase.total;
      pExtra = 1 - pDot - pSingle - pFour - pSix - pWicket;
      if (pExtra < 0.02) pExtra = 0.02;
    } else {
      pDot = ls.dots / ls.total;
      pSingle = ls.singles / ls.total;
      pFour = ls.fours / ls.total;
      pSix = ls.sixes / ls.total;
      pWicket = ls.wickets / ls.total;
      pExtra = ls.extras / ls.total;
    }
  }

  function probToBhav(p) { return Math.max(10, Math.round(((1 - p) / Math.max(p, 0.01)) * 100)); }

  let bhav = {
    dot:    { lagai: probToBhav(pDot),    khai: 0 },
    single: { lagai: probToBhav(pSingle), khai: 0 },
    four:   { lagai: probToBhav(pFour),   khai: 0 },
    six:    { lagai: probToBhav(pSix),    khai: 0 },
    wicket: { lagai: probToBhav(pWicket), khai: 0 },
    extra:  { lagai: probToBhav(pExtra),  khai: 0 }
  };

  const s = st.score || {};
  const totalOv = st.match?.overs || 5;
  const oversLeft = Math.max((totalOv * 6 - (s.balls || 0)) / 6, 0.1);
  const crr = s.balls > 0 ? (s.runs / s.balls) * 6 : 6;
  const sr = st.onStrike?.balls > 5 ? (st.onStrike.runs / st.onStrike.balls) * 100 : 100;
  const rrr = st.target ? ((st.target - s.runs) / oversLeft) : 0;

  if (oversLeft <= 2) {
    bhav.four.lagai = Math.round(bhav.four.lagai * 0.75);
    bhav.six.lagai = Math.round(bhav.six.lagai * 0.7);
    bhav.dot.lagai = Math.round(bhav.dot.lagai * 1.25);
    bhav.wicket.lagai = Math.round(bhav.wicket.lagai * 0.8);
  }
  if (rrr > 10) {
    bhav.four.lagai = Math.round(bhav.four.lagai * 0.8);
    bhav.six.lagai = Math.round(bhav.six.lagai * 0.75);
    bhav.dot.lagai = Math.round(bhav.dot.lagai * 1.35);
  }
  if (sr > 150 && st.onStrike?.balls > 5) {
    bhav.four.lagai = Math.round(bhav.four.lagai * 0.85);
    bhav.six.lagai = Math.round(bhav.six.lagai * 0.8);
  }
  if ((s.wickets || 0) >= 4) {
    bhav.dot.lagai = Math.round(bhav.dot.lagai * 0.85);
    bhav.wicket.lagai = Math.round(bhav.wicket.lagai * 0.75);
    bhav.six.lagai = Math.round(bhav.six.lagai * 1.25);
  }

  Object.keys(bhav).forEach(k => {
    bhav[k].lagai = Math.max(10, bhav[k].lagai);
    bhav[k].khai = Math.max(15, Math.round(bhav[k].lagai * SPREAD));
  });

  return bhav;
}

function isMarketReady() {
  return (state.score?.balls || 0) >= 6;
