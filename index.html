function getSmartCRR(st) {
  const AVG_RPO = 11; // box cricket average runs per over
  const s = st.score || {};
  const ballsBowled = s.balls || 0;
  const oversBowled = ballsBowled / 6;
  const actualCRR = ballsBowled > 0 ? (s.runs / ballsBowled) * 6 : AVG_RPO;

  if (oversBowled < 1) return AVG_RPO; // not enough data
  if (oversBowled < 2) return actualCRR * 0.3 + AVG_RPO * 0.7; // 30% actual, 70% average
  if (oversBowled < 3) return actualCRR * 0.6 + AVG_RPO * 0.4; // 60% actual, 40% average
  return actualCRR; // 3+ overs: trust actual CRR fully
}

function calculateSessionLine(st) {
  const crr = getSmartCRR(st);
  const ob = (st.thisOver||[]).filter(b=>b.extrasType!=='wide'&&b.extrasType!=='noball');
  const runsOv = (st.thisOver||[]).reduce((s,b)=>s+b.runs+(b.extrasRuns||0),0);
  const bl = 6 - ob.length;
  if (bl <= 0) return null;
  const proj = runsOv + (crr / 6) * bl;
  const low = Math.max(runsOv, Math.round(proj - 2));
  const high = Math.round(proj + 2);
  let yesBhav = 90, noBhav = 95;
  if (runsOv > high) { yesBhav = 30; noBhav = 200; } // already past YES line
  else if (runsOv >= low) { yesBhav = 70; noBhav = 120; } // in the middle
  if (runsOv < low && bl <= 2) { yesBhav = 180; noBhav = 40; } // unlikely to reach
  if (bl === 1) { // last ball — sharpen odds
    yesBhav = runsOv >= high ? 20 : runsOv >= high - 3 ? 100 : 250;
    noBhav = runsOv < low ? 20 : runsOv <= low + 3 ? 100 : 250;
  }
  return { low, high, current: runsOv, ballsLeft: bl, yesBhav, noBhav };
}

function calculateLambi(st) {
  const s = st.score || {};
  const totalOv = st.match?.overs || 5;
  const oversLeft = Math.max((totalOv*6 - (s.balls||0)) / 6, 0.1);
  const crr = getSmartCRR(st);
  const proj = (s.runs||0) + crr * oversLeft;
  const wf = 1 - ((s.wickets||0) * 0.08); // wickets have bigger impact
  const adj = proj * Math.max(wf, 0.4);
  const spread = Math.max(2, Math.round(oversLeft * 1.5)); // wider spread early, tighter late
  return { low: Math.round(adj - spread), high: Math.round(adj + spread), yesBhav: 85, noBhav: 90 };
}

function calculateMatchWinner(st) {
  const s = st.score || {};
  if (!st.target) return { teamA: { lagai: 95, khai: 100 }, teamB: { lagai: 95, khai: 100 } };
  const needed = st.target - s.runs;
  const bl = (st.match?.overs||5)*6 - s.balls;
  const rrr = needed / Math.max(bl/6, 0.1);
  const crr = s.balls > 0 ? (s.runs/s.balls)*6 : 6;
  const str = Math.min(Math.abs(crr - rrr) * 10, 60);
  if (crr > rrr) return {
    teamA: { lagai: Math.max(10, Math.round(80 - str*0.5)), khai: Math.max(15, Math.round(85 - str*0.5)) },
    teamB: { lagai: Math.round(110 + str), khai: Math.round(120 + str) }
  };
  return {
    teamA: { lagai: Math.round(110 + str), khai: Math.round(120 + str) },
    teamB: { lagai: Math.max(10, Math.round(80 - str*0.5)), khai: Math.max(15, Math.round(85 - str*0.5)) }
  };
}

function determineFavorite(st) {
  if (!st.target) return st.battingTeam || 'Team A';
  const needed = st.target - (st.score?.runs || 0);
  const bl = (st.match?.overs||5)*6 - (st.score?.balls||0);
  const rrr = needed / Math.max(bl/6, 0.1);
  const crr = st.score?.balls > 0 ? (st.score.runs / st.score.balls) * 6 : 6;
  return crr >= rrr ? st.battingTeam : st.bowlingTeam;
}

function placeBet(prediction, side, bhav, type, line) {
  const user = state._marketUser;
  const amount = state._betAmount;
  if (!user) { showMarketLogin(); return; }
  const liability = side === 'lagai' ? amount : Math.round(amount * bhav / 100);
  const potentialWin = side === 'lagai' ? Math.round(amount * bhav / 100) : amount;
  const balance = getUserBalance(user);
  if (liability > balance) { showToast('Not enough points! Need ' + liability); return; }
  const wallets = getWallets();
  if (!wallets[user]) wallets[user] = { points: 1000, totalWon: 0, totalLost: 0, matchesPlayed: 0 };
  wallets[user].points -= liability;
  saveWallets(wallets);
  const market = ensureMarket(state.matchId);
  if (!market.players.includes(user)) market.players.push(user);
  market.bets.push({
    id: 'bet_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    user, type: type || 'next_ball', prediction, side, bhav, amount, liability, potentialWin,
    ballNumber: (state.score?.balls||0) + 1,
    overNumber: Math.floor((state.score?.balls||0) / 6) + 1,
    line: line || null, status: 'pending', payout: 0, timestamp: Date.now()
  });
  saveMarket(state.matchId, market);
  showToast((side === 'lagai' ? 'YES' : 'NO') + ' ' + prediction.toUpperCase() + ' @ ' + bhav + ' placed!');
  drawScoring();
}

function settleMarketBets(runs, extrasType, isWicket) {
  const market = getMarket(state.matchId);
  if (!market || !market.bets.length) return;
  const currentBall = state.score.balls;
  let outcome = 'dot';
  if (isWicket) outcome = 'wicket';
  else if (extrasType === 'wide' || extrasType === 'noball') outcome = 'extra';
  else if (runs >= 4) outcome = 'four';
  else if (runs === 6) outcome = 'six';
  else if (runs >= 1) outcome = 'single';
  const wallets = getWallets();
  let settled = false;
  const results = []; // track what just settled for notifications
  market.bets.forEach(bet => {
    if (bet.status !== 'pending') return;
    if (bet.type === 'next_ball' && bet.ballNumber === currentBall) {
      const matched = bet.prediction === outcome;
      if (bet.side === 'lagai') {
        if (matched) { bet.status='won'; bet.payout=bet.liability+bet.potentialWin; wallets[bet.user].points+=bet.payout; wallets[bet.user].totalWon=(wallets[bet.user].totalWon||0)+bet.potentialWin; }
        else { bet.status='lost'; wallets[bet.user].totalLost=(wallets[bet.user].totalLost||0)+bet.liability; }
      } else {
        if (!matched) { bet.status='won'; bet.payout=bet.liability+bet.potentialWin; wallets[bet.user].points+=bet.payout; wallets[bet.user].totalWon=(wallets[bet.user].totalWon||0)+bet.potentialWin; }
        else { bet.status='lost'; wallets[bet.user].totalLost=(wallets[bet.user].totalLost||0)+bet.liability; }
      }
      results.push(bet);
      settled = true;
    }
  });
  if (settled) {
    saveWallets(wallets); saveMarket(state.matchId, market);
    results.forEach(b => {
      if (b.status === 'won') {
        showMarketResult(true, b.side.toUpperCase() + ' ' + b.prediction.toUpperCase() + ' @ ' + b.bhav, b.potentialWin, b.user);
      } else {
        showMarketResult(false, b.side.toUpperCase() + ' ' + b.prediction.toUpperCase() + ' @ ' + b.bhav, b.liability, b.user);
      }
    });
  }
  recalculateLiveOdds();
}

function settleSessionBets() {
  const market = getMarket(state.matchId);
  if (!market) return;
  const overNum = Math.floor((state.score?.balls||0) / 6);
  const overRuns = (state.thisOver||[]).reduce((s,b) => s + b.runs + (b.extrasRuns||0), 0);
  const wallets = getWallets();
  let settled = false;
  market.bets.forEach(bet => {
    if (bet.status !== 'pending' || bet.type !== 'session' || bet.overNumber !== overNum) return;
    const won = bet.prediction === 'yes' ? overRuns > bet.line : overRuns < bet.line;
    if (won) { bet.status='won'; bet.payout=bet.liability+bet.potentialWin; wallets[bet.user].points+=bet.payout; wallets[bet.user].totalWon=(wallets[bet.user].totalWon||0)+bet.potentialWin; }
    else { bet.status='lost'; wallets[bet.user].totalLost=(wallets[bet.user].totalLost||0)+bet.liability; }
    settled = true;
  });
  if (!market.sessionResults) market.sessionResults = [];
  market.sessionResults.push({ over: overNum, actual: overRuns });
  if (settled) { saveWallets(wallets); saveMarket(state.matchId, market); }
}

function settleLambiBets() {
  const market = getMarket(state.matchId);
  if (!market) return;
  const totalRuns = state.score?.runs || 0;
  const wallets = getWallets();
  let settled = false;
  market.bets.forEach(bet => {
    if (bet.status !== 'pending' || bet.type !== 'lambi') return;
    const won = bet.prediction === 'yes' ? totalRuns > bet.line : totalRuns < bet.line;
    if (won) { bet.status='won'; bet.payout=bet.liability+bet.potentialWin; wallets[bet.user].points+=bet.payout; wallets[bet.user].totalWon=(wallets[bet.user].totalWon||0)+bet.potentialWin; }
    else { bet.status='lost'; wallets[bet.user].totalLost=(wallets[bet.user].totalLost||0)+bet.liability; }
    settled = true;
    showMarketResult(won, bet.side.toUpperCase()+' LAMBI '+bet.prediction.toUpperCase()+' '+bet.line+' @ '+bet.bhav, won?bet.potentialWin:bet.liability, bet.user);
  });
  if (settled) { saveWallets(wallets); saveMarket(state.matchId, market); }
}

function settleMatchWinnerBets(winner) {
  const market = getMarket(state.matchId);
  if (!market || !winner) return;
  const wallets = getWallets();
  let settled = false;
  market.bets.forEach(bet => {
    if (bet.status !== 'pending' || bet.type !== 'match_winner') return;
    const teamWon = bet.prediction === winner;
    const won = bet.side === 'lagai' ? teamWon : !teamWon;
    if (won) { bet.status='won'; bet.payout=bet.liability+bet.potentialWin; wallets[bet.user].points+=bet.payout; wallets[bet.user].totalWon=(wallets[bet.user].totalWon||0)+bet.potentialWin; }
    else { bet.status='lost'; wallets[bet.user].totalLost=(wallets[bet.user].totalLost||0)+bet.liability; }
    settled = true;
    showMarketResult(won, bet.side.toUpperCase()+' '+bet.prediction+' @ '+bet.bhav, won?bet.potentialWin:bet.liability, bet.user);
  });
  if (settled) { saveWallets(wallets); saveMarket(state.matchId, market); }
}

function voidPendingBets() {
  const market = getMarket(state.matchId);
  if (!market) return;
  const wallets = getWallets();
  let voided = false;
  market.bets.forEach(bet => {
    if (bet.status !== 'pending') return;
    bet.status = 'void';
    wallets[bet.user].points += bet.liability; // refund
    voided = true;
  });
  if (voided) { saveWallets(wallets); saveMarket(state.matchId, market); }
}

function recalculateLiveOdds() {
  state._prevBhav = state._currentBhav || null;
  state._currentBhav = calculateBhav(state);
  refreshBhav(); // async, updates state._bhavData from server historical stats
  const market = ensureMarket(state.matchId);
  const s = state.score || {};
  if (!market.oddsHistory) market.oddsHistory = [];
  const mw = calculateMatchWinner(state);
  market.oddsHistory.unshift({
    ball: formatOvers(s.balls), score: s.runs+'/'+s.wickets,
    favTeam: determineFavorite(state),
    lagai: mw.teamA?.lagai || 0, khai: mw.teamA?.khai || 0,
    timestamp: Date.now()
  });
  if (market.oddsHistory.length > 50) market.oddsHistory.length = 50;
  saveMarket(state.matchId, market);
}

function doMarketLogin() {
  const name = (document.getElementById('market-login-name')?.value||'').trim();
  if (!name) { showToast('Enter a name'); return; }
  state._marketUser = name;
  localStorage.setItem('cricket_market_user', name);
  ensureWallet(name);
  hideModal('modal-market-login');
  drawScoring();
}

function showMarketResult(won, betDesc, amount, userName) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:300;padding:14px 16px;text-align:center;font-weight:900;font-size:15px;animation:celebFade 3s ease-out forwards;' +

    (won ? 'WON' : 'LOST') + ' ' + betDesc +

}

async function refreshBhav() {
  if (!state.matchId) return;
  try {
    const d = await apiCall('get_bhav', { match_id: state.matchId });
    if (d && d.ball) { state._bhavData = d; drawScoring(); }
  } catch(e) {}
}

      const sessLagai = srvSess ? srvSess.lagai : 90;
      const sessKhai  = srvSess ? srvSess.khai  : 92;
      const runsNow   = srvSess ? srvSess.runs_so_far : (state.thisOver||[]).reduce((a,b)=>a+b.runs+(b.extrasRuns||0),0);
      if (underLine !== null && overLine !== null) {
        html += '<div style="color:#64748b;font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:6px">SESSION \u00B7 Over ' + overNum + ' <span style="font-weight:400;color:#475569">(' + (6-ballsLeft) + '/6 balls)</span></div>';
        html += '<div style="text-align:center;padding:12px;background:#1e293b;border-radius:8px;margin-bottom:8px">';
        html += '<div style="font-size:26px;font-weight:900;color:#fff">' + underLine + '<span style="color:#64748b;font-size:16px;margin:0 8px">/</span>' + overLine + '</div>';
        html += '<div style="font-size:10px;color:#64748b;margin-top:2px">Under ' + underLine + ' \u00B7 Over ' + overLine + '</div>';
        html += '<div style="font-size:11px;color:#94a3b8;margin-top:4px">Current: ' + runsNow + ' runs \u00B7 ' + ballsLeft + ' ball' + (ballsLeft>1?'s':'') + ' left</div>';
        if (srvSess && srv.analysis) {
          html += '<div style="font-size:10px;color:#64748b;margin-top:4px">' + srv.analysis.phase + ' \u00B7 ' + (srv.analysis.striker||'') + ' SR:' + (srv.analysis.striker_sr||'') + ' \u00B7 ' + (srv.analysis.bowler||'') + ' Eco:' + (srv.analysis.bowler_eco||'') + '</div>';
        }
        html += '<div style="display:flex;gap:8px;margin-top:10px">';
        html += '<button onclick="placeBet(\'over\',\'lagai\',' + sessLagai + ',\'session\',' + overLine + ')" style="flex:1;padding:12px;border-radius:8px;font-weight:900;font-size:14px;background:#1e3a5f;border:2px solid #3b82f6;color:#3b82f6;cursor:pointer;touch-action:manipulation">OVER ' + overLine + '<br><span style="font-size:11px;font-weight:600">Lagai ' + sessLagai + '</span></button>';
        html += '<button onclick="placeBet(\'under\',\'lagai\',' + sessKhai + ',\'session\',' + underLine + ')" style="flex:1;padding:12px;border-radius:8px;font-weight:900;font-size:14px;background:#3b1a1a;border:2px solid #f97316;color:#f97316;cursor:pointer;touch-action:manipulation">UNDER ' + underLine + '<br><span style="font-size:11px;font-weight:600">Lagai ' + sessKhai + '</span></button>';
        html += '</div></div>';
      } else {
        html += '<div style="text-align:center;color:#64748b;padding:20px">Calculating session odds...</div>';
      }
    } else {
      html += '<div style="text-align:center;color:#64748b;padding:20px">Over complete. Session for next over starts after bowler selection.</div>';
    }
    // Lambi (innings total)
    const srvLambi = srv && srv.lambi;
    const lambi = srvLambi ? srvLambi : calculateLambi(state);
    const lambiLow  = srvLambi ? srvLambi.under    : lambi.low;
    const lambiHigh = srvLambi ? srvLambi.over      : lambi.high;
    const lambiYes  = srvLambi ? srvLambi.lagai     : lambi.yesBhav;
    const lambiNo   = srvLambi ? srvLambi.khai      : lambi.noBhav;
    html += '<div style="color:#64748b;font-size:10px;font-weight:700;letter-spacing:1px;margin:12px 0 6px">LAMBI \u00B7 Innings Total</div>';
    html += '<div style="text-align:center;padding:12px;background:#1e293b;border-radius:8px">';
    html += '<div style="font-size:24px;font-weight:900;color:#fff">' + lambiLow + '<span style="color:#64748b;font-size:16px;margin:0 8px">/</span>' + lambiHigh + '</div>';
    if (srvLambi) { html += '<div style="font-size:10px;color:#64748b;margin-top:2px">Under ' + lambiLow + ' \u00B7 Over ' + lambiHigh + ' \u00B7 Proj: ' + srvLambi.projected + '</div>'; }
    html += '<div style="font-size:11px;color:#94a3b8;margin-top:4px">Current: ' + s.runs + '/' + s.wickets + ' (' + formatOvers(s.balls) + ' ov)</div>';
    html += '<div style="display:flex;gap:8px;margin-top:10px">';
    html += '<button onclick="placeBet(\'over\',\'lagai\',' + lambiYes + ',\'lambi\',' + lambiHigh + ')" style="flex:1;padding:10px;border-radius:8px;font-weight:800;font-size:13px;background:#1e3a5f;border:2px solid #3b82f6;color:#3b82f6;cursor:pointer;touch-action:manipulation">OVER ' + lambiHigh + ' \u00B7 Lagai ' + lambiYes + '</button>';
    html += '<button onclick="placeBet(\'under\',\'lagai\',' + lambiNo + ',\'lambi\',' + lambiLow + ')" style="flex:1;padding:10px;border-radius:8px;font-weight:800;font-size:13px;background:#3b1a1a;border:2px solid #f97316;color:#f97316;cursor:pointer;touch-action:manipulation">UNDER ' + lambiLow + ' \u00B7 Lagai ' + lambiNo + '</button>';
    html += '</div></div>';
  } else if (tab === 'lambi') {
    // Match winner
    const srvMW = srv && srv.match_winner;
    const mw = srvMW ? null : calculateMatchWinner(state);
    const fav = determineFavorite(state);
    const teamA = state.battingTeam || 'Team A';
    const teamB = state.bowlingTeam || 'Team B';
    html += '<div style="color:#64748b;font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:6px">MATCH WINNER</div>';
    if (srvMW) {
      const mwTeams = [
        { name: srvMW.bat_team  || teamA, lagai: srvMW.bat_lagai,  khai: srvMW.bat_khai  },
        { name: srvMW.bowl_team || teamB, lagai: srvMW.bowl_lagai, khai: srvMW.bowl_khai },
      ];
      mwTeams.forEach(tm => {
        const safeName = tm.name.replace(/'/g, "\\'");
        const isFav = fav === tm.name;
        html += '<div style="padding:10px;background:#1e293b;border-radius:8px;margin-bottom:6px">';
        html += '<div style="font-weight:800;font-size:13px;color:#fff;margin-bottom:6px">' + (isFav?'\u2605 ':'') + tm.name + (isFav?' <span style="color:#f59e0b;font-size:10px">(FAV)</span>':'') + '</div>';
        html += '<div style="display:flex;gap:6px">';
        html += '<button onclick="placeBet(\'' + safeName + '\',\'lagai\',' + tm.lagai + ',\'match_winner\')" style="flex:1;padding:10px;border-radius:6px;font-weight:900;font-size:14px;background:#14532d;border:1px solid #22c55e44;color:#22c55e;cursor:pointer;touch-action:manipulation">LAGAI ' + tm.lagai + '</button>';
        html += '<button onclick="placeBet(\'' + safeName + '\',\'khai\',' + tm.khai + ',\'match_winner\')" style="flex:1;padding:10px;border-radius:6px;font-weight:900;font-size:14px;background:#450a0a;border:1px solid #ef444444;color:#fca5a5;cursor:pointer;touch-action:manipulation">KHAI ' + tm.khai + '</button>';
        html += '</div></div>';
      });
      // Win probability bar from server odds
      const totalLagai = srvMW.bat_lagai + srvMW.bowl_lagai;
      const pctBat = Math.min(95, Math.max(5, Math.round((1 - srvMW.bat_lagai / totalLagai) * 100)));
      html += '<div style="margin-top:10px"><div style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:4px">WIN PROBABILITY</div>';
      html += '<div style="display:flex;height:20px;border-radius:4px;overflow:hidden">';
      html += '<div style="width:'+pctBat+'%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff">' + (srvMW.bat_team||teamA).slice(0,8) + ' ' + pctBat + '%</div>';
      html += '<div style="width:'+(100-pctBat)+'%;background:#ef4444;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff">' + (srvMW.bowl_team||teamB).slice(0,8) + ' ' + (100-pctBat) + '%</div>';
      html += '</div></div>';
    } else {
      [{ name: teamA, odds: mw.teamA, isFav: fav===teamA }, { name: teamB, odds: mw.teamB, isFav: fav===teamB }].forEach(tm => {
        const safeName = tm.name.replace(/'/g, "\\'");
        html += '<div style="padding:10px;background:#1e293b;border-radius:8px;margin-bottom:6px">';
        html += '<div style="font-weight:800;font-size:13px;color:#fff;margin-bottom:6px">' + (tm.isFav?'\u2605 ':'') + tm.name + (tm.isFav?' <span style="color:#f59e0b;font-size:10px">(FAV)</span>':'') + '</div>';
        html += '<div style="display:flex;gap:6px">';
        html += '<button onclick="placeBet(\'' + safeName + '\',\'lagai\',' + tm.odds.lagai + ',\'match_winner\')" style="flex:1;padding:10px;border-radius:6px;font-weight:900;font-size:14px;background:#14532d;border:1px solid #22c55e44;color:#22c55e;cursor:pointer;touch-action:manipulation">LAGAI ' + tm.odds.lagai + '</button>';
        html += '<button onclick="placeBet(\'' + safeName + '\',\'khai\',' + tm.odds.khai + ',\'match_winner\')" style="flex:1;padding:10px;border-radius:6px;font-weight:900;font-size:14px;background:#450a0a;border:1px solid #ef444444;color:#fca5a5;cursor:pointer;touch-action:manipulation">KHAI ' + tm.odds.khai + '</button>';
        html += '</div></div>';
      });
      const totalBhav = (mw.teamA.lagai||1) + (mw.teamB.lagai||1);
      const pctA = Math.round((1 - mw.teamA.lagai / totalBhav) * 100);
      html += '<div style="margin-top:10px"><div style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:4px">WIN PROBABILITY</div>';
      html += '<div style="display:flex;height:20px;border-radius:4px;overflow:hidden">';
      html += '<div style="width:'+pctA+'%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff">' + teamA + ' ' + pctA + '%</div>';
      html += '<div style="width:'+(100-pctA)+'%;background:#ef4444;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff">' + teamB + ' ' + (100-pctA) + '%</div>';
      html += '</div></div>';
    }
  } else if (tab === 'history') {
    html += '<div style="color:#64748b;font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:6px">ODDS HISTORY</div>';
    const hist = market.oddsHistory || [];
    if (hist.length === 0) { html += '<div style="text-align:center;color:#475569;padding:20px">No history yet. Score a ball to see odds movement.</div>'; }
    else {
      html += '<table style="width:100%;border-collapse:collapse;font-size:11px">';
      html += '<tr style="color:#64748b;font-size:9px"><th style="text-align:left;padding:4px">Ball</th><th>Score</th><th>Fav</th><th style="color:#22c55e">YES</th><th style="color:#fca5a5">NO</th></tr>';
      hist.slice(0, 20).forEach(h => {
        html += '<tr style="border-top:1px solid #1e293b"><td style="padding:4px;color:#94a3b8">' + h.ball + '</td><td style="text-align:center;color:#fff;font-weight:700">' + h.score + '</td><td style="text-align:center;color:#f59e0b;font-size:10px">' + (h.favTeam||'').slice(0,6) + '</td><td style="text-align:center;color:#22c55e;font-weight:700">' + h.lagai + '</td><td style="text-align:center;color:#fca5a5;font-weight:700">' + h.khai + '</td></tr>';
      });
      html += '</table>';
    }
  }
  html += '</div>';

  const userBets = market.bets.filter(b => b.user === user);
  const activeBets = userBets.filter(b => b.status === 'pending');
  const settledBets = userBets.filter(b => b.status !== 'pending').slice(-10).reverse();

  if (activeBets.length > 0) {
    html += '<div style="background:#0a1222;padding:8px 12px"><div style="color:#64748b;font-size:10px;font-weight:700;margin-bottom:4px">YOUR BETS (' + activeBets.length + ' active)</div>';
    activeBets.forEach(b => {
      const col = b.side === 'lagai' ? '#22c55e' : '#fca5a5';
      html += '<div style="padding:6px 8px;background:#1e293b;border-radius:6px;margin-bottom:4px;border-left:3px solid ' + col + '">';
      html += '<span style="color:' + col + ';font-weight:800;font-size:11px">' + (b.side==='lagai'?'YES':'NO') + ' ' + b.prediction.toUpperCase() + ' @ ' + b.bhav + '</span>';
      html += '<span style="color:#64748b;font-size:10px;float:right">Risk: ' + b.liability + ' | Win: ' + b.potentialWin + '</span></div>';
    });
    html += '</div>';
  }
  if (settledBets.length > 0) {
    html += '<div style="background:#0a1222;padding:8px 12px"><div style="color:#64748b;font-size:10px;font-weight:700;margin-bottom:6px">BET HISTORY</div>';
    settledBets.forEach(b => {
      const won = b.status === 'won';
      html += '<div style="padding:8px 10px;margin-bottom:4px;border-radius:8px;border-left:4px solid ' + (won?'#22c55e':'#ef4444') + ';background:' + (won?'rgba(20,83,45,0.3)':'rgba(127,29,29,0.3)') + '">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center">';
      html += '<span style="font-size:12px;font-weight:700;color:' + (won?'#22c55e':'#fca5a5') + '">' + (won?'\u2705 WON':'\u274C LOST') + '</span>';
      html += '<span style="font-size:14px;font-weight:900;color:' + (won?'#22c55e':'#ef4444') + '">' + (won?'+'+b.potentialWin:'-'+b.liability) + ' pts</span>';
      html += '</div>';
      html += '<div style="font-size:10px;color:#94a3b8;margin-top:2px">' + (b.side==='lagai'?'YES':'NO') + ' ' + b.prediction.toUpperCase() + ' @ ' + b.bhav + ' \u2022 Stake: ' + b.amount + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  const wallets = getWallets();
  const lb = market.players.map(p => ({ name: p, pts: wallets[p]?.points || 0 })).sort((a,b) => b.pts - a.pts);
  if (lb.length > 0) {
    html += '<div style="background:#0a1222;padding:8px 12px"><div style="color:#64748b;font-size:10px;font-weight:700;margin-bottom:4px">LEADERBOARD</div>';
    lb.forEach((p, i) => {
      const medal = ['\u{1F947}','\u{1F948}','\u{1F949}'][i] || (i+1)+'.';
      html += '<div style="padding:4px 0;font-size:12px;display:flex;justify-content:space-between"><span style="color:#fff;font-weight:600">' + medal + ' ' + p.name + '</span><span style="color:#f59e0b;font-weight:800">' + p.pts + '</span></div>';
    });
    html += '</div>';
  }

  html += '<div style="text-align:center;padding:8px;background:#0a1222;border-radius:0 0 12px 12px;font-size:10px;color:#334155">Box Cricket Scorer</div>';

  return '<div class="mx-2 mt-2 no-print" style="border-radius:12px;overflow:hidden;border:1px solid #1e293b">' + html + '</div>';
}

function renderBettingLedger() {
  const wallets = getWallets();
  const players = Object.keys(wallets);
  if (players.length === 0) return '';

  const sorted = players.map(name => ({
    name, pts: wallets[name].points || 0,
    won: wallets[name].totalWon || 0,
    lost: wallets[name].totalLost || 0,
    matches: wallets[name].matchesPlayed || 0
  })).sort((a, b) => b.pts - a.pts);

  let html = '<div class="mx-4 mb-3">';
  html += '<div class="card rounded-xl overflow-hidden">';
  html += '<div style="background:linear-gradient(135deg,#0f1729,#1e293b);padding:12px 14px;display:flex;justify-content:space-between;align-items:center">';
  html += '<span style="font-weight:900;font-size:14px;color:#f59e0b">\u{1F4B0} Betting Ledger</span>';
  html += '<span style="font-size:10px;color:#64748b">' + players.length + ' players</span>';
  html += '</div>';

  html += '<table style="width:100%;font-size:12px;border-collapse:collapse">';
  html += '<tr style="background:var(--bg);font-size:10px;color:var(--text2);font-weight:700"><td style="padding:6px 10px">#</td><td>Player</td><td style="text-align:right">Balance</td><td style="text-align:right">Won</td><td style="text-align:right">Lost</td><td style="text-align:right;padding-right:10px">P/L</td></tr>';

  sorted.forEach((p, i) => {
    const pl = p.won - p.lost;
    const medal = i === 0 ? '\u{1F947}' : i === 1 ? '\u{1F948}' : i === 2 ? '\u{1F949}' : (i + 1);
    html += '<tr style="border-top:1px solid var(--border)">';
    html += '<td style="padding:8px 10px;font-size:13px">' + medal + '</td>';
    html += '<td style="font-weight:700;color:var(--text)">' + p.name + '</td>';
    html += '<td style="text-align:right;font-weight:800;color:#f59e0b">' + p.pts + '</td>';
    html += '<td style="text-align:right;color:#22c55e;font-size:11px">+' + p.won + '</td>';
    html += '<td style="text-align:right;color:#ef4444;font-size:11px">-' + p.lost + '</td>';
    html += '<td style="text-align:right;font-weight:800;padding-right:10px;color:' + (pl >= 0 ? '#22c55e' : '#ef4444') + '">' + (pl >= 0 ? '+' : '') + pl + '</td>';
    html += '</tr>';
  });

  html += '</table>';
  html += '<div style="padding:8px 14px;text-align:center;border-top:1px solid var(--border)">';
  html += '<button onclick="if(confirm(\'Reset all wallets to 1000?\')){ localStorage.removeItem(\'cricket_wallets\'); location.reload(); }" style="font-size:10px;color:var(--text2);background:none;border:none;cursor:pointer;text-decoration:underline">Reset All Wallets</button>';
  html += '</div>';
  html += '</div></div>';
  return html;
}

function renderPlayerMasterSheet() {
  const wallets = getWallets();
  const players = Object.keys(wallets);
  if (players.length === 0) return '';

  let html = '<div class="mx-4 mt-3 card rounded-xl overflow-hidden">';
  html += '<div style="background:linear-gradient(135deg,#0f1729,#1e293b);padding:12px 14px">';
  html += '<span style="font-weight:900;font-size:14px;color:#22c55e">\u{1F4CA} Master Sheet</span>';
  html += '</div>';
  html += '<table style="width:100%;font-size:11px;border-collapse:collapse">';
  html += '<tr style="background:var(--bg);font-size:9px;color:var(--text2);font-weight:700"><td style="padding:6px 8px">Player</td><td style="text-align:center">Pts</td><td style="text-align:center">Won</td><td style="text-align:center">Lost</td><td style="text-align:center">Net</td><td style="text-align:center">Win%</td></tr>';

  const sorted = players.map(name => {
    const w = wallets[name];
    const totalBets = (w.totalWon || 0) + (w.totalLost || 0);
    const winPct = totalBets > 0 ? Math.round((w.totalWon || 0) / totalBets * 100) : 0;
    return { name, pts: w.points || 0, won: w.totalWon || 0, lost: w.totalLost || 0, net: (w.totalWon || 0) - (w.totalLost || 0), winPct };
  }).sort((a, b) => b.net - a.net);

  sorted.forEach(p => {
    html += '<tr style="border-top:1px solid var(--border)">';
    html += '<td style="padding:6px 8px;font-weight:700;color:var(--text)">' + p.name + '</td>';
    html += '<td style="text-align:center;color:#f59e0b;font-weight:800">' + p.pts + '</td>';
    html += '<td style="text-align:center;color:#22c55e">+' + p.won + '</td>';
    html += '<td style="text-align:center;color:#ef4444">-' + p.lost + '</td>';
    html += '<td style="text-align:center;font-weight:800;color:' + (p.net >= 0 ? '#22c55e' : '#ef4444') + '">' + (p.net >= 0 ? '+' : '') + p.net + '</td>';
    html += '<td style="text-align:center;font-weight:700;color:' + (p.winPct >= 50 ? '#22c55e' : '#f59e0b') + '">' + p.winPct + '%</td>';
    html += '</tr>';
  });

  html += '</table></div>';
  return html;
}

function showJoinMatchModal() {
  let modal = document.getElementById('modal-join');
  if (!modal) { modal = document.createElement('div'); modal.id='modal-join'; modal.className='modal-overlay modal-center'; document.body.appendChild(modal); }
  modal.innerHTML = `<div class="modal-content" style="max-width:320px;padding:24px">
    <h3 style="font-weight:900;font-size:18px;margin:0 0 4px;text-align:center">\u{1F3DF} Join Match</h3>
    <p style="text-align:center;font-size:12px;color:var(--text2);margin-bottom:16px">Enter the 4-digit invite code</p>
    <input id="join-code-input" type="text" maxlength="4" placeholder="0000" inputmode="numeric" pattern="[0-9]*"
      style="width:100%;padding:16px;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:28px;font-weight:900;text-align:center;letter-spacing:12px;outline:none" />
    <div id="join-error" style="color:#ef4444;font-size:12px;text-align:center;margin-top:6px;display:none"></div>
    <button onclick="doJoinMatch()" class="w-full mt-3 py-3 rounded-xl bg-cricket-600 text-white font-bold text-base" style="touch-action:manipulation">Join</button>
    <button onclick="hideModal('modal-join')" class="w-full mt-2 py-2 rounded-lg text-sm" style="color:var(--text2)">Cancel</button>
  </div>`;
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('join-code-input')?.focus(), 100);
}

async function doJoinMatch() {
  const code = (document.getElementById('join-code-input')?.value || '').trim();
  if (!code || code.length !== 4) {
    document.getElementById('join-error').textContent = 'Enter a 4-digit code';
    document.getElementById('join-error').style.display = 'block';
    return;
  }
  try {
    const res = await apiCall('join_by_code', { invite_code: code });
    if (res.error) {
      document.getElementById('join-error').textContent = res.error;
      document.getElementById('join-error').style.display = 'block';
      return;
    }
    localStorage.setItem('cricket_access_' + res.match_id, res.access_level || 'full');
    hideModal('modal-join');
    if (res.status === 'live') navigate('live/' + res.match_id);
    else if (res.status === 'completed') navigate('summary/' + res.match_id);
    else navigate('home');
    showToast('Joined: ' + (res.team_a || '') + ' vs ' + (res.team_b || ''));
  } catch(e) {
    document.getElementById('join-error').textContent = 'Network error. Try again.';
    document.getElementById('join-error').style.display = 'block';
  }
}

  if(_liveViewPollId) { clearInterval(_liveViewPollId); _liveViewPollId = null; }
  if(_lvWatchPollTimer) { clearTimeout(_lvWatchPollTimer); _lvWatchPollTimer = null; }
  _lvStreamActive = false;
}

function _lvTab(tab) {
  _liveViewTab = tab;
  // Auto-load AI panel when switching to betting tab
  if(tab === 'bet') {
    const matchId = (window.route || {}).id;
    if(matchId) {
      if(!_loadAICacheIfFresh(matchId)) {
        // Load cached from n8n if available, don't auto-trigger (user can click Analyse)
        apiCall('get_ai_odds', {match_id: matchId}).then(res => {
          if(res.ai && res.ai_fresh) _renderAIPanel(res.ai, matchId);
        }).catch(()=>{});
      }
    }
  }
  ['lv-tab-live','lv-tab-scorecard','lv-tab-commentary','lv-tab-bet'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const active = id === 'lv-tab-' + tab;
    el.style.borderBottom = active ? '2px solid #d0021b' : '2px solid transparent';
    el.style.color = active ? '#d0021b' : 'var(--text2)';

  });
  ['lv-pane-live','lv-pane-scorecard','lv-pane-commentary','lv-pane-bet'].forEach(id => {

}

async function renderLiveView(matchId) {
  stopLiveViewPolling();
  _liveViewTab = 'live';
  _liveViewScInn = 1;
  state.matchId = matchId;
  const app = document.getElementById('app');
  app.innerHTML = '<div class="flex items-center justify-center py-16" style="color:var(--text2)"><div class="text-center"><div class="text-3xl mb-3">⏳</div><div>Loading match…</div></div></div>';
  async function refreshView() {
    try {
      const listRes = await apiCall('list_matches');
      let _m = (listRes.matches || []).find(x => x.match_id === matchId);
      if (!_m) {
        app.innerHTML = '<div style="text-align:center;padding:60px 20px"><div style="font-size:40px;margin-bottom:12px">🏏</div><div style="color:var(--text2)">Match not found</div></div>';
        return;
      }
      const stateRes = await apiCall('get_state', {match_id: matchId}).catch(() => ({}));
      stateRes._scorecard = [];
      stateRes._timeline = [];
      // fetch scorecard + timeline in parallel then render
      const [scR, tlR] = await Promise.all([
        apiCall('get_scorecard', {match_id: matchId}).catch(()=>({})),
        apiCall('get_timeline', {match_id: matchId}).catch(()=>({}))
      ]);
      stateRes._scorecard = scR.innings || [];
      stateRes._timeline = tlR.timeline || [];
      try {
        _drawLiveView(_m, stateRes);
      } catch(drawErr) {
        app.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#ef4444"><div style="font-size:28px;margin-bottom:8px">⚠️</div><div>Render error: ' + (drawErr.message||'unknown') + '</div></div>';
        return;
      }
    } catch(e) {
      const _mid = matchId;
      app.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#ef4444"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="margin-bottom:8px">${e.message||'Network error'}</div><button onclick="renderLiveView('${_mid}')" style="margin-top:8px;padding:10px 24px;background:#d0021b;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">Retry</button></div>`;
    }
  }
  // Reset live watch state for this match
  _lvStreamActive = false;
  if(_lvWatchPollTimer) { clearTimeout(_lvWatchPollTimer); _lvWatchPollTimer = null; }

  await refreshView();

  // Scorer needs 2s updates; viewers need only 5s — reduces n8n load 60%
  const _pollRate = localStorage.getItem('cricket_access_' + matchId) === 'full' ? 2000 : 5000;
  _liveViewPollId = setInterval(refreshView, _pollRate);

  // Persistent live-watch poll — runs once, keeps checking, survives DOM rebuilds
  (function _lvWatchLoop(mid) {
    if(_liveViewPollId === null) return; // view was navigated away
    apiCall('get_live', {match_id: mid}).then(data => {
      _lvStreamActive = !!(data && data.active);
      const btn = document.getElementById('lv-watch-live-btn');
      const connecting = document.getElementById('lv-watch-live-connecting');
      if(btn) btn.style.display = _lvStreamActive ? 'block' : 'none';
      if(connecting) connecting.style.display = _lvStreamActive ? 'none' : 'block';
      if(connecting && !_lvStreamActive) connecting.textContent = '\uD83D\uDCE1 No live stream yet';
      _lvWatchPollTimer = setTimeout(() => _lvWatchLoop(mid), 6000);
    }).catch(() => {
      const connecting = document.getElementById('lv-watch-live-connecting');
      if(connecting) connecting.textContent = '\uD83D\uDCE1 Checking\u2026 (slow network)';
      _lvWatchPollTimer = setTimeout(() => _lvWatchLoop(mid), 8000);
    });
  })(matchId);
}

function _drawLiveView(m, st) {

  const _creatorProfile = _getUserProfile();

  if ((_isCreator || _isAdmin()) && isLive) localStorage.setItem('cricket_access_' + m.match_id, 'full');
  const hasFullAccess = localStorage.getItem('cricket_access_' + m.match_id) === 'full';
  const s = st.score || {};
  const i1 = m.inn1, i2 = m.inn2;
  const batFirst = m.batting_first || m.team_a;

  const _liveScore = st.score || {};

  const _useInn2 = i2 || (st.innings === 2 && _liveScore.runs !== undefined ? {runs:_liveScore.runs, wickets:_liveScore.wickets, balls:_liveScore.balls} : null);
  const s1runs = _useInn1 ? _useInn1.runs+'/'+_useInn1.wickets : '–';
  const s1ov = _useInn1 ? '('+formatOvers(_useInn1.balls)+' ov)' : '';
  const s2runs = _useInn2 ? _useInn2.runs+'/'+_useInn2.wickets : '–';
  const s2ov = _useInn2 ? '('+formatOvers(_useInn2.balls)+' ov)' : '';
  const needRuns = _useInn2 && _useInn1 ? _useInn1.runs+1-_useInn2.runs : 0;
  const ballsLeft = _useInn2 ? m.overs*6-_useInn2.balls : 0;
  const crr = s.balls > 0 ? (s.runs/(s.balls/6)).toFixed(2) : '0.00';
  const rrr = i2 && ballsLeft > 0 ? (needRuns/(ballsLeft/6)).toFixed(2) : '–';

  // current over balls
  const overBalls = (st.current_over_balls || []);
  const ballDotsHtml = overBalls.map(b => {
    const isWkt=b.is_wicket,isWide=b.extra_type==='wide',isNB=b.extra_type==='no_ball';

  }).join('');

  const batsmen = (st.battingCard || st.batting || []).filter(b=>b.is_batting || b.is_on_strike || b.is_batting===undefined);
  const _bowlerRaw = st.bowler || (st.bowlingCard||[]).find(b=>b.is_bowling) || (st.bowlingCard||[])[0] || null;
  const bowler = _bowlerRaw;
  const partnership = st.partnership || null;

  // win probability
  let probA=50,probB=50;

  // scorecard innings builder

/* ── AI BETTING ANALYSIS ────────────────────────────── */
async function _triggerAIAnalysis(matchId) {
  const btn = document.getElementById('lv-ai-refresh-btn');
  const body = document.getElementById('lv-ai-body');
  if(btn) { btn.textContent = '⏳'; btn.disabled = true; }
  if(body) body.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:12px;text-align:center;padding:12px 0">Analysing with Claude AI…</div>';

  try {
    // Get match context from n8n (analytics + current state)
    const res = await apiCall('get_ai_odds', {match_id: matchId});
    const ctx = res.context;
    if(!ctx) throw new Error('No match context');

    // Call AI sub-workflow (key is embedded server-side)
    const aiRes = await fetch('https://n8n.barandates.in/webhook/cricket-ai', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({match_id: matchId, context: ctx})
    });
    const data = await aiRes.json();

    if(data.analysis) {
      window._aiCache = window._aiCache || {};
      window._aiCache[matchId] = {...data.analysis, ts: Date.now()};
      _renderAIPanel(data.analysis, matchId);
    } else if(data.error) {
      if(body) body.innerHTML = `<div style="color:#f87171;font-size:11px;text-align:center;padding:8px 0">AI unavailable: ${data.error}<br><span style="color:rgba(255,255,255,0.3)">Add anthropic_key to credentials.json and redeploy</span></div>`;
    }
  } catch(e) {
    if(body) body.innerHTML = '<div style="color:#f87171;font-size:11px;text-align:center;padding:8px 0">AI analysis unavailable</div>';
  } finally {
    if(btn) { btn.textContent = '↻ Analyse'; btn.disabled = false; }
  }
}

function _renderAIPanel(ai, matchId) {
  const body = document.getElementById('lv-ai-body');
  if(!body) return;

  const momEmoji = {batting:'🔴', bowling:'🟢', neutral:'⚖️'};
  const momColor  = {batting:'#f87171', bowling:'#4ade80', neutral:'#facc15'};
  const mom = ai.momentum || 'neutral';
  const batPct  = Math.round((ai.win_prob?.bat || 0.5) * 100);
  const bowlPct = 100 - batPct;
  const batTeam  = ai.bat_team  || 'Batting';
  const bowlTeam = ai.bowl_team || 'Bowling';

  const factors = (ai.key_factors || []).map(f =>
    `<span style="background:rgba(255,255,255,0.09);border-radius:20px;padding:3px 10px;font-size:10px;color:rgba(255,255,255,0.75);font-weight:600;white-space:nowrap">${f}</span>`
  ).join('');

  const nextOver = ai.next_over
    ? `<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;margin-top:8px"><span style="color:rgba(255,255,255,0.4);font-size:9px;font-weight:700;text-transform:uppercase">Next Over · </span><span style="color:#fff;font-size:12px;font-weight:600">${ai.next_over.runs} runs · Wicket: ${ai.next_over.wicket}</span></div>`
    : '';

  const confidence = ai.confidence
    ? `<span style="color:rgba(255,255,255,0.3);font-size:9px;font-weight:600;text-transform:uppercase"> · ${ai.confidence} confidence</span>` : '';

  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <span style="font-size:18px">${momEmoji[mom]||'⚖️'}</span>
      <span style="color:${momColor[mom]||'#facc15'};font-size:13px;font-weight:800">${mom.charAt(0).toUpperCase()+mom.slice(1)} team has momentum</span>
    </div>
    <div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px">
        <span style="color:#4ade80">${batTeam} ${batPct}%</span>
        <span>${confidence}</span>
        <span style="color:#f87171">${bowlTeam} ${bowlPct}%</span>
      </div>
      <div style="height:8px;border-radius:4px;background:rgba(248,113,113,0.3);overflow:hidden">
        <div style="height:100%;width:${batPct}%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:4px;transition:width 0.6s ease"></div>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">${factors}</div>
    ${nextOver}
    ${ai.narrative ? `<div style="color:rgba(255,255,255,0.45);font-size:11px;font-style:italic;margin-top:8px;line-height:1.5">"${ai.narrative}"</div>` : ''}
    <div style="margin-top:8px;color:rgba(255,255,255,0.12);font-size:9px">Powered by Claude AI (claude-haiku)</div>
  `;

  // Update age badge
  const ageEl = document.getElementById('lv-ai-age');
  if(ageEl && ai.ts) {
    const mins = Math.max(0, Math.floor((Date.now()-ai.ts)/60000));
    ageEl.textContent = mins > 0 ? `${mins}m ago` : 'just now';
  }
}

function _loadAICacheIfFresh(matchId) {
  const c = (window._aiCache||{})[matchId];
  if(!c) return false;
  const age = Date.now() - (c.ts || 0);
  if(age > 300000) return false; // stale after 5 min
  _renderAIPanel(c, matchId);
  return true;
}

function _urlB64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: _urlB64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    // Send subscription to n8n to store
    await apiCall('save_push_subscription', { subscription: JSON.stringify(sub) }).catch(() => {});
    localStorage.setItem('push_registered', '1');
  } catch(e) { /* permission denied or unsupported */ }
}

function _showPushPrompt() {
  if (localStorage.getItem('push_prompt_shown')) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if (Notification.permission === 'granted') { registerPush(); return; }

  const overlay = document.createElement('div');
  overlay.id = 'push-prompt-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s';

async function _allowPush() {
  const overlay = document.getElementById('push-prompt-overlay');

}

function _dismissPush() {

navigator.serviceWorker?.addEventListener('message', e => {

function isSpectatorMode() {
  if (!state.matchId) return false;
  return localStorage.getItem('cricket_access_' + state.matchId) === 'spectator';
}

let _livePollingId = null;
let _lastScoreHash = '';

function startLivePolling() {
  stopLivePolling();
  _livePollingId = setInterval(async () => {
    if(!state.matchId) return;
    const route = getRoute();
    if(route.page !== 'scoring') { stopLivePolling(); return; }
    if(isAnyModalOpen() || state.pendingRequest) return;
    try {
      const res = await apiCall('get_state', {match_id: state.matchId});
      if(res.error) return;
      const hash = `${res.score?.runs}-${res.score?.wickets}-${res.score?.balls}`;
      if(hash !== _lastScoreHash) {
        _lastScoreHash = hash;
        Object.assign(state, res);
        state.matchId = state.matchId; // preserve
        drawScoring();
        if(navigator.vibrate) navigator.vibrate(100);
      }
    } catch(e) { /* silent fail on poll */ }
  }, 4000); // poll every 4 seconds
}

function stopLivePolling() {
  if(_livePollingId) { clearInterval(_livePollingId); _livePollingId = null; }
  _lastScoreHash = '';
}

document.addEventListener('keydown', e => {
  if (!state.matchId || isAnyModalOpen()) return;
  const page = getRoute().page;
  if (page !== 'scoring') return;
  if (state._scoringMode === 'market') return; // no shortcuts in market
  const key = e.key;
  if (key >= '0' && key <= '6' && key !== '5') { e.preventDefault(); scoreBall(parseInt(key)); }
  else if (key === 'w' || key === 'W') { e.preventDefault(); showWicketModal(); }
  else if (key === 'u' || key === 'U') { e.preventDefault(); undoLastBall(); }
  else if (key === 's' || key === 'S') { e.preventDefault(); swapStrike(); }
});

// ── Source / UTM tracking (runs on every page load) ─────────────────────────
(function _trackSource() {
  if(localStorage.getItem('_usr_src')) return; // already recorded on first visit
  const p = new URLSearchParams(location.search);
  let src = p.get('utm_source') || p.get('src') || '';
  if(!src) {
    const ref = document.referrer;
    if(ref.includes('instagram')) src = 'instagram';
    else if(ref.includes('whatsapp')) src = 'whatsapp';
    else if(ref.includes('google')) src = 'google';
    else if(ref) src = 'referral';
    else src = 'direct';
  }
  localStorage.setItem('_usr_src', src);
  localStorage.setItem('_usr_land', new Date().toISOString().split('T')[0]);
})();

async function downloadVisitorsCSV() {
  showToast('Fetching visitor data…');
  const vRes = await apiCall('get_visitors', {}).catch(()=>null);
  const visits = (vRes && vRes.visitors) || [];
  if(!visits.length) { showToast('No visitor data yet'); return; }
  const rows = [['Time','User','Device','Page']];
  visits.forEach(v => {
    const dt = new Date(v.ts||0).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
    rows.push([dt, v.user||'Guest', v.device||'', (v.page||'').replace('/',' > ')]);
  });
  const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'box-cricket-visitors.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('Downloaded ' + visits.length + ' visits ✔');
}

        ['How do I fix a wrong score?', 'Tap ↩ Undo to remove the last ball. For bigger corrections use ··· → Set Score (mid-match) to override runs, wickets and overs directly.'],
        ['Why does it say "No striker found"?', 'The app lost track of who is on strike — usually after a undo or mid-match start. A picker will appear to select the correct batsman.'],
        ['Can two people score the same match?', 'Yes — only one should be the active scorer (with the access code). Others can watch live via the scorecard link.'],
        ['How do I share the live score?', 'Tap 💬 Share on a match card to send the WhatsApp link. Anyone with the link can watch the score in real time.'],
        ['How does the betting work?', 'Open the Betting tab while a match is live. Place bets on next ball outcome, over runs, innings total, or match winner. Each player starts with 1000 points. Bets settle automatically.'],
        ['What is Lagai / Khai?', 'Lagai = backing YES (you think it will happen). Khai = backing NO (you think it won\'t happen). Khai has higher liability but also higher payout.'],
        ['How do I add a player not in the list?', 'Type their name in the "New bowler / New batsman" field in the picker and tap Add.'],
        ['Can I resume scoring after closing the app?', 'Yes — open the app, go to the match, tap ▶ Score. It restores from where you left off. If the over count is wrong, use Set Score to fix it.'],
        ['My highlights are not showing?', 'Highlights are saved to Firebase. Ensure you are logged in (phone OTP) and the camera was on when the 4/6/wicket was scored.'],
      ].map(([q, a]) => `
        <div style="background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border)">
          <div style="font-weight:800;font-size:13px;color:var(--text);margin-bottom:5px">Q: ${q}</div>
          <div style="font-size:13px;color:var(--text2);line-height:1.5">A: ${a}</div>
        </div>`).join('')}
    </div>`;
  document.body.appendChild(el);
}

function _helpTab(tab) {
  document.getElementById('help-pane-guide').style.display = tab==='guide' ? 'block' : 'none';
  document.getElementById('help-pane-faq').style.display  = tab==='faq'   ? 'block' : 'none';
  document.getElementById('help-tab-guide').style.cssText += tab==='guide' ? ';border-bottom:2px solid #d0021b;color:#d0021b;font-weight:800' : ';border-bottom:2px solid transparent;color:var(--text2);font-weight:600';
  document.getElementById('help-tab-faq').style.cssText   += tab==='faq'   ? ';border-bottom:2px solid #d0021b;color:#d0021b;font-weight:800' : ';border-bottom:2px solid transparent;color:var(--text2);font-weight:600';
}
</script>

<!-- More Options Sheet (hidden by default) -->
<div id="cb-more-sheet" style="display:none;position:fixed;inset:0;z-index:200" onclick="if(event.target===this)this.style.display='none'">
  <div style="position:absolute;bottom:0;left:0;right:0;background:var(--bg-card);border-radius:20px 20px 0 0;padding:12px 0 40px;box-shadow:0 -4px 30px rgba(0,0,0,0.15)">
    <div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px"></div>
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:2px">
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';navigate('quick-setup')" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#d0021b;display:flex;align-items:center;justify-content:center;font-size:20px">⚡</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Quick Match</div><div style="font-size:12px;color:var(--text2)">Start fast — add players as you go</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';navigate('setup')" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:20px">📋</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">New Match</div><div style="font-size:12px;color:var(--text2)">Full setup with teams & rules</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';navigate('team-draft')" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#16a34a;display:flex;align-items:center;justify-content:center;font-size:20px">🏆</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Play Series</div><div style="font-size:12px;color:var(--text2)">Draft teams & play multiple matches</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';showJoinMatchModal()" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:20px">🏟</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Join Match</div><div style="font-size:12px;color:var(--text2)">Enter invite code to watch & bet</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';navigate('score-only')" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:20px">🎯</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Score Only</div><div style="font-size:12px;color:var(--text2)">Just track runs, no player names</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';navigate('toss-only')" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#0ea5e9;display:flex;align-items:center;justify-content:center;font-size:20px">🪙</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Quick Toss</div><div style="font-size:12px;color:var(--text2)">Flip a coin — heads or tails</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';navigate('highlights')" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:20px">🎬</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Match Highlights</div><div style="font-size:12px;color:var(--text2)">Browse clips from all past matches</div></div>
      </button>
      <div style="border-top:1px solid var(--border);margin:8px 0"></div>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';showHelpModal()" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:#0ea5e9;display:flex;align-items:center;justify-content:center;font-size:20px">❓</span>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">Help & Guide</div><div style="font-size:12px;color:var(--text2)">How to score, FAQ, tips</div></div>
      </button>
      <button onclick="document.getElementById('cb-more-sheet').style.display='none';toggleTheme()" style="display:flex;align-items:center;gap:14px;padding:14px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:10px;touch-action:manipulation">
        <span style="width:40px;height:40px;border-radius:12px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:20px">🌙</span>
        <div style="font-weight:700;font-size:15px;color:var(--text)">Toggle Dark Mode</div>
      </button>
    </div>
  </div>
</div>

<script>
// Pre-warm speech voices (required on iOS — getVoices() returns [] until this fires)
if(window.speechSynthesis) {
  window._cachedVoices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { window._cachedVoices = speechSynthesis.getVoices(); };
}
</script>

  <button id="tab-more" onclick="_setTab('tab-more');document.getElementById('cb-more-sheet').style.display='flex'" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;touch-action:manipulation;color:var(--text2);padding:0">
