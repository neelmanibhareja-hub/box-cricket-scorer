<script>
// ===== CONFIG =====
const WEBHOOK_URL = 'https://n8n.barandates.in/webhook/cricket';

// ===== OFFLINE QUEUE (IndexedDB) =====
const _offlineQueue = {
  dbName: 'cricket_offline', storeName: 'queue',
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(this.storeName, { autoIncrement: true });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async enqueue(action, data) {
    const db = await this.open();
    const tx = db.transaction(this.storeName, 'readwrite');
    tx.objectStore(this.storeName).add({ action, data, timestamp: Date.now() });
    return new Promise(r => { tx.oncomplete = r; });
  },
  async dequeueAll() {
    const db = await this.open();
    const tx = db.transaction(this.storeName, 'readwrite');
    const store = tx.objectStore(this.storeName);
    const items = await new Promise(r => { const req = store.getAll(); req.onsuccess = () => r(req.result); });
    store.clear();
    return items;
  }
};

const _writeActions = ['record_ball', 'create_match', 'set_toss', 'start_innings', 'set_bowler', 'swap_strike', 'undo_ball', 'add_player', 'rename_player', 'set_avatar', 'delete_match'];

async function apiCall(action, data = {}) {
  if (!navigator.onLine) {
    if (_writeActions.includes(action)) {
      await _offlineQueue.enqueue(action, data);
      showToast('Saved offline \u2014 will sync when connected');
      return { status: 'queued_offline' };
    }
    throw new Error('You are offline');
  }
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, ...data})
    });
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { return {error: text}; }
  } catch(e) { throw new Error('Network error: ' + e.message); }
}

// ===== OFFLINE/ONLINE HANDLERS =====
function _showOfflineBanner(show) {
  let banner = document.getElementById('offline-banner');
  if (show && !banner) {
    banner = document.createElement('div');
    banner.id = 'offline-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:400;background:#f59e0b;color:#000;text-align:center;padding:6px;font-size:12px;font-weight:700';
    banner.textContent = 'You are offline \u2014 changes will sync when connected';
    document.body.prepend(banner);
  } else if (!show && banner) {
    banner.remove();
  }
}

window.addEventListener('offline', () => _showOfflineBanner(true));
window.addEventListener('online', async () => {
  _showOfflineBanner(false);
  const items = await _offlineQueue.dequeueAll();
  if (items.length === 0) return;
  showToast('Back online \u2014 syncing ' + items.length + ' action' + (items.length > 1 ? 's' : '') + '...');
  for (const item of items) {
    try { await apiCall(item.action, item.data); } catch(e) { /* skip failed */ }
  }
  showToast('Sync complete!');
  // Refresh current view
  const {page} = getRoute();
  if (page === 'scoring' && state.matchId) refreshScoring();
  else if (page === 'home') renderHome();
});

if (!navigator.onLine) _showOfflineBanner(true);

// ===== STATE =====
let state = {
  matchId: null, match: null, innings: 1,
  score: {runs:0, wickets:0, balls:0, extras:0},
  target: null, onStrike: null, nonStriker: null, bowler: null,
  thisOver: [], battingCard: [], bowlingCard: [], isFreeHit: false,
  availableBatsmen: [], availableBowlers: [],
  allMatches: [], pendingRequest: false,
  battingTeam: '', bowlingTeam: '', _activeTab: 'batting'
};

// ===== UTILS =====
const formatOvers = b => Math.floor(b/6)+'.'+b%6;
const calcRR = (r,b) => b>0 ? ((r/b)*6).toFixed(2) : '0.00';
const calcReqRR = (t,r,bl) => bl<=0 ? '-' : (((t-r)/bl)*6).toFixed(2);
const calcSR = (r,b) => b>0 ? ((r/b)*100).toFixed(1) : '0.0';
const calcEcon = (r,b) => b>0 ? ((r/b)*6).toFixed(1) : '0.0';

function ballSymbol(b) {
  if(b.isWicket) return 'W';
  if(b.extrasType==='wide') return b.extrasRuns>1?b.extrasRuns+'wd':'wd';
  if(b.extrasType==='noball') return (b.runs+b.extrasRuns)+'nb';
  if(b.extrasType==='bye') return b.extrasRuns+'b';
  if(b.extrasType==='legbye') return b.extrasRuns+'lb';
  if(b.runs===0) return '\u2022';
  return String(b.runs);
}

function ballClass(b) {
  if(b.isWicket) return 'ball-wicket';
  if(b.extrasType && b.extrasType!=='none') return 'ball-extra';
  if(b.runs===6) return 'ball-six';
  if(b.runs>=4) return 'ball-boundary';
  if(b.runs===0) return 'ball-dot';
  return 'ball-run';
}

// ===== DARK MODE =====
function initTheme() {
  const s = localStorage.getItem('cricket-theme');
  if(s==='dark'||(!s && window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.classList.add('dark');
}
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('cricket-theme', document.documentElement.classList.contains('dark')?'dark':'light');
}
initTheme();

// Pre-load default teams if none saved
if(!localStorage.getItem('cricket_teams')) {
  localStorage.setItem('cricket_teams', JSON.stringify([
    {name:'Team 1', players:['SS','MD','VG','Unnat','RK','RK2','AJ2','KS','Kartik'], savedAt: Date.now()},
    {name:'Team 2', players:['KG','SG','Neel','AJ','Vats','DK','DV','VK','Rajeev J'], savedAt: Date.now()}
  ]));
}
// No default common player — user types it each time if needed

// ===== ROUTER =====
const app = document.getElementById('app');
function navigate(h) { window.location.hash = h; }
function getRoute() {
  const h = window.location.hash.slice(1)||'home';
  const p = h.split('/');
  return {page:p[0], params:p.slice(1)};
}
function route() {
  stopAutoSync();
  stopCamera();
  const {page,params} = getRoute();
  const routes = {
    home: renderHome, setup: renderSetup,
    'quick-setup': renderQuickSetup,
    'score-only': renderScoreOnly,
    'team-draft': renderTeamDraft,
    players: renderPlayers,
    profile: ()=>renderProfile(params[0]),
    'toss-only': renderTossOnly,
    toss: ()=>renderToss(params[0]),
    openers: ()=>renderSelectOpeners(params[0]),
    scoring: ()=>renderScoring(params[0]),
    scorecard: ()=>renderScorecard(params[0]),
    timeline: ()=>renderTimeline(params[0]),
    summary: ()=>renderSummary(params[0]),
    series: ()=>renderSeries(params[0])
  };
  (routes[page]||renderHome)();
}
window.addEventListener('hashchange', route);

// ===== HOME =====
async function renderHome() {
  app.innerHTML = `<div class="flex-1 flex items-center justify-center"><div class="animate-pulse text-lg">Loading...</div></div>`;
  try {
    const res = await apiCall('list_matches');
    state.allMatches = res.matches || [];
  } catch(e) { state.allMatches = []; }

  const ms = state.allMatches.filter(m => !m.is_super_over);
  app.innerHTML = `
    <div class="flex items-center justify-between p-4 border-b" style="border-color:var(--border)">
      <h1 class="text-xl font-bold">\u{1F3CF} Box Cricket</h1>
      <div class="flex items-center gap-2">
        <button onclick="navigate('players')" class="px-3 py-1.5 rounded-full text-xs font-bold card active:scale-95" style="touch-action:manipulation">\u{1F464} Players</button>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center card">\u{1F319}</button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-3">
      ${ms.length===0?`<div class="text-center py-12" style="color:var(--text2)">
        <div class="text-5xl mb-4">\u{1F3CF}</div>
        <p class="text-lg font-medium">No matches yet</p>
        <p class="text-sm mt-1">Create your first box cricket match!</p>
      </div>`:''}
      ${ms.map(m=>`
        <div class="card rounded-xl p-4 active:scale-[0.98] transition-transform" style="touch-action:manipulation">
          <div class="flex justify-between items-start"
            onclick="${m.status==='live'?`navigate('scoring/${m.match_id}')`
              :m.status==='completed'?`navigate('summary/${m.match_id}')`
              :`navigate('toss/${m.match_id}')`}">
            <div>
              <div class="font-bold">${m.team_a} vs ${m.team_b}</div>
              <div class="text-sm mt-0.5" style="color:var(--text2)">${m.overs} overs \u2022 ${m.players_per_team || 6} per side</div>
            </div>
            <span class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0 ${
              m.status==='live'?'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300':
              m.status==='completed'?'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400':
              'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300'
            }">${m.status==='live'?'LIVE':m.status==='completed'?'DONE':'NEW'}</span>
          </div>
          <div class="flex justify-end gap-2 mt-2 pt-2 border-t" style="border-color:var(--border)">
            ${m.status==='created'?`<button onclick="event.stopPropagation();editMatch('${m.match_id}')"
              class="text-xs px-3 py-1.5 rounded-lg active:scale-95 text-blue-500 dark:text-blue-400" style="touch-action:manipulation">
              \u270F Edit
            </button>`:''}
            <button onclick="event.stopPropagation();deleteMatch('${m.match_id}','${m.team_a} vs ${m.team_b}')"
              class="text-xs px-3 py-1.5 rounded-lg active:scale-95 text-red-500 dark:text-red-400" style="touch-action:manipulation">
              \u{1F5D1} Delete
            </button>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="p-4 no-print space-y-2">
      <button onclick="navigate('setup')"
        class="w-full py-4 rounded-xl bg-cricket-600 hover:bg-cricket-700 text-white font-bold text-lg active:scale-[0.97] transition-all text-left px-5"
        style="touch-action:manipulation">
        <div class="flex items-center gap-3"><span class="text-2xl">+</span><div><div>New Match</div><div class="text-xs font-normal opacity-80 mt-0.5">Set up teams, players & rules before playing</div></div></div>
      </button>
      <button onclick="navigate('quick-setup')"
        class="w-full py-3 rounded-xl card font-bold text-base active:scale-[0.97] transition-all border-2 border-cricket-500 text-left px-5"
        style="touch-action:manipulation">
        <div class="flex items-center gap-3"><span class="text-xl">\u26A1</span><div><div>Quick Match</div><div class="text-xs font-normal mt-0.5" style="color:var(--text2)">Start fast \u2014 add players as you go</div></div></div>
      </button>
      <button onclick="navigate('team-draft')"
        class="w-full py-3 rounded-xl card font-bold text-base active:scale-[0.97] transition-all text-left px-5"
        style="touch-action:manipulation">
        <div class="flex items-center gap-3"><span class="text-xl">\u{1F465}</span><div><div>Pick Teams</div><div class="text-xs font-normal mt-0.5" style="color:var(--text2)">Draft players into 2 teams with coin toss</div></div></div>
      </button>

      </button>
      <button onclick="navigate('toss-only')"
        class="w-full py-3 rounded-xl card font-bold text-base active:scale-[0.97] transition-all text-left px-5"
        style="touch-action:manipulation">
        <div class="flex items-center gap-3"><span class="text-xl">\u{1FA99}</span><div><div>Quick Toss</div><div class="text-xs font-normal mt-0.5" style="color:var(--text2)">Flip a coin \u2014 no match needed</div></div></div>
      </button>

}

async function deleteMatch(matchId, label) {
  if(!confirm(`Delete "${label}"? This cannot be undone.`)) return;
  try {
    await apiCall('delete_match', {match_id: matchId});
  } catch(e) { /* ignore */ }
  renderHome();
}

async function editMatch(matchId) {
  try {
    const m = await apiCall('get_match', {match_id: matchId});
    if(!m || m.error) { alert('Could not load match'); return; }
    // Delete the old match then navigate to setup with pre-filled data
    await apiCall('delete_match', {match_id: matchId});
    // Store match data for setup to pick up
    localStorage.setItem('cricket_edit_match', JSON.stringify(m));
    navigate('setup');
  } catch(e) { alert('Error: ' + e.message); }
}

// ===== SAVED TEAMS =====
function getSavedTeams() { return JSON.parse(localStorage.getItem('cricket_teams')||'[]'); }
function saveTeam(name, players) {
  const teams = getSavedTeams().filter(t => t.name !== name);
  teams.unshift({name, players, savedAt: Date.now()});
  if(teams.length > 20) teams.length = 20;
  localStorage.setItem('cricket_teams', JSON.stringify(teams));
}
function deleteSavedTeam(name) {
  const teams = getSavedTeams().filter(t => t.name !== name);
  localStorage.setItem('cricket_teams', JSON.stringify(teams));
}
function loadTeamInto(side) {
  const teams = getSavedTeams();
  if(teams.length === 0) { alert('No saved teams yet. Teams are saved automatically when you create a match.'); return; }
  const el = document.getElementById('team-picker-list');
  el.innerHTML = teams.map(t =>
    `<div class="flex items-center justify-between p-3 rounded-lg mb-1 active:scale-95" style="background:var(--bg);touch-action:manipulation">
      <button onclick="applyTeam('${side}',${JSON.stringify(JSON.stringify(t))})" class="flex-1 text-left">
        <div class="font-medium">${t.name}</div>
        <div class="text-xs" style="color:var(--text2)">${t.players.join(', ')}</div>
      </button>
      <button onclick="event.stopPropagation();confirmDeleteTeam('${t.name}','${side}')" class="text-red-400 text-xs px-2 ml-2">\u2716</button>

  ).join('');
  document.getElementById('team-picker-side').textContent = side === 'A' ? 'Team A' : 'Team B';

  window._teamPickerSide = side;
}
function applyTeam(side, teamJson) {

  document.getElementById('inp-ppt').value = Math.max(4, Math.min(11, t.players.length));

  t.players.forEach((p,i) => { if(inputs[i]) inputs[i].value = p; });
  hideModal('modal-team-picker');
  // Update label
  const label = side === 'A' ? 'lbl-teamA' : 'lbl-teamB';
  document.getElementById(label).textContent = t.name + ' Players';
}
function confirmDeleteTeam(name, side) {
  if(confirm(`Remove saved team "${name}"?`)) {

    loadTeamInto(side);

}

function updatePlayerInputs() {
  const n = parseInt(document.getElementById('inp-ppt').value);
  ['A','B'].forEach(t => {
    const list = document.getElementById('list-team'+t);
    const existing = [...list.querySelectorAll('input')].map(i=>i.value);
    list.innerHTML = '';
    for(let i=0; i<n; i++) {
      const val = existing[i] || '';
      list.innerHTML += `<input type="text" placeholder="Player ${i+1} name" value="${val}"
        class="player-${t} w-full p-3 rounded-lg text-base" autocomplete="off">`;
    }
  });
}

async function createMatch() {
  const btn = document.getElementById('btn-create');
  const teamA = document.getElementById('inp-teamA').value.trim();
  const teamB = document.getElementById('inp-teamB').value.trim();
  if(!teamA || !teamB) { alert('Enter both team names'); return; }

  const teamAPlayers = [...document.querySelectorAll('.player-A')].map(i=>i.value.trim()).filter(Boolean);
  const teamBPlayers = [...document.querySelectorAll('.player-B')].map(i=>i.value.trim()).filter(Boolean);
  const commonPlayer = (document.getElementById('inp-common')?.value||'').trim();
  const ppt = parseInt(document.getElementById('inp-ppt').value);
  if(teamAPlayers.length < 2 || teamBPlayers.length < 2) { alert('Name at least 2 players per team. You can add more during the match with the + button.'); return; }

  btn.disabled = true; btn.textContent = 'Creating...';
  try {
    const res = await apiCall('create_match', {
      team_a: teamA, team_b: teamB,
      overs: parseInt(document.getElementById('inp-overs').value),
      players_per_team: ppt,
      retire_at: document.getElementById('inp-retire-toggle').checked ? (parseInt(document.getElementById('inp-retire').value)||30) : 0,
      last_man_batting: document.getElementById('inp-lastman').checked,
      team_a_players: teamAPlayers,
      team_b_players: teamBPlayers,
      common_player: commonPlayer || null,
      common_player_balls: parseInt(document.getElementById('inp-common-balls')?.value)||0
    });
    if(res.match_id) {
      // Auto-save teams and common player for reuse
      if(teamA && teamAPlayers.length >= 2) saveTeam(teamA, teamAPlayers);
      if(teamB && teamBPlayers.length >= 2) saveTeam(teamB, teamBPlayers);
      if(commonPlayer) localStorage.setItem('cricket_default_common', commonPlayer);
      localStorage.setItem('cricket_common_balls', document.getElementById('inp-common-balls')?.value||'3');
      navigate('toss/'+res.match_id);
    } else throw new Error(res.error||'Failed');
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Create Match \u2192'; }
}

async function startScoreOnly() {
  const batTeam = document.getElementById('so-batteam').value.trim();
  const bowlTeam = document.getElementById('so-bowlteam').value.trim();
  if(!batTeam || !bowlTeam) { alert('Enter both team names'); return; }
  const striker = document.getElementById('so-striker').value.trim();
  const nonStriker = document.getElementById('so-nonstriker').value.trim();
  const bowler = document.getElementById('so-bowler').value.trim();
  if(!striker || !nonStriker) { alert('Enter both batsmen names'); return; }
  if(!bowler) { alert('Enter bowler name'); return; }
  const target = parseInt(document.getElementById('so-target').value) || 0;
  const overs = parseInt(document.getElementById('so-overs').value) || 5;

  const btn = document.getElementById('btn-so-start');
  btn.disabled = true; btn.textContent = 'Starting...';
  try {
    // 1. Create match
    const res = await apiCall('create_match', {
      team_a: batTeam, team_b: bowlTeam,
      overs: overs,
      players_per_team: 11,
      retire_at: document.getElementById('so-retire-toggle').checked ? (parseInt(document.getElementById('so-retire').value)||30) : 0,
      last_man_batting: document.getElementById('so-lastman').checked,
      team_a_players: [],
      team_b_players: [],
      quick_match: true
    });
    if(!res.match_id) throw new Error(res.error||'Failed to create match');
    const matchId = res.match_id;

    // 2. Set toss (batting team bats first)
    await apiCall('set_toss', {
      match_id: matchId,
      toss_winner: batTeam,
      batting_first: batTeam
    });

    // 3. If target > 0, we need to simulate 1st innings score
    if(target > 0) {
      // Start and complete 1st innings with the target score
      await apiCall('start_innings', {
        match_id: matchId, innings: 1,
        on_strike: '_placeholder1', non_striker: '_placeholder2', bowler: '_placeholder3'
      });
      await apiCall('set_first_innings_score', {
        match_id: matchId, score: target - 1
      });
      // Start 2nd innings
      await apiCall('start_innings', {
        match_id: matchId, innings: 2,
        on_strike: striker, non_striker: nonStriker, bowler: bowler
      });
    } else {
      // Start 1st innings directly
      await apiCall('start_innings', {
        match_id: matchId, innings: 1,
        on_strike: striker, non_striker: nonStriker, bowler: bowler
      });
    }

    navigate('scoring/'+matchId);
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Start Scoring \u{1F3CF}'; }
}

function draftShowPaste() { document.getElementById('draft-paste-area').style.display='block'; }

function draftParsePaste() {
  const raw = document.getElementById('draft-paste-text').value;
  // Parse numbered/bulleted lists: "1. AJ", "2) KG", "- Sam", "• Neel", or just names per line
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    // Remove numbering: "1. ", "1) ", "- ", "• ", "⁠" (invisible chars)
    let name = line.replace(/^[\d]+[\.\)]\s*/, '').replace(/^[-•\u2022\u2060\u200B\uFEFF⁠]\s*/, '').trim();
    // Remove invisible unicode chars
    name = name.replace(/[\u2060\u200B\uFEFF]/g, '').trim();
    if(name && name.length > 0 && name.length < 30) {
      // Skip date-like lines (10/3/26)
      if(/^\d+\/\d+\/\d+$/.test(name)) return;
      if(!draftState.players.some(p=>p.toLowerCase()===name.toLowerCase())) {
        draftState.players.push(name);
        added++;
      }
    }
  });
  draftSavePlayers();
  document.getElementById('draft-paste-area').style.display='none';
  renderTeamDraft();
}

function draftAddPlayer() {
  const inp = document.getElementById('draft-name');
  const name = inp.value.trim();
  if(!name) return;
  if(draftState.players.some(p=>p.toLowerCase()===name.toLowerCase())) { alert('Already added'); return; }
  draftState.players.push(name);
  draftSavePlayers();
  inp.value = '';
  renderTeamDraft();
}

function draftRemovePlayer(i) {
  draftState.players.splice(i, 1);
  draftSavePlayers();
  renderTeamDraft();
}

function draftClearAll() {
  if(!confirm('Remove all players?')) return;
  draftState.players = [];
  draftSavePlayers();
  renderTeamDraft();
}

function draftToCaptains() {
  if(draftState.players.length < 4) { alert('Need at least 4 players'); return; }
  draftState.step = 'captains';
  draftState.captains = [];
  renderTeamDraft();
}

function draftFlipCoin() {
  if(draftState.flipping) return;
  draftState.flipping = true;
  const coin = document.getElementById('dcoin');
  const btn = document.getElementById('dcoin-flip');
  btn.disabled = true; btn.textContent = 'Flipping...';
  document.getElementById('dcoin-result').classList.add('hidden');

  const result = Math.random() < 0.5 ? 'heads' : 'tails';
  const fullRot = 4 + Math.floor(Math.random()*3);
  const endDeg = fullRot * 360 + (result==='tails' ? 180 : 0);
  coin.style.setProperty('--flip-end', endDeg+'deg');
  coin.classList.remove('flipping');
  void coin.offsetWidth;
  coin.classList.add('flipping');

  const winner = result==='heads' ? draftState.captains[0] : draftState.captains[1];

  setTimeout(() => {
    document.getElementById('dcoin-result-text').innerHTML =
      `<span style="color:#22c55e">${result.toUpperCase()}!</span><br><span class="text-2xl">${winner} picks first!</span>`;
    document.getElementById('dcoin-result').classList.remove('hidden');
    draftState.flipping = false;
    btn.textContent = 'Flip Again'; btn.disabled = false;
    // Auto-proceed after 1.5s
    setTimeout(()=>draftStartPicking(winner), 1500);
  }, 2100);
}

function draftStartPicking(winner) {
  draftState.tossWinner = winner;
  const capA = draftState.captains[0];
  const capB = draftState.captains[1];
  // Winner is captain A's team, loser is B — or swap if winner is capB
  if(winner === capA) {
    draftState.teamA = [capA];
    draftState.teamB = [capB];
    draftState.currentPick = 'A';
  } else {
    draftState.teamA = [capB];
    draftState.teamB = [capA];
    draftState.currentPick = 'B'; // B picks first since B's captain won
    // Swap so teamA = toss winner's team for clarity
    draftState.teamA = [winner];
    draftState.teamB = [winner === capA ? capB : capA];
    draftState.currentPick = 'A';
  }
  draftState.step = 'pick';
  renderTeamDraft();
}

        <div class="text-xs font-semibold uppercase mb-1" style="color:${!isA?'#22c55e':'var(--text2)'}">${s.teamB[0]}'s Team ${!isA?'\u{1F449}':''}</div>
        ${s.teamB.map((p,i)=>`<div class="text-sm ${i===0?'font-bold':'font-medium'} py-0.5">${i===0?'\u{1F451} ':''}${p}</div>`).join('')}

function draftPickPlayer(name) {
  if(draftState.currentPick === 'A') {
    draftState.teamA.push(name);
    draftState.currentPick = 'B';
  } else {
    draftState.teamB.push(name);
    draftState.currentPick = 'A';
  }
  renderTeamDraft();
}

function draftUndoPick() {
  // Undo the last pick — opposite of currentPick since it already toggled
  if(draftState.currentPick === 'A') {
    // Last pick was B
    if(draftState.teamB.length > 1) { draftState.teamB.pop(); draftState.currentPick = 'B'; }
  } else {
    // Last pick was A
    if(draftState.teamA.length > 1) { draftState.teamA.pop(); draftState.currentPick = 'A'; }
  }
  renderTeamDraft();
}

function draftSetCommon(name) {
  draftState.commonPlayer = name;
  draftState.step = 'done';
  renderTeamDraft();
}

  const txt = draftGetText();

    // Fallback
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}

  coin.classList.add('flipping');

  const m = state.match;
  const winner = result==='heads' ? m.team_a : m.team_b;

  setTimeout(() => {
    const won = tossState.pickedSide === result;
    resultText.innerHTML = `<span style="color:${won?'#22c55e':'#ef4444'}">${result.toUpperCase()}!</span><br><span class="text-xl">${winner} won the toss!</span>`;
    resultDiv.classList.remove('hidden');
    document.getElementById('toss-winner-section').classList.add('hidden');
    pickTossWinner(winner);
    tossState.flipping = false;
    btn.textContent = 'Flip Again';
    btn.disabled = false;
  }, 2100);
}

function pickTossWinner(team) {
  tossState.winner = team;
  document.getElementById('toss-election').classList.remove('hidden');
  document.getElementById('toss-winner-name').textContent = team;
}

async function pickElection(choice) {
  const m = state.match;
  const battingFirst = choice==='bat' ? tossState.winner :
    (tossState.winner===m.team_a ? m.team_b : m.team_a);
  try {
    await apiCall('set_toss', {
      match_id: tossState.matchId,
      toss_winner: tossState.winner,
      batting_first: battingFirst
    });
    state.match.batting_first = battingFirst;
    state.match.toss_winner = tossState.winner;
    navigate('openers/'+tossState.matchId);
  } catch(e) { alert('Error: '+e.message); }
}

async function renderSelectOpeners(matchId) {
  app.innerHTML = `<div class="flex-1 flex items-center justify-center"><div class="animate-pulse">Loading...</div></div>`;
  try {
    const res = await apiCall('get_match', {match_id: matchId});
    state.match = res;
  } catch(e) { navigate('home'); return; }
  const m = state.match;
  const isSecondInnings = m.status === 'live';

  // Super Over 2nd innings: auto-start with stored picks
  if (m.is_super_over && isSecondInnings) {
    const picks = JSON.parse(localStorage.getItem('cricket_so_picks_' + matchId) || 'null');
    if (picks) {
      try {
        const batTeam = m.batting_first === m.team_a ? m.team_b : m.team_a;
        const striker = batTeam === picks.teamA ? picks.batA[0] : picks.batB[0];
        const nonStriker = batTeam === picks.teamA ? picks.batA[1] : picks.batB[1];
        const bowler = batTeam === picks.teamA ? picks.bowlB : picks.bowlA;
        await apiCall('start_innings', {
          match_id: matchId, innings: 2,
          striker, non_striker: nonStriker, bowler
        });
        navigate('scoring/' + matchId);
        return;
      } catch(e) { /* fall through to normal opener selection */ }
    }
  }

  let batTeam, bowlTeam;
  if(isSecondInnings) {
    // 2nd innings: team that bowled first now bats
    batTeam = m.batting_first === m.team_a ? m.team_b : m.team_a;
    bowlTeam = m.batting_first;
  } else {
    batTeam = m.batting_first;
    bowlTeam = batTeam === m.team_a ? m.team_b : m.team_a;
  }
  const batters = (m.players||[]).filter(p=>p.team===batTeam);
  const bowlers = (m.players||[]).filter(p=>p.team===bowlTeam);

  // Quick Match: no players on batting/bowling side — show text input form
  if(batters.length < 2 || bowlers.length === 0) {
    renderOpenersTextInput(matchId, batTeam, bowlTeam);
    return;
  }

  app.innerHTML = `
    <div class="p-4 border-b flex items-center gap-3" style="border-color:var(--border)">
      <button onclick="navigate('toss/${matchId}')" class="text-2xl leading-none">\u2190</button>
      <h1 class="text-lg font-bold">Select Openers</h1>

    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="card rounded-xl p-4 space-y-2">
        <h2 class="font-bold text-sm uppercase tracking-wide" style="color:var(--text2)">\u{1F3CF} Batting - ${batTeam}</h2>
        <p class="text-xs" style="color:var(--text2)">Tap striker first, then non-striker</p>
        <div class="space-y-2">
          ${batters.map(p=>`
            <label class="flex items-center gap-3 p-3 rounded-lg border cursor-pointer active:scale-[0.98]" style="border-color:var(--border);touch-action:manipulation">
              <input type="checkbox" class="sel-bat w-5 h-5 accent-green-600 rounded" value="${p.name}">
              <span class="font-medium">${p.name}</span>${p.is_common?'<span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300 font-bold">\u{1F91D} Common</span>':''}
            </label>`).join('')}
        </div>
      </div>
      <div class="card rounded-xl p-4 space-y-2">
        <h2 class="font-bold text-sm uppercase tracking-wide" style="color:var(--text2)">\u{26BE} Bowling - ${bowlTeam}</h2>
        <div class="space-y-2">
          ${bowlers.map(p=>`
            <label class="flex items-center gap-3 p-3 rounded-lg border cursor-pointer active:scale-[0.98]" style="border-color:var(--border);touch-action:manipulation">
              <input type="radio" name="sel-bowl" class="sel-bowl w-5 h-5 accent-green-600" value="${p.name}">
              <span class="font-medium">${p.name}</span>${p.is_common?'<span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300 font-bold">\u{1F91D} Common</span>':''}
            </label>`).join('')}
        </div>
      </div>

    <div class="p-4 border-t no-print" style="border-color:var(--border)">
      <button onclick="doStartInnings('${matchId}')" id="btn-start"
        class="w-full py-4 rounded-xl bg-cricket-600 text-white font-bold text-lg active:scale-[0.97]"
        style="touch-action:manipulation">
        Start Match \u{1F3CF}
      </button>
    </div>`;

  // Enforce max 2 batsmen selected
  document.querySelectorAll('.sel-bat').forEach(cb => {

      const checked = document.querySelectorAll('.sel-bat:checked');
      if(checked.length > 2) { cb.checked = false; }
    });
  });

async function doStartInnings(matchId) {
  const bats = [...document.querySelectorAll('.sel-bat:checked')].map(i=>i.value);
  const bowler = document.querySelector('.sel-bowl:checked')?.value;
  if(bats.length!==2) { alert('Select exactly 2 batsmen'); return; }
  if(!bowler) { alert('Select a bowler'); return; }
  const btn = document.getElementById('btn-start');
  btn.disabled=true; btn.textContent='Starting...';
  try {
    const inn = state.match?.status==='live' ? 2 : 1;
    await apiCall('start_innings', {
      match_id: matchId, innings: inn,
      on_strike: bats[0], non_striker: bats[1], bowler
    });
    navigate('scoring/'+matchId);
  } catch(e) { alert('Error: '+e.message); btn.disabled=false; btn.textContent='Start Match \u{1F3CF}'; }

// ===== SCORING =====
let _syncTimer = null;
function isAnyModalOpen() {
  return document.querySelectorAll('.modal-overlay[style*="flex"], .modal[style*="flex"]').length > 0;
}
function startAutoSync() {
  stopAutoSync();
  _syncTimer = setInterval(async () => {
    if (isAnyModalOpen() || state.pendingRequest) return;
    try { await refreshScoring(); } catch(e) { /* ignore sync errors */ }
  }, 4000);
}
function stopAutoSync() {
  if(_syncTimer) { clearInterval(_syncTimer); _syncTimer = null; }
}

async function renderScoring(matchId) {
  state.matchId = matchId;
  app.innerHTML = `<div class="flex-1 flex items-center justify-center"><div class="animate-pulse text-lg">Loading match...</div></div>`;
  try {
    const res = await apiCall('get_state', {match_id: matchId});
    if(res.error) {
      // If no striker/bowler found, innings not started yet — redirect to openers
      if(res.error.includes('No striker') || res.error.includes('No bowler') || res.error.includes('No innings')) {
        navigate('openers/'+matchId);
        return;
      }
      throw new Error(res.error);
    }
    Object.assign(state, res);
    state.matchId = matchId;
  } catch(e) {
    // Match might exist but innings not started — try to go to openers
    try {
      const m = await apiCall('get_match', {match_id: matchId});
      if(m && !m.error) {
        state.match = m;
        if(m.status === 'created') { navigate('toss/'+matchId); return; }
        if(m.batting_first) { navigate('openers/'+matchId); return; }
      }
    } catch(e2) { /* fall through */ }
    alert('Error: '+e.message); navigate('home'); return;
  }
  if(!state.onStrike) {
    // No openers set — redirect to openers page
    navigate('openers/'+matchId);
    return;
  }
  if(state.recordingEnabled) await startCamera();
  drawScoring();
  startAutoSync();
}

async function refreshScoring() {
  if(!state.matchId) return;
  try {
    const res = await apiCall('get_state', {match_id: state.matchId});
    if(res.error) throw new Error(res.error);
    Object.assign(state, res);
    state.isFreeHit = false;
    const over = state.thisOver||[];
    if(over.length > 0 && over[over.length-1].extrasType === 'noball') state.isFreeHit = true;
    drawScoring();
  } catch(e) { /* silent */ }
}

// ===== RENAME PLAYER =====
async function promptRenamePlayer(oldName) {
  const newName = prompt('Rename player "' + oldName + '" to:', oldName);
  if(!newName || newName.trim() === oldName) return;
  try {
    const res = await apiCall('rename_player', {match_id: state.matchId, old_name: oldName, new_name: newName.trim()});
    if(res.error) { alert(res.error); return; }
    syncFromServer(res);
    drawScoring();
  } catch(e) { alert('Error renaming: ' + e.message); }
}

// ===== LIVE CAMERA + RECORDING =====
state.recordingEnabled = localStorage.getItem('cricket_recording') === 'true';
let _cameraStream = null;
let _mediaRecorder = null;
let _recordedChunks = [];
let _clipCount = 0;
let _recentClips = []; // [{url, blob, label, ballNum, mimeType, ext}] — last 6 clips
let _currentClipUrl = null;
let _currentClipIndex = -1;
let _canvasInterval = null;

async function toggleRecording() {
  state.recordingEnabled = !state.recordingEnabled;
  localStorage.setItem('cricket_recording', state.recordingEnabled);
  if(state.recordingEnabled) {
    await startCamera();
  } else {
    stopCamera();
  }
  drawScoring();
}

function updateScoreStrip() {
  const s = state.score || {runs:0,wickets:0,balls:0,extras:0};
  const os = state.onStrike||{name:'-',runs:0,balls:0};
  const ns = state.nonStriker||{name:'-',runs:0,balls:0};
  const bw = state.bowler||{name:'-',balls:0,runs:0,wickets:0};
  const totalOvers = state.match?.overs||5;
  const crr = calcRR(s.runs, s.balls);

  const el = id => document.getElementById(id);
  if(el('ss-team')) el('ss-team').textContent = state.battingTeam || '';
  if(el('ss-score')) el('ss-score').textContent = s.runs + '/' + s.wickets;
  if(el('ss-overs')) el('ss-overs').textContent = '(' + formatOvers(s.balls) + '/' + totalOvers + ' ov)';
  if(el('ss-crr')) {
    let txt = 'CRR: ' + crr;
    if(state.target) { const bl = totalOvers*6-s.balls; txt += ' \u2022 Need ' + Math.max(0,state.target-s.runs) + ' off ' + bl + 'b'; }
    el('ss-crr').textContent = txt;
  }
  if(el('ss-batsmen')) el('ss-batsmen').textContent = '\u{1F3CF} ' + os.name + '* ' + os.runs + '(' + os.balls + ')  ' + ns.name + ' ' + ns.runs + '(' + ns.balls + ')';
  if(el('ss-bowler')) el('ss-bowler').textContent = '\u{26BE} ' + bw.name + ' ' + formatOvers(bw.balls) + '-' + bw.runs + '-' + bw.wickets;
}

function getScoreBarText() {
  const s = state.score || {runs:0,wickets:0,balls:0};
  const os = state.onStrike||{name:'-',runs:0,balls:0};
  const ns = state.nonStriker||{name:'-',runs:0,balls:0};
  const bw = state.bowler||{name:'-',balls:0,runs:0,wickets:0};
  const totalOvers = state.match?.overs||5;
  const crr = calcRR(s.runs, s.balls);
  let line1 = (state.battingTeam||'') + '  ' + s.runs + '/' + s.wickets + '  (' + formatOvers(s.balls) + '/' + totalOvers + ' ov)   CRR:' + crr;
  if(state.target) { const bl = totalOvers*6-s.balls; line1 += '  Need ' + Math.max(0,state.target-s.runs) + ' off ' + bl + 'b'; }
  const line2 = os.name + '* ' + os.runs + '(' + os.balls + ')  ' + ns.name + ' ' + ns.runs + '(' + ns.balls + ')   ' + bw.name + ' ' + formatOvers(bw.balls) + '-' + bw.runs + '-' + bw.wickets;
  return { line1, line2 };
}

function drawScoreBarOnCanvas(ctx, w, h) {
  const { line1, line2 } = getScoreBarText();
  const barH = Math.max(48, h * 0.08);
  const y = h - barH;
  // Background gradient
  const grad = ctx.createLinearGradient(0, y - 10, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.3, 'rgba(0,0,0,0.75)');
  grad.addColorStop(1, 'rgba(0,0,0,0.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, y - 10, w, barH + 10);
  // Green accent line at top of bar
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(0, y - 2, w, 2);
  // Line 1 — big score
  const fontSize1 = Math.max(13, Math.round(h * 0.025));
  ctx.font = '800 ' + fontSize1 + 'px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'top';
  ctx.fillText(line1, 8, y + 4);
  // Line 2 — batsmen + bowler
  const fontSize2 = Math.max(10, Math.round(h * 0.018));
  ctx.font = '600 ' + fontSize2 + 'px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(line2, 8, y + 4 + fontSize1 + 3);
}

async function startCamera() {
  if(_cameraStream) return;
  try {
    _cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    const vid = document.getElementById('camera-preview');
    if(vid) vid.srcObject = _cameraStream;
    updateScoreStrip();
    // Start canvas-based recording with score overlay burned in
    startRecording();
  } catch(e) {
    alert('Camera access denied. Check permissions.');
    state.recordingEnabled = false;
    localStorage.setItem('cricket_recording', 'false');
  }
}

function _getSupportedMimeType() {
  // iOS Safari supports mp4 first, Android/Chrome supports webm
  const types = [
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for(const t of types) {
    if(typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function startRecording() {
  if(!_cameraStream || _mediaRecorder) return;
  if(typeof MediaRecorder === 'undefined') { showToast('Recording not supported on this browser'); return; }
  if(window._cancelCanvasDraw) { window._cancelCanvasDraw(); window._cancelCanvasDraw = null; }
  _canvasInterval = null;
  const vid = document.getElementById('camera-preview');
  const canvas = document.getElementById('camera-canvas');
  if(!vid || !canvas) return;

  const vTrack = _cameraStream.getVideoTracks()[0];
  const settings = vTrack ? vTrack.getSettings() : {};
  const srcW = settings.width || 1280;
  const srcH = settings.height || 720;
  // Cap at 720px wide for quality/performance balance
  const scale = srcW > 720 ? 720 / srcW : 1;
  canvas.width = Math.round(srcW * scale);
  canvas.height = Math.round(srcH * scale);
  const ctx = canvas.getContext('2d');

  let _rafId = null;
  let _lastDraw = 0;
  const FPS = 24;
  const frameInterval = 1000 / FPS;

  function drawFrame(ts) {
    _rafId = requestAnimationFrame(drawFrame);
    if(ts - _lastDraw < frameInterval) return;
    _lastDraw = ts;
    if(vid.readyState >= 2) {
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      drawScoreBarOnCanvas(ctx, canvas.width, canvas.height);
    }
  }
  _rafId = requestAnimationFrame(drawFrame);
  _canvasInterval = _rafId;
  window._cancelCanvasDraw = () => { if(_rafId) cancelAnimationFrame(_rafId); _rafId = null; };

  const canvasStream = canvas.captureStream(FPS);
  const audioTracks = _cameraStream.getAudioTracks();
  if(audioTracks.length > 0) canvasStream.addTrack(audioTracks[0]);

  _recordedChunks = [];
  const mimeType = _getSupportedMimeType();
  try {
    const opts = mimeType ? { mimeType, videoBitsPerSecond: 2500000 } : {};
    _mediaRecorder = new MediaRecorder(canvasStream, opts);
  } catch(e) {
    try { _mediaRecorder = new MediaRecorder(canvasStream); } catch(e2) { showToast('Recording not supported on this device'); return; }
  }
  _mediaRecorder.ondataavailable = e => { if(e.data.size > 0) _recordedChunks.push(e.data); };
  _mediaRecorder.start(1000);
}

function saveClip() {
  if(!_mediaRecorder || _recordedChunks.length === 0) return;
  if(window._cancelCanvasDraw) window._cancelCanvasDraw();

  const recorder = _mediaRecorder;
  _mediaRecorder = null;
  recorder.onstop = () => {
    try {
      const mimeType = recorder.mimeType || 'video/mp4';
      const blob = new Blob(_recordedChunks, { type: mimeType });
      _recordedChunks = [];
      _clipCount++;
      const url = URL.createObjectURL(blob);
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';

      // Keep last 6 clips in memory
      if(_recentClips.length >= 6) {
        const old = _recentClips.shift();
        URL.revokeObjectURL(old.url);
      }
      const s = state.score || {runs:0,wickets:0,balls:0};
      _recentClips.push({
        url, blob,
        label: 'Ball ' + _clipCount + ' \u2022 ' + s.runs + '/' + s.wickets,
        ballNum: _clipCount,
        mimeType, ext
      });
      updateRecentClipsUI();

      // Auto-save to gallery
      const fileName = 'cricket_ball_' + _clipCount + '.' + ext;
      _saveToGallery(blob, fileName, mimeType);
    } catch(e) {
      showToast('Failed to save clip');
    }

    // Restart recording for next ball
    if(state.recordingEnabled && _cameraStream) startRecording();
  };
  if(recorder.state === 'recording') recorder.stop();
}

function _saveToGallery(blob, fileName, mimeType) {
  // iOS: Web Share API opens share sheet → user taps "Save Video"
  // Android: download attribute saves to Downloads → visible in Gallery
  try {
    if(navigator.share && navigator.canShare) {
      const file = new File([blob], fileName, { type: mimeType });
      if(navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: fileName }).then(() => {
          showToast('Clip shared!');
        }).catch((e) => {
          if(e.name !== 'AbortError') _triggerDownload(URL.createObjectURL(blob), fileName);
        });
        return;
      }
    }
    _triggerDownload(URL.createObjectURL(blob), fileName);
    showToast('Clip saved!');
  } catch(e) {
    showToast('Could not save clip');
  }
}

function _triggerDownload(url, fileName) {
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function updateRecentClipsUI() {
  const el = document.getElementById('recent-clips');
  if(!el) return;
  if(_recentClips.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = _recentClips.map((c, i) =>
    `<button onclick="playClip(${i})" class="rounded-xl overflow-hidden relative active:scale-95 shrink-0" style="width:100px;height:80px;background:#000;touch-action:manipulation">
      <video src="${c.url}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;pointer-events:none"></video>
      <div class="absolute inset-0 flex items-center justify-center" style="background:rgba(0,0,0,0.25)">
        <span class="text-white text-xl">\u25B6</span>
      </div>
      <div class="absolute top-1 right-1 px-1.5 py-0.5 rounded-full text-white" style="font-size:9px;font-weight:700;background:rgba(0,0,0,0.6)">${i+1}</div>
      <div class="absolute bottom-0 left-0 right-0 px-1.5 py-1 text-white" style="font-size:10px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,0.7))">${c.label}</div>
    </button>`
  ).join('');
}

function playClip(index) {
  const clip = _recentClips[index];
  if(!clip) return;
  _currentClipUrl = clip;
  _currentClipIndex = index;
  const overlay = document.getElementById('clip-player-overlay');
  const vid = document.getElementById('clip-player-video');
  const label = document.getElementById('clip-player-label');
  const counter = document.getElementById('clip-player-counter');
  vid.src = clip.url;
  label.textContent = clip.label;
  if(counter) counter.textContent = (index + 1) + '/' + _recentClips.length;

// ===== SCORING ACTIONS =====
async function scoreBall(runs) {
  if(state.pendingRequest) return;
  state.pendingRequest = true;
  // Optimistic
  const bk = JSON.parse(JSON.stringify(state));
  state.score.runs += runs;
  state.score.balls += 1;
  if(state.onStrike) { state.onStrike.runs+=runs; state.onStrike.balls+=1; if(runs===4)state.onStrike.fours++; if(runs===6)state.onStrike.sixes++; }
  if(state.bowler) { state.bowler.runs+=runs; state.bowler.balls+=1; }
  state.thisOver.push({runs,extrasType:'none',extrasRuns:0,isWicket:false});
  state.isFreeHit = false;
  if(runs===4) showCelebration('four');
  if(runs===6) showCelebration('six');
  if(runs%2===1) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  const legal = state.thisOver.filter(b=>b.extrasType!=='wide'&&b.extrasType!=='noball').length;
  if(legal===6) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  drawScoring();

  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs, extras_type:'none', extras_runs:0, is_wicket:false
    });
    if(res.error) throw new Error(res.error);
    syncFromServer(res);
    if(state.recordingEnabled) saveClip();
  } catch(e) { Object.assign(state,bk); drawScoring(); }
  state.pendingRequest = false;
}

async function scoreExtra(type, extraRuns) {
  hideModal('modal-extras');
  if(state.pendingRequest) return;
  state.pendingRequest = true;
  const er = extraRuns||1;
  const bk = JSON.parse(JSON.stringify(state));

  state.score.runs += er; state.score.extras += er;
  if(type==='wide'||type==='noball') { /* illegal */ }
  else { state.score.balls += 1; if(state.onStrike) state.onStrike.balls+=1; if(state.bowler) state.bowler.balls+=1; }
  if(state.bowler) { if(type==='wide'){state.bowler.wides=(state.bowler.wides||0)+1;state.bowler.runs+=er;} if(type==='noball'){state.bowler.noballs=(state.bowler.noballs||0)+1;state.bowler.runs+=er;} }
  state.thisOver.push({runs:0,extrasType:type,extrasRuns:er,isWicket:false});
  if(type==='noball') { state.isFreeHit = true; showCelebration('noball'); }
  if(type==='wide') showCelebration('wide');
  if((type==='bye'||type==='legbye')&&er%2===1) { let t=state.onStrike;state.onStrike=state.nonStriker;state.nonStriker=t; }
  drawScoring();

  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs:0, extras_type:type, extras_runs:er, is_wicket:false
    });
    if(res.error) throw new Error(res.error);
    syncFromServer(res);
    if(state.recordingEnabled) saveClip();
  } catch(e) { Object.assign(state,bk); drawScoring(); }
  state.pendingRequest = false;
}

async function doConfirmWicket(newBat) {

  const runOutRuns = wktData.runOutRuns || 0;
  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs:runOutRuns, extras_type: isNb ? 'noball' : 'none', extras_runs: isNb ? 1 : 0,
      is_wicket:true, wicket_type:wktData.type,
      dismissed_batsman:wktData.dismissed,
      new_batsman:newBat,
      fielder:wktData.fielder||null
    });
    if(res.error) throw new Error(res.error);
    state.isFreeHit = isNb; // free hit after no ball even with run out
    syncFromServer(res);
    if(state.recordingEnabled) saveClip();
  } catch(e) { alert('Error: '+e.message); }
  state.pendingRequest = false;
}

function syncFromServer(res) {
  if(!res) return;
  const keys = ['score','onStrike','nonStriker','bowler','thisOver','battingCard','bowlingCard',
    'availableBatsmen','availableBowlers','target','innings','match','battingTeam','bowlingTeam','commonPlayerInfo'];
  keys.forEach(k => { if(res[k]!==undefined) state[k]=res[k]; });
  // Recalculate free hit from thisOver — last ball being noball means next is free hit
  const over = state.thisOver||[];
  if(over.length > 0 && over[over.length-1].extrasType === 'noball') {
    state.isFreeHit = true;
  }
  drawScoring();
  if(res.innings_complete) { showInningsModal(res); return; }
  if(res.match_complete) {
    const parentId = state.match?.is_super_over ? state.match.parent_match_id : null;
    setTimeout(()=>navigate('summary/'+(parentId||state.matchId)), 1500);
    return;
  }
  if(res.needs_bowler) showBowlerPicker();
  if(res.retire_prompt) showRetirePrompt(res.retire_player);
}

function showInningsModal(res) {
  const isSecond = (state.innings||1) >= 2;
  const isTied = isSecond && !res.winner;
  const isSuperOver = state.match?.is_super_over;
  const parentMatchId = state.match?.parent_match_id;

  if (isSuperOver && isSecond) {
    document.getElementById('inn-icon').textContent = isTied ? '🤝' : '⚡';
    document.getElementById('inn-title').textContent = isTied ? 'Super Over Tied!' : 'Super Over Complete!';
    document.getElementById('inn-msg').textContent = res.winner ? `${res.winner} wins the Super Over!` : 'Still level after Super Over!';
    document.getElementById('inn-btn').textContent = res.winner ? 'View Match Summary' : 'View Summary';
  } else {
    document.getElementById('inn-icon').textContent = isSecond ? (isTied ? '🤝' : '\u{1F3C6}') : '\u{1F3CF}';
    document.getElementById('inn-title').textContent = isSecond ? (isTied ? 'Match Tied!' : 'Match Complete!') : 'Innings Complete';
    document.getElementById('inn-msg').textContent = isSecond ?
      (res.winner ? `${res.winner} wins!` : 'Scores are level!') :
      `${state.battingTeam} scored ${state.score.runs}/${state.score.wickets}. Target: ${state.score.runs+1}`;
    document.getElementById('inn-btn').textContent = isSecond ? 'View Summary' : 'Start 2nd Innings';
  }

  // Show/hide super over button
  let soBtn = document.getElementById('inn-super-over-btn');
  if (!soBtn) {
    soBtn = document.createElement('button');
    soBtn.id = 'inn-super-over-btn';
    soBtn.className = 'w-full py-3 rounded-xl bg-yellow-500 text-white font-bold text-base active:scale-[0.97] mt-2';
    soBtn.style.touchAction = 'manipulation';
    soBtn.textContent = '⚡ Super Over';
    document.getElementById('inn-btn').parentNode.appendChild(soBtn);
  }
  // Super over button: show for tied matches (including tied super overs for another round)
  soBtn.style.display = isTied ? 'block' : 'none';
  soBtn.onclick = () => {
    hideModal('modal-innings');
    if (isSuperOver && parentMatchId) {
      // Tied super over → start another super over from parent match context
      state.matchId = parentMatchId;
      startSuperOver();
    } else {
      startSuperOver();
    }
  };
  document.getElementById('modal-innings').style.display = 'flex';
}

function handleInningsEnd() {
  hideModal('modal-innings');
  const isSuperOver = state.match?.is_super_over;
  const parentMatchId = state.match?.parent_match_id;

  if((state.innings||1) >= 2) {
    if (isSuperOver && parentMatchId) {
      // Super over complete with winner → go to parent match summary
      navigate('summary/' + parentMatchId);
    } else {
      navigate('summary/' + state.matchId);
    }
  } else {
    navigate('openers/' + state.matchId);
  }
}

async function confirmSuperOver(parentMatchId, teamA, teamB, soNum) {
  const batA = [...document.querySelectorAll('.so-bat-a:checked')].map(cb => cb.value);
  const batB = [...document.querySelectorAll('.so-bat-b:checked')].map(cb => cb.value);
  const bowlA = document.querySelector('.so-bowl-a:checked')?.value;
  const bowlB = document.querySelector('.so-bowl-b:checked')?.value;

  if(batA.length < 2) { alert('Pick 2 batsmen for ' + teamA); return; }
  if(batB.length < 2) { alert('Pick 2 batsmen for ' + teamB); return; }
  if(!bowlA) { alert('Pick a bowler for ' + teamA); return; }
  if(!bowlB) { alert('Pick a bowler for ' + teamB); return; }

  const btn = document.getElementById('btn-so-start');
  btn.disabled = true; btn.textContent = 'Creating...';

  const batFirst = window._soFirstBat === 'A' ? teamA : teamB;

  try {
    // Create super over match: 1 over, 2 players per team, no retire
    const res = await apiCall('create_match', {
      team_a: teamA, team_b: teamB,
      overs: 1,
      players_per_team: 2,
      retire_at: 0,
      last_man_batting: true,
      team_a_players: [...batA, bowlA].filter((v,i,a) => a.indexOf(v) === i),
      team_b_players: [...batB, bowlB].filter((v,i,a) => a.indexOf(v) === i),
      is_super_over: true,
      parent_match_id: parentMatchId,
      super_over_num: soNum
    });

    if(!res.match_id) throw new Error(res.error || 'Failed');

    // Store super over link on parent (localStorage for UI display)
    const soLinks = JSON.parse(localStorage.getItem('cricket_super_overs') || '{}');
    if(!soLinks[parentMatchId]) soLinks[parentMatchId] = [];
    soLinks[parentMatchId].push(res.match_id);
    localStorage.setItem('cricket_super_overs', JSON.stringify(soLinks));

    // Set toss (who bats first)
    await apiCall('set_toss', {
      match_id: res.match_id,
      toss_winner: batFirst,
      batting_first: batFirst
    });

    // Start first innings
    const striker = batFirst === teamA ? batA[0] : batB[0];
    const nonStriker = batFirst === teamA ? batA[1] : batB[1];
    const bowler = batFirst === teamA ? bowlB : bowlA;

    await apiCall('start_innings', {
      match_id: res.match_id,
      innings: 1,
      striker: striker,
      non_striker: nonStriker,
      bowler: bowler
    });

    // Store super over batsmen/bowler picks for 2nd innings auto-start
    localStorage.setItem('cricket_so_picks_' + res.match_id, JSON.stringify({
      teamA, teamB, batA, batB, bowlA, bowlB, batFirst
    }));

    navigate('scoring/' + res.match_id);
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Start Super Over ⚡';
  }
}

async function scoreNoBall(batRuns) {
  if(state.pendingRequest) return;
  state.pendingRequest = true;
  const bk = JSON.parse(JSON.stringify(state));
  const er = 1; // no ball penalty
  state.score.runs += batRuns + er; state.score.extras += er;
  if(state.onStrike && batRuns > 0) { state.onStrike.runs += batRuns; if(batRuns===4)state.onStrike.fours++; if(batRuns===6)state.onStrike.sixes++; }
  if(state.bowler) { state.bowler.noballs=(state.bowler.noballs||0)+1; state.bowler.runs+=batRuns+er; }
  state.thisOver.push({runs:batRuns,extrasType:'noball',extrasRuns:er,isWicket:false});
  state.isFreeHit = true; showCelebration('noball');
  if(batRuns%2===1) { let t=state.onStrike; state.onStrike=state.nonStriker; state.nonStriker=t; }
  drawScoring();
  try {
    const res = await apiCall('record_ball', {
      match_id:state.matchId, innings:state.innings,
      runs:batRuns, extras_type:'noball', extras_runs:er, is_wicket:false
    });
    if(res.error) throw new Error(res.error);
    syncFromServer(res);
    if(state.recordingEnabled) saveClip();
  } catch(e) { Object.assign(state,bk); drawScoring(); }
  state.pendingRequest = false;
}

// ===== SERIES TRACKING =====
function getOrCreateSeries(matchId, teamA, teamB) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  // Check if match already belongs to a series
  for(const [sid, s] of Object.entries(allSeries)) {
    if(s.matches.includes(matchId)) return sid;
  }
  // Check for an active series with same teams
  for(const [sid, s] of Object.entries(allSeries)) {
    const sameTeams = (s.teamA === teamA && s.teamB === teamB) || (s.teamA === teamB && s.teamB === teamA);
    if(sameTeams && !s.closed) {
      s.matches.push(matchId);
      localStorage.setItem('cricket_series', JSON.stringify(allSeries));
      return sid;
    }
  }
  // Create new series
  const sid = 'S' + Date.now();
  allSeries[sid] = { teamA, teamB, matches: [matchId], closed: false, created: new Date().toISOString() };
  localStorage.setItem('cricket_series', JSON.stringify(allSeries));
  return sid;
}

function addMatchToSeries(seriesId, matchId) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  if(allSeries[seriesId] && !allSeries[seriesId].matches.includes(matchId)) {
    allSeries[seriesId].matches.push(matchId);
    localStorage.setItem('cricket_series', JSON.stringify(allSeries));
  }
}

function getSeriesStats(seriesId) {
  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  const s = allSeries[seriesId];
  if(!s) return null;
  const allMatches = state.allMatches || [];
  let winsA = 0, winsB = 0, ties = 0, total = 0;
  for(const mid of s.matches) {
    const m = allMatches.find(x => x.match_id === mid);
    if(!m || m.status !== 'completed') continue;
    total++;
    if(!m.winner || m.winner === 'Tied' || m.winner === 'Tie') ties++;
    else if(m.winner === s.teamA) winsA++;
    else if(m.winner === s.teamB) winsB++;
  }
  return { teamA: s.teamA, teamB: s.teamB, winsA, winsB, ties, total, matches: s.matches };
}

        <label class="text-xs font-semibold uppercase tracking-wide" style="color:var(--text2)">Who bats first?</label>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <button id="rematch-bat-a" onclick="rematchPickBat('A')" class="p-3 rounded-xl font-bold text-sm active:scale-95 ring-2 ring-cricket-500 bg-cricket-50 dark:bg-cricket-900/30" style="touch-action:manipulation">${m.team_a}</button>
          <button id="rematch-bat-b" onclick="rematchPickBat('B')" class="p-3 rounded-xl font-bold text-sm active:scale-95 card" style="touch-action:manipulation">${m.team_b}</button>
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold uppercase tracking-wide" style="color:var(--text2)">Overs</label>
        <input id="rematch-overs" type="number" value="${m.overs}" min="1" max="50" class="w-full mt-1 p-3 rounded-lg text-base">
      </div>
      <button id="btn-rematch" onclick="startRematch('${matchId}')" class="w-full py-3 rounded-xl bg-cricket-600 text-white font-bold text-base active:scale-[0.97]" style="touch-action:manipulation">
        Start Match \u{1F3CF}
      </button>
      <button onclick="hideModal('modal-rematch')" class="w-full py-2 rounded-xl text-sm" style="color:var(--text2)">Cancel</button>
    </div>
  </div>`;
  modal.style.display = 'flex';
  window._rematchBatFirst = 'A';
}

function rematchPickBat(side) {
  window._rematchBatFirst = side;
  const btnA = document.getElementById('rematch-bat-a');
  const btnB = document.getElementById('rematch-bat-b');
  if(side === 'A') {
    btnA.className = 'p-3 rounded-xl font-bold text-sm active:scale-95 ring-2 ring-cricket-500 bg-cricket-50 dark:bg-cricket-900/30';
    btnB.className = 'p-3 rounded-xl font-bold text-sm active:scale-95 card';
  } else {
    btnB.className = 'p-3 rounded-xl font-bold text-sm active:scale-95 ring-2 ring-cricket-500 bg-cricket-50 dark:bg-cricket-900/30';
    btnA.className = 'p-3 rounded-xl font-bold text-sm active:scale-95 card';
  }
}

async function startRematch(prevMatchId) {
  const d = window._lastMatchData;
  if(!d) return;
  const m = d.match;
  const players = d.players || [];
  const overs = parseInt(document.getElementById('rematch-overs').value) || m.overs;
  const batFirst = window._rematchBatFirst === 'A' ? m.team_a : m.team_b;
  const btn = document.getElementById('btn-rematch');
  btn.disabled = true; btn.textContent = 'Creating...';

  // Get or create series
  const seriesId = getOrCreateSeries(prevMatchId, m.team_a, m.team_b);

  const teamAPlayers = players.filter(p => p.team === m.team_a && !p.is_common).map(p => p.name);
  const teamBPlayers = players.filter(p => p.team === m.team_b && !p.is_common).map(p => p.name);

  try {
    const res = await apiCall('create_match', {
      team_a: m.team_a, team_b: m.team_b,
      overs: overs,
      players_per_team: m.players_per_team || 11,
      retire_at: m.retire_at || 0,
      last_man_batting: m.last_man_batting !== false,
      team_a_players: teamAPlayers,
      team_b_players: teamBPlayers,
      common_player: m.common_player || null,
      common_player_balls: m.common_player_balls || 0,
      series_id: seriesId,
      quick_match: teamAPlayers.length === 0
    });
    if(!res.match_id) throw new Error(res.error || 'Failed');

    // Add new match to series
    addMatchToSeries(seriesId, res.match_id);

    // Set toss + batting first directly
    await apiCall('set_toss', { match_id: res.match_id, toss_winner: batFirst, chose: 'bat' });

    hideModal('modal-rematch');
    navigate('openers/' + res.match_id);
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Start Match \u{1F3CF}';
  }
}

// ===== SERIES RESULTS PAGE =====
async function renderSeries(seriesId) {
  app.innerHTML = `<div class="flex-1 flex items-center justify-center"><div class="animate-pulse">Loading...</div></div>`;
  try {
    const listRes = await apiCall('list_matches');
    state.allMatches = listRes.matches || [];
  } catch(e) { state.allMatches = []; }

  const allSeries = JSON.parse(localStorage.getItem('cricket_series')||'{}');
  const s = allSeries[seriesId];
  if(!s) { app.innerHTML = `<div class="p-4">Series not found</div>`; return; }

  const matches = [];
  for(const mid of s.matches) {
    const m = state.allMatches.find(x => x.match_id === mid);
    if(m) matches.push(m);
  }

  let winsA = 0, winsB = 0, ties = 0;
  matches.forEach(m => {
    if(m.status !== 'completed') return;
    if(!m.winner || m.winner === 'Tied' || m.winner === 'Tie') ties++;
    else if(m.winner === s.teamA) winsA++;
    else if(m.winner === s.teamB) winsB++;
  });
  const completed = matches.filter(m => m.status === 'completed').length;
  const seriesWinner = completed > 0 ? (winsA > winsB ? s.teamA : winsB > winsA ? s.teamB : null) : null;

  // Load scorecards for each match
  const scorecards = [];
  for(const m of matches) {
    if(m.status === 'completed') {
      try {
        const sc = await apiCall('get_scorecard', {match_id: m.match_id});
        scorecards.push(sc);
      } catch(e) { scorecards.push(null); }
    } else {
      scorecards.push(null);
    }
  }

  app.innerHTML = `
    <div class="p-4 border-b flex items-center gap-3" style="border-color:var(--border)">
      <button onclick="navigate('home')" class="text-2xl leading-none">\u2190</button>
      <h1 class="text-lg font-bold">\u{1F3CF} Series Results</h1>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="card rounded-xl p-6 text-center space-y-2">
        <div class="text-4xl">${seriesWinner ? '\u{1F3C6}' : '\u{1F91D}'}</div>
        <h2 class="text-xl font-black">${s.teamA} vs ${s.teamB}</h2>
        <div class="flex justify-center gap-6 mt-2">
          <div class="text-center">
            <div class="text-3xl font-black ${winsA>winsB?'text-green-500':''}">${winsA}</div>
            <div class="text-xs font-medium" style="color:var(--text2)">${s.teamA}</div>
          </div>
          <div class="text-center">
            <div class="text-3xl font-black" style="color:var(--text2)">-</div>
          </div>
          <div class="text-center">
            <div class="text-3xl font-black ${winsB>winsA?'text-green-500':''}">${winsB}</div>
            <div class="text-xs font-medium" style="color:var(--text2)">${s.teamB}</div>
          </div>
        </div>
        ${ties?`<div class="text-sm" style="color:var(--text2)">${ties} tied</div>`:''}
        <div class="text-sm font-bold" style="color:var(--text2)">${completed} match${completed!==1?'es':''} played</div>
        ${seriesWinner ? `<div class="text-sm font-bold text-green-500">${seriesWinner} leads the series!</div>` : completed > 0 ? `<div class="text-sm font-bold" style="color:var(--text2)">Series level</div>` : ''}
      </div>
      ${matches.map((m, idx) => {
        const sc = scorecards[idx];
        const inns = sc ? sc.innings || [] : [];
        return `
          <div class="card rounded-xl p-4 active:scale-[0.98]" onclick="navigate('summary/${m.match_id}')" style="cursor:pointer;touch-action:manipulation">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-semibold uppercase" style="color:var(--text2)">Match ${idx+1}</span>
              <span class="px-2 py-0.5 rounded-full text-xs font-bold ${m.status==='completed'?'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400':'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300'}">${m.status==='completed'?'DONE':'LIVE'}</span>
            </div>
            ${inns.map(inn => `
              <div class="flex justify-between items-center py-1">
                <span class="font-medium text-sm ${inn.batting_team===m.winner?'font-bold':''}">${inn.batting_team}</span>
                <span class="font-bold">${inn.total_runs}/${inn.total_wickets} <span class="text-xs font-normal" style="color:var(--text2)">(${formatOvers(inn.total_balls)})</span></span>
              </div>`).join('')}
            ${m.winner && m.winner !== 'Tied' ? `<div class="text-xs font-bold mt-1 text-green-500">${m.winner} won</div>` : m.status==='completed' ? `<div class="text-xs font-bold mt-1" style="color:var(--text2)">Match Tied</div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

// ===== INIT =====
route();
</script>
</body>
</html>
