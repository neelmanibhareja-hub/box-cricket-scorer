<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Day · Box Cricket</title>
<meta name="theme-color" content="#0a1d12">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
/* Box Cricket Match Day: who is coming to the booked slot, organiser tools, fair teams and the toss.
   Same black / green / white as the scorer. Server: n8n workflow "Box Cricket — Match Day" (POST /webhook/matchday). */
:root {
  --bg: #07130c; --bar: #10261a; --card: #132a1d; --line: #24402f;
  --text: #f3f1e8; --muted: #a9b8ad; --brand: #1f7a40; --brand-text: #5fd38b;
  --maybe: #e0b03a; --out: #8a8f8b; --red: #e05a4f; --gold: #ffd23f;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Lexend, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font: 700 2rem/1 'Barlow Condensed', sans-serif; letter-spacing: .02em; margin: 6px 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.when { font: 700 1.6rem/1.1 'Barlow Condensed', sans-serif; }
.where { color: var(--muted); margin-top: 4px; }
.count { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.pill { border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .9rem; background: var(--bar); }
.pill.in { color: var(--brand-text); } .pill.maybe { color: var(--maybe); } .pill.out { color: var(--out); }
label { display: block; color: var(--muted); font-size: .85rem; margin: 10px 0 4px; }
input { width: 100%; font: inherit; font-size: 1.05rem; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
input:focus { outline: 2px solid var(--brand); border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 12px; min-height: 52px; cursor: pointer; color: #fff; background: var(--brand); }
button.ghost { background: var(--bar); color: var(--text); border: 1px solid var(--line); }
button.maybe { background: #5c4a14; color: #ffe39a; }
button.out { background: #3a1e1c; color: #ffb3ab; }
button.small { min-height: 40px; padding: 8px 12px; font-size: .9rem; border-radius: 10px; }
button:disabled { opacity: .5; }
.btns3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.mine { margin-top: 10px; color: var(--muted); font-size: .9rem; }
ol { list-style: none; padding: 0; margin: 0; }
li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 1.1rem; }
li:last-child { border-bottom: 0; }
.n { width: 2rem; text-align: right; color: var(--muted); font: 700 1.2rem 'Barlow Condensed', sans-serif; }
.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--bar); color: var(--muted); }
.tag.came { color: var(--brand-text); } .tag.no { color: var(--red); } .tag.mb { color: var(--maybe); }
li.isout .nm { color: var(--out); text-decoration: line-through; }
li.me .nm::after { content: "  (you)"; color: var(--muted); font-size: .85rem; }
li.tap { cursor: pointer; }
.sec { color: var(--muted); font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 18px 0 4px; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team h3 { margin: 0 0 6px; font: 700 1.4rem 'Barlow Condensed', sans-serif; }
.team div { padding: 8px 0; border-bottom: 1px solid var(--line); }
.team div.tap { cursor: pointer; }
.team div.tap::after { content: "  ⇄"; color: var(--muted); font-size: .8rem; }
.toss { margin-top: 12px; font-size: 1.1rem; text-align: center; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 16px calc(14px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr; }
.wa { background: #1f9e55; }
.links { font-size: .9rem; word-break: break-all; color: var(--muted); }
.links b { color: var(--text); }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 10; }
.sheet.on { display: flex; }
.sheet .box { width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
.sheet h4 { margin: 0 0 6px; font-size: 1.2rem; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--bar); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; display: none; z-index: 20; }
.err { color: var(--red); margin-top: 8px; }
.hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MATCH DAY</h1>

  <!-- New match day (organiser) -->
  <div id="create" class="card hide">
    <div style="font-weight:700;font-size:1.1rem">Book a match day</div>
    <label>Date</label><input id="c-day" type="date">
    <label>Time</label><input id="c-time" placeholder="9:00–11:30 pm">
    <div class="row2">
      <div><label>Ground</label><input id="c-venue" placeholder="Lilavati, Gulabi Bagh"></div>
      <div><label>Cage / court</label><input id="c-court" placeholder="Cage 3"></div>
    </div>
    <label>Players wanted</label><input id="c-max" type="number" inputmode="numeric" value="14" min="2" max="40">
    <button id="c-go" style="width:100%;margin-top:14px">Create and get the link</button>
    <div id="c-err" class="err"></div>
  </div>

  <!-- A match day -->
  <div id="day" class="hide">
    <div class="card">
      <div class="when" id="d-when"></div>
      <div class="where" id="d-where"></div>
      <div class="count" id="d-count"></div>
    </div>

    <div class="card">
      <label for="me-name" style="margin-top:0">Your name</label>
      <input id="me-name" list="known" autocomplete="off" placeholder="Type your name">
      <div class="btns3">
        <button id="b-in">I'm in</button>
        <button id="b-maybe" class="maybe">Maybe 70:30</button>
        <button id="b-out" class="out">Can't come</button>
      </div>
      <div class="mine" id="me-state"></div>
    </div>

    <div class="card">
      <div class="sec" style="margin-top:0">Playing</div>
      <ol id="l-in"></ol>
      <div id="w-wait" class="hide"><div class="sec">Waiting list</div><ol id="l-wait"></ol></div>
      <div id="w-maybe" class="hide"><div class="sec">Maybe</div><ol id="l-maybe"></ol></div>
      <div id="w-out" class="hide"><div class="sec">Not coming</div><ol id="l-out"></ol></div>
    </div>

    <div class="card hide" id="teams-card">
      <div class="teams" id="teams"></div>
      <div class="toss" id="toss"></div>
    </div>

    <!-- Organiser -->
    <div class="card hide" id="admin">
      <div style="font-weight:700;font-size:1.1rem">Organiser</div>
      <label>Add a player (someone without the link)</label>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
        <input id="a-name" list="known" autocomplete="off" placeholder="Name">
        <button id="a-add" class="small">Add</button>
      </div>
      <div class="mine">Tap a name in the list to mark came / didn't come, move or remove them.</div>
      <div class="row2" style="margin-top:12px">
        <button id="a-teams" class="ghost">Make fair teams</button>
        <button id="a-toss" class="ghost">Toss</button>
      </div>
      <button id="a-clear" class="ghost small hide" style="margin-top:8px;width:100%">Clear teams</button>
      <div class="sec">Links</div>
      <div class="links">Players: <b id="l-player"></b></div>
      <div class="links" style="margin-top:6px">Organiser (keep private, or give a co-organiser): <b id="l-admin"></b></div>
      <button id="a-copy" class="ghost small" style="margin-top:8px">Copy organiser link</button>
      <button id="a-new" class="ghost small" style="margin-top:8px">Book another match day</button>
    </div>
  </div>
  <div id="loadmsg" class="mine">Loading…</div>
</div>

<div class="bar hide" id="bar"><div class="in"><button class="wa" id="share">Share list on WhatsApp</button></div></div>

<div class="sheet" id="sheet"><div class="box">
  <h4 id="s-name"></h4>
  <button id="s-came">Came ✓</button>
  <button id="s-no" class="out">Didn't come</button>
  <div class="row2"><button id="s-in" class="ghost">Move to playing</button><button id="s-maybe" class="ghost">Move to maybe</button></div>
  <button id="s-rm" class="out">Remove from list</button>
  <button id="s-x" class="ghost">Close</button>
</div></div>
<div class="sheet" id="tsheet"><div class="box">
  <h4 id="t-name"></h4>
  <button id="t-move"></button>
  <button id="t-cap" class="ghost">Make captain</button>
  <button id="t-x" class="ghost">Close</button>
</div></div>
<div class="toast" id="toast"></div>
<datalist id="known"></datalist>

<script>
const API = 'https://n8n.barandates.in/webhook/matchday';
const SCORER = 'https://n8n.barandates.in/webhook/cricket';
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
let MID = q.get('m') || '';
// The organiser key comes in the organiser link once and is remembered on this phone for that match day.
let KEY = q.get('k') || '';
try { if (MID && KEY) localStorage.setItem('md_key_' + MID, KEY); if (MID && !KEY) KEY = localStorage.getItem('md_key_' + MID) || ''; } catch (e) {}
// This phone's own id, so "I'm in" from it always edits the same row.
let PID = '';
try { PID = localStorage.getItem('md_pid') || ''; if (!PID) { PID = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-3); localStorage.setItem('md_pid', PID); } } catch (e) { PID = 'p' + Math.random().toString(36).slice(2, 14); }
let STATE = null, STATS = {}, busy = false, sheetPid = '';

async function call(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action, id: MID, key: KEY }, data || {})) });
  const j = await r.json();
  if (j.state) { STATE = j.state; render(); }
  if (!j.ok) throw new Error(j.error || 'failed');
  return j;
}
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2200); }
async function act(fn) { if (busy) return; busy = true; try { await fn(); } catch (e) { toast('Could not save - check the internet and try again'); } busy = false; }

// ---------- dates ----------
function dayText(d) {
  if (!d) return 'Match day';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
}
function dayShort(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-IN', { weekday: 'long' }) + ', ' + String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
}

// ---------- the list ----------
function groups() {
  const ps = (STATE && STATE.players) || [], max = STATE.md.max_players || 14;
  const inn = ps.filter(p => p.status === 'in');
  return { playing: inn.slice(0, max), waiting: inn.slice(max), maybe: ps.filter(p => p.status === 'maybe'), out: ps.filter(p => p.status === 'out') };
}
function li(p, n) {
  const el = document.createElement('li');
  if (p.status === 'out') el.className = 'isout';
  if (p.pid === PID) el.classList.add('me');
  if (STATE.admin) { el.classList.add('tap'); el.onclick = () => openSheet(p); }
  el.innerHTML = '<span class="n"></span><span class="nm"></span>';
  el.querySelector('.n').textContent = n ? n + '.' : '';
  el.querySelector('.nm').textContent = p.name;
  const tag = t => { const s = document.createElement('span'); s.className = 'tag ' + t[1]; s.textContent = t[0]; el.appendChild(s); };
  if (p.status === 'maybe') tag([p.note || '70:30', 'mb']);
  if (p.came === true) tag(['came', 'came']);
  if (p.came === false) tag(["didn't come", 'no']);
  return el;
}
function fill(id, list, start) { const ol = $(id); ol.innerHTML = ''; list.forEach((p, i) => ol.appendChild(li(p, start ? start + i : 0))); }

function render() {
  if (!STATE || !STATE.md) return;
  const md = STATE.md, g = groups();
  $('loadmsg').classList.add('hide'); $('day').classList.remove('hide'); $('bar').classList.remove('hide');
  $('d-when').textContent = dayText(md.day) + (md.time_text ? '  ·  ' + md.time_text : '');
  $('d-where').textContent = [md.court, md.venue].filter(Boolean).join('  ·  ');
  $('d-count').innerHTML = '';
  [[g.playing.length + ' / ' + md.max_players + ' in', 'in'], [g.waiting.length ? g.waiting.length + ' waiting' : '', 'in'], [g.maybe.length ? g.maybe.length + ' maybe' : '', 'maybe'], [g.out.length ? g.out.length + ' out' : '', 'out']]
    .forEach(([t, c]) => { if (!t) return; const s = document.createElement('span'); s.className = 'pill ' + c; s.textContent = t; $('d-count').appendChild(s); });
  fill('l-in', g.playing, 1);
  fill('l-wait', g.waiting, g.playing.length + 1); $('w-wait').classList.toggle('hide', !g.waiting.length);
  fill('l-maybe', g.maybe, 0); $('w-maybe').classList.toggle('hide', !g.maybe.length);
  fill('l-out', g.out, 0); $('w-out').classList.toggle('hide', !g.out.length);
  const mine = STATE.players.find(p => p.pid === PID);
  $('me-state').textContent = !mine ? 'Not on the list yet.' : mine.status === 'in' ? "You're in. See you there!" : mine.status === 'maybe' ? "You're a maybe (" + (mine.note || '70:30') + ')' : "You've said you can't come.";
  if (mine && !$('me-name').value) $('me-name').value = mine.name;
  // teams and toss, for everyone
  const t = md.teams;
  $('teams-card').classList.toggle('hide', !(t && t.a && t.a.length) && !md.toss);
  $('teams').innerHTML = '';
  if (t && t.a) [['TEAM A', t.a], ['TEAM B', t.b]].forEach(([n, list]) => {
    const d = document.createElement('div'); d.className = 'team';
    const h = document.createElement('h3'); h.textContent = n; d.appendChild(h);
    list.forEach((nm, i) => {
      const r = document.createElement('div'); r.textContent = nm + (i === 0 ? '  (c)' : '');
      if (STATE.admin) { r.className = 'tap'; r.onclick = () => openTeamSheet(n === 'TEAM A' ? 'a' : 'b', i); }
      d.appendChild(r);
    });
    $('teams').appendChild(d);
  });
  $('toss').textContent = md.toss ? '🪙 ' + md.toss.winner + ' won the toss and will ' + md.toss.choice : '';
  // organiser
  $('admin').classList.toggle('hide', !STATE.admin);
  $('a-clear').classList.toggle('hide', !(t && t.a));
  const base = location.origin + location.pathname + '?m=' + MID;
  $('l-player').textContent = base; $('l-admin').textContent = base + '&k=' + KEY;
}

// ---------- me ----------
function myName() {
  const n = $('me-name').value.trim().slice(0, 30);
  if (!n) { $('me-name').focus(); toast('Type your name first'); return ''; }
  try { localStorage.setItem('md_name', n); } catch (e) {}
  return n;
}
$('b-in').onclick = () => { const n = myName(); if (n) act(() => call('join', { pid: PID, name: n, status: 'in' }).then(() => toast("You're in!"))); };
$('b-maybe').onclick = () => { const n = myName(); if (n) act(() => call('join', { pid: PID, name: n, status: 'maybe', note: '70:30' })); };
$('b-out').onclick = () => { const n = myName(); if (n) act(() => call('join', { pid: PID, name: n, status: 'out' })); };

// ---------- organiser ----------
$('a-add').onclick = () => {
  const n = $('a-name').value.trim().slice(0, 30); if (!n) return;
  act(() => call('admin_add', { name: n, status: 'in' }).then(() => { $('a-name').value = ''; toast(n + ' added'); }));
};
function openSheet(p) { sheetPid = p.pid; $('s-name').textContent = p.name; $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }
$('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
$('s-x').onclick = closeSheet;
$('s-came').onclick = () => { closeSheet(); act(() => call('admin_came', { pid: sheetPid, came: true })); };
$('s-no').onclick = () => { closeSheet(); act(() => call('admin_came', { pid: sheetPid, came: false })); };
$('s-in').onclick = () => { closeSheet(); act(() => call('admin_status', { pid: sheetPid, status: 'in' })); };
$('s-maybe').onclick = () => { closeSheet(); act(() => call('admin_status', { pid: sheetPid, status: 'maybe' })); };
$('s-rm').onclick = () => { const p = sheetPid; closeSheet(); if (confirm('Remove from the list?')) act(() => call('admin_remove', { pid: p })); };

// Fair teams: everyone playing (not marked "didn't come"), strongest first by the scorer's stats, dealt
// A-B-B-A so the two sides' totals stay close; players with no stats are spread at random in the middle.
function rating(name) {
  const s = STATS[name.toLowerCase()];
  if (!s || !s.matches) return null;
  return s.runs / s.matches + 15 * (s.wickets_taken || 0) / s.matches + 3 * (s.catches || 0) / s.matches;
}
function makeTeams() {
  const g = groups();
  const ps = g.playing.filter(p => p.came !== false).map(p => p.name);
  if (ps.length < 2) { toast('Need at least 2 players'); return null; }
  const rated = ps.map(n => ({ n, r: rating(n), j: Math.random() }));
  const avg = rated.filter(x => x.r !== null).reduce((a, x) => a + x.r, 0) / Math.max(1, rated.filter(x => x.r !== null).length) || 10;
  rated.forEach(x => { if (x.r === null) x.r = avg; x.r *= 0.85 + 0.3 * x.j; });   // a little luck, so a reshuffle changes things
  rated.sort((a, b) => b.r - a.r);
  const A = [], B = [];
  rated.forEach((x, i) => ((i % 4 === 0 || i % 4 === 3) ? A : B).push(x.n));
  return Math.random() < 0.5 ? { a: A, b: B } : { a: B, b: A };
}
$('a-teams').onclick = () => { const t = makeTeams(); if (t) act(() => call('admin_teams', { teams: t }).then(() => toast('Teams made - tap again to reshuffle'))); };
// Moving a player between teams, or making them captain (captain = first in the list).
let tSide = '', tIdx = -1;
function openTeamSheet(side, i) {
  tSide = side; tIdx = i;
  $('t-name').textContent = STATE.md.teams[side][i];
  $('t-move').textContent = 'Move to ' + (side === 'a' ? 'Team B' : 'Team A');
  $('t-cap').classList.toggle('hide', i === 0);
  $('tsheet').classList.add('on');
}
function closeTeamSheet() { $('tsheet').classList.remove('on'); }
$('tsheet').onclick = e => { if (e.target.id === 'tsheet') closeTeamSheet(); };
$('t-x').onclick = closeTeamSheet;
$('t-move').onclick = () => {
  const t = JSON.parse(JSON.stringify(STATE.md.teams)), other = tSide === 'a' ? 'b' : 'a';
  const [nm] = t[tSide].splice(tIdx, 1); t[other].push(nm);
  closeTeamSheet(); act(() => call('admin_teams', { teams: t }).then(() => toast(nm + ' moved')));
};
$('t-cap').onclick = () => {
  const t = JSON.parse(JSON.stringify(STATE.md.teams));
  const [nm] = t[tSide].splice(tIdx, 1); t[tSide].unshift(nm);
  closeTeamSheet(); act(() => call('admin_teams', { teams: t }).then(() => toast(nm + ' is captain')));
};
$('a-clear').onclick = () => act(() => call('admin_teams', { teams: null }));
$('a-toss').onclick = () => {
  const t = STATE.md.teams, sides = t && t.a ? ['Team A (' + t.a[0] + ')', 'Team B (' + t.b[0] + ')'] : ['Team A', 'Team B'];
  const toss = { winner: sides[Math.random() < 0.5 ? 0 : 1], choice: Math.random() < 0.5 ? 'bat' : 'bowl', at: Date.now() };
  act(() => call('admin_toss', { toss }));
};
$('a-copy').onclick = async () => { try { await navigator.clipboard.writeText($('l-admin').textContent); toast('Organiser link copied'); } catch (e) { prompt('Copy this link', $('l-admin').textContent); } };
$('a-new').onclick = () => { location.href = location.pathname; };

// ---------- WhatsApp: the same numbered list the group already uses ----------
$('share').onclick = () => {
  const md = STATE.md, g = groups();
  let t = '🏏 ' + (md.title || 'Box cricket') + ' — ' + dayShort(md.day) + '\n' + [md.time_text, md.court, md.venue].filter(Boolean).join(' · ') + '\n\n';
  g.playing.forEach((p, i) => t += String(i + 1).padStart(2, ' ') + '. ' + p.name + '\n');
  if (g.waiting.length) t += '\nWaiting: ' + g.waiting.map(p => p.name).join(', ') + '\n';
  if (g.maybe.length) t += '\nMaybe: ' + g.maybe.map(p => p.name + ' ' + (p.note || '70:30')).join(', ') + '\n';
  const tm = md.teams;
  if (tm && tm.a) t += '\nTeam A: ' + tm.a.join(', ') + '\nTeam B: ' + tm.b.join(', ') + '\n';
  if (md.toss) t += md.toss.winner + ' won the toss, will ' + md.toss.choice + '\n';
  t += '\nIn / out here 👉 ' + location.origin + location.pathname + '?m=' + MID;
  location.href = 'https://wa.me/?text=' + encodeURIComponent(t);
};

// ---------- create ----------
$('c-go').onclick = () => act(async () => {
  $('c-err').textContent = '';
  const j = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create',
    day: $('c-day').value, time: $('c-time').value, venue: $('c-venue').value, court: $('c-court').value, max: $('c-max').value }) }).then(r => r.json());
  if (!j.ok) { $('c-err').textContent = 'Could not create - try again'; return; }
  try { localStorage.setItem('md_key_' + j.id, j.key); } catch (e) {}
  location.href = location.pathname + '?m=' + j.id + '&k=' + j.key;
});

// ---------- start ----------
// Names (and stats for fair teams) from the scorer's players.
fetch(SCORER, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'list_all_players' }) })
  .then(r => r.json()).then(d => {
    (d.players || []).forEach(p => { if (p && p.name) STATS[p.name.toLowerCase()] = p; });
    const dl = $('known'); Object.values(STATS).forEach(p => { const o = document.createElement('option'); o.value = p.name; dl.appendChild(o); });
    if (STATE) render();
  }).catch(() => {});
try { const n = localStorage.getItem('md_name'); if (n) $('me-name').value = n; } catch (e) {}
if (!MID) {
  $('loadmsg').classList.add('hide'); $('create').classList.remove('hide');
  $('c-day').value = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
} else {
  const refresh = () => call('get').catch(() => { if (!STATE) $('loadmsg').textContent = 'Could not load this match day. Check the link.'; });
  refresh();
  // Keep the list fresh while the page is open.
  setInterval(() => { if (!document.hidden && !busy && !$('sheet').classList.contains('on') && !$('tsheet').classList.contains('on')) refresh(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
}
</script>
</body>
</html>
